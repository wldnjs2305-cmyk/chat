<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>캐릭터 대화</title>
<style>
  :root{
    --ink:#17151F;
    --surface:#211E2B;
    --raised:#2A2634;
    --line:#37324A;
    --text:#EBE6F2;
    --muted:#948CA6;
    --plum:#9A6FB0;
    --plum-soft:#5C3F73;
    /* 괄호 속 번역을 위한 부드러운 연한 회색 */
    --trans-gray:#9A94A8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    font-size:16px;
    line-height:1.6;
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100dvh}

  /* 상단 바 */
  #bar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  #bar .ttl{flex:1;min-width:0}
  #bar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{
    flex:0 0 auto;border:0;background:transparent;color:var(--text);
    font-size:15px;padding:8px 10px;border-radius:10px;cursor:pointer;
  }
  .iconbtn:active{background:var(--raised)}

  /* 본문 */
  #view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(env(safe-area-inset-bottom) + 24px)}
  #view.chat{padding-bottom:12px}

  /* 목록 */
  .card{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;
  }
  .card:active{background:var(--raised)}
  .ava{
    flex:0 0 auto;width:44px;height:44px;border-radius:12px;
    background:var(--raised);display:flex;align-items:center;justify-content:center;
    font-size:22px;overflow:hidden;
  }
  .ava img{width:100%;height:100%;object-fit:cover}
  .card .meta{flex:1;min-width:0}
  .card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .ds{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px;line-height:1.9}

  /* 버튼 */
  .btn{
    width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;
    cursor:pointer;margin-top:10px;
  }
  .btn:active{background:var(--raised)}
  .btn.primary{background:var(--plum);border-color:var(--plum);color:#fff;font-weight:600}
  .btn.subtle{background:var(--raised);border-color:var(--line);font-size:14px;padding:10px}
  .btn.danger{color:#E08585}
  .row{display:flex;gap:8px}
  .row .btn{margin-top:10px}

  /* 칩 및 작은 링크 버튼 */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{
    background:var(--raised);border:1px solid var(--line);color:var(--muted);
    font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;
  }
  .chip:hover, .chip:active{border-color:var(--plum);color:var(--text)}

  /* 폼 */
  label{display:block;margin:18px 0 6px;font-size:13px;color:var(--muted)}
  label:first-of-type{margin-top:4px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  input,textarea,select{
    width:100%;padding:12px;border-radius:11px;
    border:1px solid var(--line);background:var(--surface);color:var(--text);
    font-size:15px;font-family:inherit;line-height:1.6;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--plum)}
  textarea{resize:vertical;min-height:90px}
  .sec{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--plum);font-weight:600}
  .sec:first-child{margin-top:0;padding-top:0;border-top:0}

  .input-btn-wrap{position:relative}
  .input-btn-wrap input{padding-right:54px}
  .inner-btn{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;color:var(--plum);font-size:12px;cursor:pointer;padding:6px;
  }

  /* 모달 */
  .modal-wrap{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.65);z-index:999;display:flex;align-items:flex-end;
  }
  .modal-box{
    width:100%;background:var(--surface);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:18px 16px 28px;max-height:80vh;display:flex;flex-direction:column;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .modal-ttl{font-size:16px;font-weight:600}
  .modal-body{overflow-y:auto;flex:1}
  .prof-item{
    background:var(--raised);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .prof-item:hover{border-color:var(--plum)}

  /* 대화 */
  .msg{margin-bottom:18px;max-width:88%}
  .msg.me{margin-left:auto}
  .who{font-size:12px;color:var(--muted);margin-bottom:5px}
  .msg.me .who{text-align:right}
  .bub{
    padding:11px 14px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line);
    white-space:pre-wrap;word-break:break-word;
  }
  .msg.me .bub{background:var(--plum-soft);border-color:transparent}
  .bub em{color:var(--muted);font-style:italic}
  
  /* [요청 반영] 일본어 뒤 괄호 속 연한 회색 번역 스타일 */
  .bub .trans, .preview-box .trans{
    color:var(--trans-gray);
    font-weight:400;
  }

  .thinking{color:var(--muted);font-size:14px;padding:4px 2px 18px}
  .err{
    background:#3A2230;border:1px solid #6B3348;color:#F0C4D0;
    padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:18px;
    white-space:pre-wrap;word-break:break-word;
  }
  .preview-box{
    background:var(--raised);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14px;line-height:1.6;
  }

  /* 입력창 하단 */
  #dock{
    flex:0 0 auto;border-top:1px solid var(--line);background:var(--surface);
    padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
  }
  #dock .tools{display:flex;gap:14px;padding:0 2px 8px}
  #dock .tools button{
    background:transparent;border:0;color:var(--muted);font-size:13px;
    font-family:inherit;padding:0;cursor:pointer;
  }
  #dock .line{display:flex;gap:8px;align-items:flex-end}
  #inp{flex:1;min-height:44px;max-height:140px;border-radius:22px;padding:11px 16px}
  #send{
    flex:0 0 auto;width:44px;height:44px;border-radius:22px;border:0;
    background:var(--plum);color:#fff;font-size:17px;cursor:pointer;
  }
  #send:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <button class="iconbtn" id="left"></button>
    <div class="ttl"><h1 id="title">캐릭터</h1><div class="sub" id="subtitle"></div></div>
    <button class="iconbtn" id="right"></button>
  </header>
  <main id="view"></main>
  <div id="dock" style="display:none">
    <div class="tools">
      <button id="regen">다시 생성</button>
      <button id="undo">마지막 지우기</button>
      <button id="reset">대화 초기화</button>
    </div>
    <div class="line">
      <textarea id="inp" rows="1" placeholder="메시지"></textarea>
      <button id="send">↑</button>
    </div>
  </div>
</div>

<div id="modalSlot"></div>

<script>
(function(){
"use strict";

/* ---------- 저장소 ---------- */
var mem = {};
var canStore = (function(){
  try { localStorage.setItem("gz.t","1"); localStorage.removeItem("gz.t"); return true; }
  catch(e){ return false; }
})();
function put(k,v){
  var s = JSON.stringify(v);
  if (canStore) { try { localStorage.setItem(k,s); return; } catch(e){} }
  mem[k]=s;
}
function get(k,d){
  var s = null;
  if (canStore) { try { s = localStorage.getItem(k); } catch(e){} }
  if (s===null) s = mem[k];
  if (s===null || s===undefined) return d;
  try { return JSON.parse(s); } catch(e){ return d; }
}

/* ---------- 환경설정 (API 및 언어) ---------- */
var cfg = get("gz.cfg", {
  type: "openai", // "openai" (OpenAI 호환/브릿지) 또는 "gemini"
  key: "",
  base: "https://bridge-production-b13b.up.railway.app/v1",
  model: "gemini-3.7-flash",
  maxTokens: 2000,
  lang: "jp_ko", // "jp_ko" (일본어 + 괄호 연한 회색 한국어 번역), "ko" (한국어 기본)
  profiles: [
    {
      name: "기본 Railway 브릿지",
      type: "openai",
      base: "https://bridge-production-b13b.up.railway.app/v1",
      key: "",
      model: "gemini-3.7-flash",
      maxTokens: 2000
    }
  ]
});

// 하위 호환성 보장
if (!cfg.type) cfg.type = "openai";
if (!cfg.profiles) cfg.profiles = [];
if (!cfg.lang) cfg.lang = "jp_ko";

var chars = get("gz.chars", []);
function saveCfg(){ put("gz.cfg", cfg); }
function saveChars(){ put("gz.chars", chars); }
function logKey(id){ return "gz.log."+id; }
function getLog(id){ return get(logKey(id), []); }
function setLog(id,l){ put(logKey(id), l); }

/* ---------- 도구 및 텍스트 파서 ---------- */
var $ = function(s){ return document.querySelector(s); };
var view=$("#view"), bar=$("#bar"), dock=$("#dock"), modalSlot=$("#modalSlot");
var elTitle=$("#title"), elSub=$("#subtitle"), elLeft=$("#left"), elRight=$("#right");
var elInp=$("#inp"), elSend=$("#send");

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* [핵심] 지문 *지문* 처리 및 일본어 뒤 (번역)을 연한 회색 span으로 포맷 */
function fmt(s){
  var text = esc(s);
  // 1. *지문* 처리
  text = text.replace(/\*([^*\n]+)\*/g, "<em>*$1*</em>");
  // 2. 괄호 안 번역 (한국어 번역) 또는 （번역）을 연한 회색으로 감쌈
  text = text.replace(/(\([^\)\n]+\)|（[^）\n]+）)/g, '<span class="trans">$1</span>');
  return text;
}

function avaHTML(v, fallback){
  var s = (v||"").trim();
  if (/^https?:\/\//i.test(s)) return '<div class="ava"><img src="'+esc(s)+'" alt=""></div>';
  return '<div class="ava">'+esc(s||fallback)+"</div>";
}
function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- 화면 전환 ---------- */
var screen = "list", curId = null, busy = false;

function go(s, id){
  screen = s; if (id !== undefined) curId = id;
  render();
}
function cur(){
  for (var i=0;i<chars.length;i++) if (chars[i].id===curId) return chars[i];
  return null;
}

function render(){
  view.className = "";
  dock.style.display = "none";
  modalSlot.innerHTML = "";
  elLeft.textContent = ""; elRight.textContent = "";
  elLeft.onclick = null; elRight.onclick = null;

  if (screen==="list") return viewList();
  if (screen==="chat") return viewChat();
  if (screen==="edit") return viewEdit();
  if (screen==="cfg")  return viewCfg();
}

/* ---------- 1. 캐릭터 목록 ---------- */
function viewList(){
  elTitle.textContent = "캐릭터";
  elSub.textContent = chars.length ? chars.length+"명" : "";
  elRight.textContent = "설정";
  elRight.onclick = function(){ go("cfg"); };

  var h = "";
  if (!chars.length){
    h += '<div class="empty">아직 캐릭터가 없어.<br>새 캐릭터를 추가해 대화를 시작해봐.</div>';
  } else {
    for (var i=0;i<chars.length;i++){
      var c = chars[i], n = getLog(c.id).length;
      h += '<div class="card" data-open="'+c.id+'">'
         + avaHTML(c.avatar,"🙂")
         + '<div class="meta"><div class="nm">'+esc(c.name||"이름 없음")+'</div>'
         + '<div class="ds">'+esc(c.tagline || (n? n+"개의 메시지" : "아직 대화 없음"))+'</div></div>'
         + '</div>';
    }
  }
  h += '<button class="btn primary" id="new">새 캐릭터</button>';
  if (!cfg.key) h += '<div class="hint" style="text-align:center;margin-top:12px">대화하려면 우측 상단 설정에서 API 키를 먼저 넣어줘.</div>';
  view.innerHTML = h;

  $("#new").onclick = function(){
    var c = {
      id:uid(), name:"", avatar:"", tagline:"", prompt:"", world:"",
      greeting:"", userName:"", userAvatar:"", userPrompt:"", length:"보통"
    };
    chars.push(c); saveChars(); go("edit", c.id);
  };
  Array.prototype.forEach.call(view.querySelectorAll("[data-open]"), function(el){
    el.onclick = function(){ go("chat", el.getAttribute("data-open")); };
  });
}

/* ---------- 2. 캐릭터 편집 ---------- */
function field(label, key, val, ph, big, hint){
  var tag = big
    ? '<textarea data-k="'+key+'" placeholder="'+esc(ph)+'" style="min-height:'+big+'px">'+esc(val)+'</textarea>'
    : '<input data-k="'+key+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'">';
  return '<label>'+esc(label)+'</label>'+tag+(hint?'<div class="hint">'+hint+'</div>':"");
}

function viewEdit(){
  var c = cur(); if (!c) return go("list");
  elTitle.textContent = "캐릭터 설정";
  elSub.textContent = c.name || "";
  elLeft.textContent = "← 목록";
  elLeft.onclick = function(){ saveChars(); go("list"); };

  var h = "";
  h += '<div class="sec">캐릭터</div>';
  h += field("이름","name",c.name,"이치조 미나토");
  h += field("프로필 사진","avatar",c.avatar,"이모지 또는 이미지 주소",0,"이모지나 웹 이미지 URL을 입력.");
  h += field("한 줄 소개","tagline",c.tagline,"나고야 이치조 가문의 후계자");
  h += field("캐릭터 프롬프트","prompt",c.prompt,"성격, 배경, 말투, 습관, 관계 등을 적어줘.",160);
  h += field("세계관 / 상황","world",c.world,"지금 어떤 상황에서 시작하는지.",100);
  h += field("첫 마디","greeting",c.greeting,"*눈이 마주치자 살짝 미소를 짓는다* 늦었네.",90);

  h += '<div class="sec">나</div>';
  h += field("내 이름","userName",c.userName,"시라유키 히나");
  h += field("내 프로필 사진","userAvatar",c.userAvatar,"이모지 또는 이미지 주소");
  h += field("내 캐릭터 프롬프트","userPrompt",c.userPrompt,"내가 연기하는 인물의 설정.",100);

  h += '<div class="sec">응답</div>';
  h += '<label>길이</label><select data-k="length">'
     + ["짧게","보통","길게"].map(function(o){
         return '<option'+(c.length===o?" selected":"")+'>'+o+"</option>"; }).join("")
     + "</select>";

  h += '<button class="btn primary" id="done">저장하고 대화하기</button>';
  h += '<button class="btn danger" id="del">이 캐릭터 삭제</button>';
  view.innerHTML = h;

  Array.prototype.forEach.call(view.querySelectorAll("[data-k]"), function(el){
    el.oninput = el.onchange = function(){ c[el.getAttribute("data-k")] = el.value; saveChars(); };
  });
  $("#done").onclick = function(){ saveChars(); go("chat", c.id); };
  $("#del").onclick = function(){
    if (!confirm((c.name||"이 캐릭터")+" 삭제할까? 대화 내용도 같이 지워져.")) return;
    chars = chars.filter(function(x){ return x.id!==c.id; });
    saveChars(); put(logKey(c.id), []); go("list");
  };
}

/* ---------- 3. [요청 반영] 설정 (API 추가/프로필 + 일본어 언어 추가) ---------- */
function viewCfg(){
  elTitle.textContent = "설정";
  elSub.textContent = "";
  elLeft.textContent = "← 목록";
  elLeft.onclick = function(){ go("list"); };

  var h = "";

  // [언어 추가 기능]
  h += '<div class="sec">언어 및 출력 방식</div>';
  h += '<label>응답 언어 모드</label>';
  h += '<select id="langMode">'
     + '<option value="jp_ko"'+(cfg.lang==="jp_ko"?" selected":"")+'>일본어 (번역) 병기 모드</option>'
     + '<option value="ko"'+(cfg.lang==="ko"?" selected":"")+'>한국어 기본 모드</option>'
     + '</select>';
  h += '<div class="hint">일본어 병기 모드 선택 시, 캐릭터가 일본어로 말하고 뒤에 괄호로 한국어 번역이 연한 회색으로 함께 출력됩니다.</div>';
  
  // 실시간 미리보기 상자
  h += '<div class="preview-box" id="previewLang">'
     + (cfg.lang==="jp_ko" 
        ? 'こんにちは！ <span class="trans">(안녕하세요!)</span><br>*軽く会釈する* 今日もよろしくね。 <span class="trans">(*가볍게 목례한다* 오늘도 잘 부탁해.)</span>' 
        : '안녕하세요! 오늘도 잘 부탁해.')
     + '</div>';

  // [스크린샷 완벽 재현] API 종류 / URL / Key / Model / MaxTokens
  h += '<div class="sec">API 연결</div>';
  
  h += '<label>API 종류</label>';
  h += '<select id="apiType">'
     + '<option value="openai"'+(cfg.type==="openai"?" selected":"")+'>직접 입력 · OpenAI 호환 (Railway/중계/v1)</option>'
     + '<option value="gemini"'+(cfg.type==="gemini"?" selected":"")+'>Google Gemini 직접 연결 (v1beta)</option>'
     + '</select>';

  h += '<label>API URL</label>';
  h += '<input id="b" value="'+esc(cfg.base)+'" placeholder="https://bridge-production-b13b.up.railway.app/v1" autocapitalize="off" autocorrect="off" spellcheck="false">';

  h += '<label>API Key</label>';
  h += '<div class="input-btn-wrap">'
     + '<input id="k" type="password" value="'+esc(cfg.key)+'" placeholder="API 키 입력" autocapitalize="off" autocorrect="off" spellcheck="false">'
     + '<button type="button" class="inner-btn" id="toggleKey">보기</button>'
     + '</div>';

  h += '<label>모델</label>';
  h += '<input id="m" value="'+esc(cfg.model)+'" placeholder="gemini-3.7-flash" autocapitalize="off" spellcheck="false">';
  h += '<div class="chips">'
     + '<span style="font-size:12px;color:var(--muted);align-self:center">추천 모델:</span>'
     + '<button type="button" class="chip" data-chip="gemini-3.7-flash">gemini-3.7-flash</button>'
     + '<button type="button" class="chip" data-chip="gemini-2.5-flash">gemini-2.5-flash</button>'
     + '<button type="button" class="chip" data-chip="gpt-4o-mini">gpt-4o-mini</button>'
     + '</div>';

  h += '<label>맥스 토큰</label>';
  h += '<input id="t" value="'+esc(cfg.maxTokens)+'" inputmode="numeric" placeholder="2000">';

  // [API 프로필 추가 및 연결 테스트 액션 버튼]
  h += '<div class="row" style="margin-top:16px">';
  h += '<button class="btn subtle" id="saveProfBtn" style="flex:1">+ 새 API 프로필로 저장</button>';
  h += '<button class="btn subtle" id="openProfBtn" style="flex:1">저장된 프로필 ('+cfg.profiles.length+')</button>';
  h += '</div>';

  h += '<button class="btn subtle" id="testBtn" style="margin-top:8px">연결 테스트</button>';
  h += '<div id="testStatus" class="hint" style="text-align:center"></div>';

  // 백업
  h += '<div class="sec">데이터 백업</div>';
  h += '<div class="hint">브라우저 저장 공간이 정리될 때를 대비해 가끔 내보내서 메모장에 저장해두세요.</div>';
  h += '<button class="btn subtle" id="exp">전체 내보내기</button>';
  h += '<label>불러오기</label><textarea id="impbox" placeholder="내보낸 JSON 데이터를 여기에 붙여넣기"></textarea>';
  h += '<button class="btn subtle" id="imp">불러오기</button>';

  view.innerHTML = h;

  // 이벤트 바인딩
  $("#langMode").onchange = function(){
    cfg.lang = this.value;
    saveCfg();
    $("#previewLang").innerHTML = (cfg.lang==="jp_ko" 
      ? 'こんにちは！ <span class="trans">(안녕하세요!)</span><br>*軽く会釈する* 今日もよろしくね。 <span class="trans">(*가볍게 목례한다* 오늘도 잘 부탁해.)</span>' 
      : '안녕하세요! 오늘도 잘 부탁해.');
  };

  $("#apiType").onchange = function(){ cfg.type = this.value; saveCfg(); };
  $("#b").oninput = function(){ cfg.base = this.value.trim().replace(/\/+$/,""); saveCfg(); };
  $("#k").oninput = function(){ cfg.key = this.value.trim(); saveCfg(); };
  $("#m").oninput = function(){ cfg.model = this.value.trim(); saveCfg(); };
  $("#t").oninput = function(){ cfg.maxTokens = parseInt(this.value,10)||2000; saveCfg(); };

  // 비밀번호 보기 토글
  $("#toggleKey").onclick = function(){
    var input = $("#k");
    if (input.type === "password"){
      input.type = "text";
      this.textContent = "숨기기";
    } else {
      input.type = "password";
      this.textContent = "보기";
    }
  };

  // 추천 모델 칩
  Array.prototype.forEach.call(view.querySelectorAll("[data-chip]"), function(btn){
    btn.onclick = function(){
      var modelName = btn.getAttribute("data-chip");
      $("#m").value = modelName;
      cfg.model = modelName;
      saveCfg();
    };
  });

  // 새 API 프로필로 저장
  $("#saveProfBtn").onclick = function(){
    var name = prompt("새 프로필 이름을 입력해주세요:", "프로필 " + (cfg.profiles.length + 1));
    if (!name || !name.trim()) return;
    cfg.profiles.push({
      name: name.trim(),
      type: cfg.type,
      base: cfg.base,
      key: cfg.key,
      model: cfg.model,
      maxTokens: cfg.maxTokens
    });
    saveCfg();
    alert("'" + name + "' 프로필이 저장되었습니다.");
    viewCfg();
  };

  // 저장된 API 프로필 열기 모달
  $("#openProfBtn").onclick = function(){
    showProfilesModal();
  };

  // 연결 테스트 실행
  $("#testBtn").onclick = function(){
    var statusEl = $("#testStatus");
    statusEl.textContent = "연결 확인 중...";
    statusEl.style.color = "var(--plum)";

    if (!cfg.key && cfg.type !== "openai"){
      statusEl.textContent = "API 키가 입력되지 않았습니다.";
      statusEl.style.color = "#E08585";
      return;
    }

    var dummyLog = [{ r:"u", t:"ping" }];
    callAPI({ name:"테스터" }, dummyLog).then(function(){
      statusEl.textContent = "✓ 연결 성공! 정상적으로 응답을 수신했습니다.";
      statusEl.style.color = "#85E0A3";
    }).catch(function(err){
      statusEl.textContent = "연결 실패: " + (err.message || "오류 발생");
      statusEl.style.color = "#E08585";
    });
  };

  // 백업
  $("#exp").onclick = function(){
    var out = { cfg:cfg, chars:chars, logs:{} };
    chars.forEach(function(c){ out.logs[c.id] = getLog(c.id); });
    var box = document.createElement("textarea");
    box.value = JSON.stringify(out);
    box.style.cssText = "width:100%;min-height:120px;margin-top:10px";
    this.parentNode.insertBefore(box, this.nextSibling);
    box.select();
    try { document.execCommand("copy"); alert("클립보드에 복사되었습니다. 메모장에 저장하세요."); }
    catch(e){ alert("아래 텍스트 박스를 복사하세요."); }
  };
  $("#imp").onclick = function(){
    var raw = $("#impbox").value.trim();
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (d.cfg) { cfg = d.cfg; saveCfg(); }
      if (d.chars) { chars = d.chars; saveChars(); }
      if (d.logs) for (var id in d.logs) setLog(id, d.logs[id]);
      alert("데이터를 성공적으로 불러왔습니다."); go("list");
    } catch(e){ alert("데이터 형식이 올바르지 않습니다."); }
  };
}

// 프로필 관리 팝업 모달
function showProfilesModal(){
  var h = '<div class="modal-wrap" id="mWrap">'
        + '<div class="modal-box">'
        + '<div class="modal-head">'
        + '<div class="modal-ttl">저장된 API 프로필</div>'
        + '<button class="iconbtn" id="mClose">닫기</button>'
        + '</div>'
        + '<div class="modal-body">';
  
  if (!cfg.profiles.length){
    h += '<div class="empty" style="padding:30px">저장된 프로필이 없습니다.</div>';
  } else {
    for (var i=0; i<cfg.profiles.length; i++){
      var p = cfg.profiles[i];
      h += '<div class="prof-item" data-load="'+i+'">'
         + '<div><b style="font-size:14px">'+esc(p.name)+'</b>'
         + '<div style="font-size:11px;color:var(--muted)">'+esc(p.model)+' · '+esc(p.base)+'</div></div>'
         + '<button class="iconbtn" data-del="'+i+'" style="color:#E08585;font-size:13px">삭제</button>'
         + '</div>';
    }
  }
  h += '</div></div></div>';
  modalSlot.innerHTML = h;

  $("#mClose").onclick = function(){ modalSlot.innerHTML = ""; };
  $("#mWrap").onclick = function(e){ if(e.target===this) modalSlot.innerHTML = ""; };

  Array.prototype.forEach.call(modalSlot.querySelectorAll("[data-load]"), function(el){
    el.onclick = function(e){
      if (e.target.tagName==="BUTTON") return;
      var idx = parseInt(el.getAttribute("data-load"), 10);
      var p = cfg.profiles[idx];
      cfg.type = p.type || "openai";
      cfg.base = p.base;
      cfg.key = p.key;
      cfg.model = p.model;
      cfg.maxTokens = p.maxTokens;
      saveCfg();
      modalSlot.innerHTML = "";
      alert("'" + p.name + "' 설정을 불러왔습니다.");
      viewCfg();
    };
  });

  Array.prototype.forEach.call(modalSlot.querySelectorAll("[data-del]"), function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var idx = parseInt(btn.getAttribute("data-del"), 10);
      if (confirm("'" + cfg.profiles[idx].name + "' 프로필을 삭제하시겠습니까?")){
        cfg.profiles.splice(idx, 1);
        saveCfg();
        showProfilesModal();
      }
    };
  });
}

/* ---------- 4. 대화 화면 ---------- */
function viewChat(){
  var c = cur(); if (!c) return go("list");
  elTitle.textContent = c.name || "이름 없음";
  elSub.textContent = (cfg.lang === "jp_ko" ? "[일본어 (번역)] " : "") + (c.tagline || "");
  elLeft.textContent = "← 목록";
  elLeft.onclick = function(){ go("list"); };
  elRight.textContent = "설정";
  elRight.onclick = function(){ go("edit", c.id); };

  view.className = "chat";
  dock.style.display = "block";

  var log = getLog(c.id);
  if (!log.length && c.greeting){
    log = [{ r:"a", t:c.greeting }];
    setLog(c.id, log);
  }
  paint();
}

function paint(err, thinking){
  var c = cur(); if (!c) return;
  var log = getLog(c.id), h = "";
  for (var i=0;i<log.length;i++){
    var m = log[i], me = m.r==="u";
    h += '<div class="msg'+(me?" me":"")+'">'
       + '<div class="who">'+esc(me ? (c.userName||"나") : (c.name||"상대"))+"</div>"
       + '<div class="bub">'+fmt(m.t)+"</div></div>";
  }
  if (thinking) h += '<div class="thinking">'+esc(c.name||"상대")+" 입력 중…</div>";
  if (err) h += '<div class="err">'+esc(err)+"</div>";
  if (!log.length && !thinking && !err)
    h += '<div class="empty">메시지를 보내 대화를 시작해보세요.</div>';
  view.innerHTML = h;
  view.scrollTop = view.scrollHeight;
}

/* [프롬프트 생성기: 일본어 + 괄호 연한 회색 번역 규칙 포함] */
function buildSystem(c){
  var lenMap = {
    "짧게":"2~3문장으로 짧게",
    "보통":"4~6문장 정도로",
    "길게":"8~12문장으로 묘사를 충분히 넣어"
  };
  var p = [];
  p.push("너는 상황극 파트너다. 아래 설정의 '"+(c.name||"캐릭터")+"'를 완벽히 연기한다.");
  p.push("");
  p.push("[캐릭터]");
  p.push("이름: "+(c.name||""));
  if (c.tagline) p.push(c.tagline);
  if (c.prompt) p.push(c.prompt);
  if (c.world){ p.push(""); p.push("[상황과 세계관]"); p.push(c.world); }
  p.push("");
  p.push("[상대역]");
  p.push("이름: "+(c.userName||"상대"));
  if (c.userPrompt) p.push(c.userPrompt);
  p.push("");
  p.push("[작성 규칙]");
  p.push("- "+(c.name||"캐릭터")+"의 시점에서만 쓴다. 상대역의 대사, 행동, 속마음을 대신 서술하지 않는다.");
  p.push("- 행동과 상황 묘사는 *별표* 안에 쓴다. 대사는 별표 없이 그대로 쓴다.");
  p.push("- 분량은 "+(lenMap[c.length]||lenMap["보통"])+" 쓴다.");
  p.push("- 이야기를 마무리 짓지 말고 상대가 이어갈 여지를 남긴다.");

  // [일본어 (번역) 언어 모드 규칙 주입]
  if (cfg.lang === "jp_ko") {
    p.push("");
    p.push("[언어 및 번역 표기 규칙 - 필수]");
    p.push("1. 모든 대사와 행동 지문은 자연스러운 일본어로 먼저 작성한다.");
    p.push("2. 각 일본어 문장(또는 지문) 바로 뒤에 반드시 한국어 번역을 괄호 '( ... )' 안에 병기한다.");
    p.push("3. 반드시 '일본어 문장 (한국어 번역)' 형식을 지켜라.");
    p.push("예시:");
    p.push("こんにちは、調子はどう？ (안녕, 컨디션은 어때?)");
    p.push("*優しく微笑みながら首をかしげる* (*상냥하게 미소 지으며 고개를 갸웃거린다*) 何を考えているの？ (무슨 생각해?)");
  } else {
    p.push("- 한국어로 작성한다.");
  }

  return p.join("\n");
}

/* [API 통신 엔진: OpenAI 호환(브릿지) 및 Gemini 양방향 지원] */
function callAPI(c, log){
  var sysPrompt = buildSystem(c);

  // 1. OpenAI 호환 브릿지 엔드포인트 호출 (/v1/chat/completions)
  if (cfg.type === "openai" || cfg.base.indexOf("/v1") !== -1) {
    var url = cfg.base.replace(/\/+$/, "") + "/chat/completions";
    var messages = [{ role: "system", content: sysPrompt }];

    for (var i=0; i<log.length; i++){
      messages.push({
        role: log[i].r === "u" ? "user" : "assistant",
        content: log[i].t
      });
    }

    var headers = { "Content-Type": "application/json" };
    if (cfg.key) headers["Authorization"] = "Bearer " + cfg.key;

    return fetch(url, {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        model: cfg.model,
        messages: messages,
        max_tokens: cfg.maxTokens
      })
    }).then(function(res){
      return res.text().then(function(txt){
        var data = null;
        try { data = JSON.parse(txt); } catch(e){}
        if (!res.ok){
          var msg = (data && data.error && (data.error.message || data.error)) || txt.slice(0, 300);
          throw new Error("서버 오류 (" + res.status + "):\n" + msg);
        }
        var reply = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (!reply) throw new Error("응답이 비어 있습니다. 모델명이나 토큰 설정을 확인하세요.");
        return reply.trim();
      });
    });
  }

  // 2. Google Gemini 직접 연결 (v1beta)
  var contents = log.map(function(m){
    return { role: m.r==="u" ? "user" : "model", parts:[{ text:m.t }] };
  });
  if (contents.length && contents[0].role==="model")
    contents.unshift({ role:"user", parts:[{ text:"(상황 시작)" }] });

  var gUrl = cfg.base.replace(/\/+$/, "") + "/v1beta/models/" + encodeURIComponent(cfg.model)
           + ":generateContent?key=" + encodeURIComponent(cfg.key);

  return fetch(gUrl, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      systemInstruction:{ parts:[{ text: sysPrompt }] },
      contents: contents,
      generationConfig:{ maxOutputTokens: cfg.maxTokens }
    })
  }).then(function(res){
    return res.text().then(function(txt){
      var data = null;
      try { data = JSON.parse(txt); } catch(e){}
      if (!res.ok){
        var msg = (data && data.error && data.error.message) || txt.slice(0,300);
        throw new Error("서버 오류 (" + res.status + "):\n" + msg);
      }
      var cand = data && data.candidates && data.candidates[0];
      if (!cand) throw new Error("응답이 비어 있습니다. 키 또는 모델 이름을 확인하세요.");
      var parts = (cand.content && cand.content.parts) || [];
      var out = parts.map(function(p){ return p.text || ""; }).join("").trim();
      if (!out) throw new Error("본문이 비어 있습니다.");
      return out;
    });
  });
}

function turn(){
  var c = cur(); if (!c || busy) return;
  if (!cfg.key && cfg.type !== "openai"){ paint("API 키가 없습니다. 오른쪽 위 설정에서 입력해주세요."); return; }
  busy = true; elSend.disabled = true;
  paint(null, true);

  callAPI(c, getLog(c.id)).then(function(text){
    var log = getLog(c.id);
    log.push({ r:"a", t:text });
    setLog(c.id, log);
    busy = false; elSend.disabled = false;
    paint();
  }).catch(function(e){
    busy = false; elSend.disabled = false;
    paint(e.message || "연결에 실패했습니다. 설정과 네트워크를 확인해주세요.");
  });
}

elSend.onclick = function(){
  var c = cur(); if (!c || busy) return;
  var t = elInp.value.trim(); if (!t) return;
  var log = getLog(c.id);
  log.push({ r:"u", t:t });
  setLog(c.id, log);
  elInp.value = ""; elInp.style.height = "auto";
  paint();
  turn();
};
elInp.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 140) + "px";
});

$("#regen").onclick = function(){
  var c = cur(); if (!c || busy) return;
  var log = getLog(c.id);
  while (log.length && log[log.length-1].r==="a") log.pop();
  setLog(c.id, log);
  paint(); turn();
};
$("#undo").onclick = function(){
  var c = cur(); if (!c || busy) return;
  var log = getLog(c.id);
  log.pop(); setLog(c.id, log); paint();
};
$("#reset").onclick = function(){
  var c = cur(); if (!c || busy) return;
  if (!confirm("대화를 처음부터 다시 시작할까요?")) return;
  setLog(c.id, c.greeting ? [{ r:"a", t:c.greeting }] : []);
  paint();
};

render();
})();
</script>
