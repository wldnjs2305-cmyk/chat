<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" id="tc" content="#FFFFFF">
<title>캐릭터 대화</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@400;600&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Gowun+Dodum&family=Gowun+Batang&family=Song+Myung&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Gaegu&family=Hi+Melody&family=Black+Han+Sans&display=swap">
<style>
  @font-face{font-family:"RIDIBatang";font-display:swap;
    src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/RIDIBatang.woff") format("woff")}
  @font-face{font-family:"MaruBuri";font-display:swap;
    src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/MaruBuri-Regular.woff") format("woff")}
  :root{
    color-scheme:light;
    --bg:#FFFFFF; --panel:#FFFFFF; --field:#F4F3F7; --line:#E7E5EC;
    --text:#191820; --muted:#8B8896; --bub:#EFEEF2; --mine:#E3DFF6;
    --nar:#8A8796; --accent:#6F5FC4; --trc:#4C4857;
    --paper:#FAF6EE; --paper-line:#E8DFCC; --paper-text:#3A342C;
  }
  body.dark{
    color-scheme:dark;
    --bg:#0C0C11; --panel:#131318; --field:#1C1C23; --line:#292932;
    --text:#F2F1F6; --muted:#8B8896; --bub:#292930; --mine:#3F3AA8;
    --nar:#9B98A6; --accent:#8B84F0; --trc:#CAC7DA;
    --paper:#1A1A22; --paper-line:#2E2E3A; --paper-text:#DEDCE6;
  }
  body.dark .msg.me .bub{color:#F5F4FA}
  body.dark .sm.r .b{color:#F5F4FA}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:16px;line-height:1.6;overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100dvh}
  #bar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  #bar .ttl{flex:1;min-width:0;text-align:center}
  #bar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{flex:0 0 auto;min-width:50px;border:0;background:transparent;color:var(--accent);font-size:15px;font-family:inherit;padding:8px 4px;cursor:pointer}
  .iconbtn:nth-of-type(2){text-align:right}
  .iconbtn:active{opacity:.5}
  #view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(env(safe-area-inset-bottom) + 24px)}
  #view.chat{padding:18px 14px 8px}

  .card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .card:active{background:var(--field)}
  .ava{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
  .ava.sm{width:32px;height:32px;font-size:16px}
  .ava.lg{width:62px;height:62px;font-size:28px}
  .ava.xs{width:26px;height:26px;font-size:13px}
  .ava img{width:100%;height:100%;object-fit:cover}
  .card .meta{flex:1;min-width:0}
  .card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .ds{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--muted);text-align:center;padding:56px 20px;font-size:14px;line-height:1.9}

  .btn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer;margin-top:10px}
  .btn:active{background:var(--field)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.danger{color:#D06060}
  .btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0}
  label{display:block;margin:18px 0 6px;font-size:13px;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:16px;font-family:inherit;line-height:1.6}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:90px}
  .sec{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--accent);font-weight:600}
  .sec.first{margin-top:0;padding-top:0;border-top:0}
  .pick{display:flex;align-items:center;gap:12px;margin-top:4px}
  .pick .btns{display:flex;gap:8px;flex-wrap:wrap}
  .castbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}

  /* 대화 */
  .msg{margin-bottom:20px;display:flex;gap:9px;align-items:flex-start}
  .msg.me{justify-content:flex-end}
  .msg .col{min-width:0;max-width:84%}
  .msg.me .col{max-width:78%}
  .who{font-size:13.5px;font-weight:600;margin:2px 0 6px 2px}
  .bub{padding:13px 16px;border-radius:18px;background:var(--bub);white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:var(--fs);line-height:1.85;letter-spacing:-.004em;cursor:pointer}
  .msg.me .bub{background:var(--mine)}
  .bub em{font-family:var(--f-nar);font-style:italic;font-weight:300;color:var(--nar);font-size:calc(var(--fs) - 0.5px);line-height:1.9}
  .bub .tr{color:var(--trc);font-size:calc(var(--fs) - 1.5px)}
  .narr{margin:4px 0 20px;padding:10px 14px;text-align:center;color:var(--nar);
    font-family:var(--f-nar);font-style:italic;font-weight:300;
    font-size:calc(var(--fs) - 0.5px);line-height:1.8;white-space:pre-wrap;word-break:break-word;cursor:pointer}
  .ooc{margin:0 0 18px;padding:9px 13px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:14px;white-space:pre-wrap}
  .altbar{display:flex;align-items:center;gap:10px;margin:-8px 0 4px 44px;color:var(--muted);font-size:12px}
  .altbar button{border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 8px;cursor:pointer}
  .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .acts button{background:var(--field);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer}
  .acts button.del{color:#D06060}
  .editbox{width:100%;min-height:120px;margin-top:4px}
  .thinking{color:var(--muted);font-size:14px;padding:2px 2px 20px 50px}
  .err{background:#FBE9EF;border:1px solid #EFC3D2;color:#8A3552;padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:18px;white-space:pre-wrap}
  body.dark .err{background:#3A2230;border-color:#6B3348;color:#F0C4D0}

  /* 특수 카드 */
  .phone{background:var(--field);border-radius:20px;padding:12px;margin:10px 0}
  .phone .ph{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:10px;font-weight:600;font-size:14px}
  .phone .pm{background:var(--panel);border-radius:14px;padding:9px 13px;margin-bottom:7px;max-width:86%;font-size:15px;line-height:1.6}
  .phone .pm.me{background:var(--mine);margin-left:auto}
  .paper{background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;padding:18px 18px 20px;margin:10px 0;font-family:"Noto Serif KR",serif;font-weight:300;color:var(--paper-text);line-height:2;font-size:15.5px;white-space:pre-wrap}
  .paper .pt{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;font-family:inherit}
  .mind{border-left:3px solid var(--accent);background:var(--field);border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0;font-family:"Noto Serif KR",serif;font-style:italic;font-weight:300;color:var(--nar);line-height:1.95;font-size:15px;white-space:pre-wrap}
  .pl{background:var(--field);border-radius:16px;padding:6px 4px;margin:10px 0}
  .pl a{display:block;padding:10px 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
  .pl a:last-child{border-bottom:0}
  .pl .t{font-size:15px;font-weight:600}
  .pl .ar{font-size:13px;color:var(--muted)}
  .pl .rs{font-size:12.5px;color:var(--nar);margin-top:3px;font-style:italic}

  /* 사진 편집기 */
  #cropwrap{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.72);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:20px;-webkit-backdrop-filter:blur(6px)}
  #cropbox{width:280px;height:280px;border-radius:50%;overflow:hidden;position:relative;background:#000;
    box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
  #cropbox img{position:absolute;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
  #cropwrap .ctl{width:280px;display:flex;flex-direction:column;gap:10px}
  #cropwrap input[type=range]{width:100%;padding:0}
  #cropwrap .row{display:flex;gap:8px}
  #cropwrap .row button{flex:1;padding:13px;border-radius:12px;border:0;font-family:inherit;font-size:15px;cursor:pointer}
  #cropwrap .ok{background:var(--accent);color:#fff;font-weight:600}
  #cropwrap .no{background:rgba(255,255,255,.16);color:#fff}
  #cropwrap .tip{color:#fff;opacity:.75;font-size:13px;text-align:center}

  /* 문자 화면 */
  .smswrap{margin:-18px -14px 0;min-height:100%;padding:0 0 10px;background:var(--sbg)}
  .smswrap{--sbg:var(--bg);--sother:var(--bub);--sotherink:var(--text);--smine:var(--mine);--smineink:var(--text);
    --sname:var(--muted);--stime:var(--muted);--sro:18px;--srm:18px;--stail:0;--savr:50%}
  .smswrap[data-th=kakao]{--sbg:#b2c7d9;--sother:#fff;--sotherink:#111;--smine:#fae100;--smineink:#1a1a1a;
    --sname:#43535f;--stime:#5a6d7c;--sro:2px 16px 16px 16px;--srm:16px 2px 16px 16px;--stail:1;--savr:16px}
  .smswrap[data-th=imessage]{--sbg:#fff;--sother:#e9e9eb;--sotherink:#111;--smine:#0b84fe;--smineink:#fff;
    --sname:#84848b;--stime:#a2a2a8;--sro:19px;--srm:19px;--stail:0;--savr:50%}
  .smswrap[data-th=line]{--sbg:#8cabd8;--sother:#fff;--sotherink:#111;--smine:#06c755;--smineink:#111;
    --sname:#28404f;--stime:#4a6274;--sro:2px 16px 16px 16px;--srm:16px 2px 16px 16px;--stail:1;--savr:50%}
  body.dark .smswrap[data-th=kakao]{--sbg:#1b1b1f;--sother:#2c2c34;--sotherink:#ececf0;--sname:#9a9aa5}
  body.dark .smswrap[data-th=imessage]{--sbg:#000;--sother:#26262a;--sotherink:#fff;--sname:#8e8e93}
  body.dark .smswrap[data-th=line]{--sbg:#000;--sother:#2b2b2e;--sotherink:#e8e8ea;--smine:#7ee08a;--smineink:#0b0b0c;--sname:#8a8a90}

  .smsbar{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;
    border-bottom:1px solid rgba(128,128,128,.22);position:sticky;top:0;background:var(--sbg);z-index:2}
  .smsbar .nm{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .smsbar .sub{font-size:12px;color:var(--sname);font-weight:400}
  .smsbar button{border:0;background:transparent;color:var(--sname);font-size:15px;padding:4px 6px;cursor:pointer}
  .smsbody{padding:14px 12px 4px}
  .sm{display:flex;gap:7px;align-items:flex-end;margin-bottom:3px}
  .sm.gap{margin-top:12px}
  .sm.r{justify-content:flex-end}
  .sm .av{flex:0 0 auto;width:34px;height:34px;border-radius:var(--savr);overflow:hidden;background:rgba(128,128,128,.2);
    display:flex;align-items:center;justify-content:center;font-size:16px}
  .sm .av img{width:100%;height:100%;object-fit:cover}
  .sm .av.hide{visibility:hidden}
  .sm .col{max-width:74%;min-width:0}
  .sm .who2{font-size:12px;color:var(--sname);margin:0 0 4px 2px}
  .sm .b{display:inline-block;max-width:100%;padding:9px 13px;border-radius:var(--sro);
    background:var(--sother);color:var(--sotherink);font-family:var(--f-body);
    font-size:calc(var(--fs) - 1.5px);line-height:1.55;white-space:pre-wrap;
    overflow-wrap:break-word;word-break:normal;text-align:left}
  .sm.r .b{border-radius:var(--srm);background:var(--smine);color:var(--smineink)}
  .smsmore{display:block;width:calc(100% - 24px);margin:14px 12px;padding:13px;border-radius:12px;
    border:1px solid rgba(128,128,128,.3);background:transparent;color:inherit;font-family:inherit;font-size:15px}
  .thread{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .thread .tx{flex:1;min-width:0}
  .thread .tt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread .pv{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread .del{border:0;background:transparent;color:var(--muted);font-size:16px;padding:6px}

  #dock{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);padding:9px 12px calc(env(safe-area-inset-bottom) + 9px)}
  #dock .tools{display:flex;gap:13px;padding:0 2px 8px;overflow-x:auto}
  #dock .tools button{background:transparent;border:0;color:var(--muted);font-size:13px;font-family:inherit;padding:0;white-space:nowrap;cursor:pointer}
  #dock .line{display:flex;gap:8px;align-items:flex-end}
  #inp{flex:1;min-height:44px;max-height:140px;border-radius:22px;padding:11px 42px 11px 16px;min-width:0}
  #inwrap{flex:1;position:relative;display:flex;min-width:0}
  #star{position:absolute;right:8px;bottom:7px;width:30px;height:30px;border-radius:15px;border:0;
    background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:0}
  #star:active{color:var(--accent)}
  #send{flex:0 0 auto;width:44px;height:44px;border-radius:22px;border:0;background:var(--accent);color:#fff;font-size:17px;cursor:pointer}
  #send:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <button class="iconbtn" id="left"></button>
    <div class="ttl"><h1 id="title">캐릭터</h1><div class="sub" id="subtitle"></div></div>
    <button class="iconbtn" id="right"></button>
  </header>
  <main id="view"></main>
  <div id="dock" style="display:none">
    <div class="tools">
      <button id="regen">다시 생성</button>
      <button id="undo">마지막 지우기</button>
      <button id="smsbtn">문자</button>
      <button id="cmds">명령어</button>
      <button id="note">노트</button>
      <button id="reset">초기화</button>
    </div>
    <div class="line">
      <div id="inwrap"><textarea id="inp" rows="1" placeholder="메시지"></textarea>
      <button id="star" title="지문">✳</button></div>
      <button id="send">↑</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- 저장 ---------- */
var mem = {};
var canStore = (function(){
  try { localStorage.setItem("gz.t","1"); localStorage.removeItem("gz.t"); return true; }
  catch(e){ return false; }
})();
function put(k,v){
  var s = JSON.stringify(v);
  if (canStore) { try { localStorage.setItem(k,s); return true; } catch(e){ return false; } }
  mem[k]=s; return true;
}
function get(k,d){
  var s = null;
  if (canStore) { try { s = localStorage.getItem(k); } catch(e){} }
  if (s===null || s===undefined) s = mem[k];
  if (s===null || s===undefined) return d;
  try { return JSON.parse(s); } catch(e){ return d; }
}
var FONTS = {
  "프리텐다드":'"Pretendard Variable",Pretendard,-apple-system,sans-serif',
  "본고딕":'"Noto Sans KR",sans-serif',
  "나눔고딕":'"Nanum Gothic",sans-serif',
  "고운돋움":'"Gowun Dodum",sans-serif',
  "검은고딕":'"Black Han Sans",sans-serif',
  "본명조":'"Noto Serif KR",serif',
  "리디바탕":'"RIDIBatang","Noto Serif KR",serif',
  "마루부리":'"MaruBuri","Noto Serif KR",serif',
  "나눔명조":'"Nanum Myeongjo",serif',
  "고운바탕":'"Gowun Batang",serif',
  "송명":'"Song Myung",serif',
  "나눔손글씨 펜":'"Nanum Pen Script",cursive',
  "나눔손글씨 붓":'"Nanum Brush Script",cursive',
  "개구쟁이":'"Gaegu",cursive',
  "하이멜로디":'"Hi Melody",cursive'
};
var cfg = get("gz.cfg", { mode:"openai", key:"", base:"", model:"gemini-3.7-flash", maxTokens:2600,
                          theme:"light", fBody:"프리텐다드", fNar:"본명조", fSize:16, smsTheme:"기본" });
if (!cfg.mode) cfg.mode = "openai";
if (!cfg.theme) cfg.theme = "light";
var chars = get("gz.chars", []);
function saveCfg(){ put("gz.cfg", cfg); applyTheme(); }
function saveChars(){ put("gz.chars", chars); }
function logKey(id){ return "gz.log."+id; }
function origKey(id,f){ return "gz.orig."+id+"."+f; }
function getLog(id){ return get(logKey(id), []); }
function setLog(id,l){ put(logKey(id), l); }
function applyTheme(){
  var d = cfg.theme==="dark";
  document.body.className = d ? "dark" : "";
  var tc = document.getElementById("tc");
  if (tc) tc.setAttribute("content", d ? "#0C0C11" : "#FFFFFF");
  var st = document.body.style;
  st.setProperty("--f-body", FONTS[cfg.fBody] || FONTS["프리텐다드"]);
  st.setProperty("--f-nar",  FONTS[cfg.fNar]  || FONTS["본명조"]);
  st.setProperty("--fs", (cfg.fSize||16)+"px");
}

/* ---------- 도구 ---------- */
var $ = function(s){ return document.querySelector(s); };
var view=$("#view"), dock=$("#dock");
var elTitle=$("#title"), elSub=$("#subtitle"), elLeft=$("#left"), elRight=$("#right");
var elInp=$("#inp"), elSend=$("#send");

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmt(s){
  var t = esc(s).replace(/\n{3,}/g,"\n\n").trim();
  t = t.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
  t = t.replace(/\*{1,3}([^*]+?)\*{1,3}/g,'<em>$1</em>');
  return t.replace(/\*/g,"");
}
function avaHTML(v, fb, cls){
  var s=(v||"").trim(), k="ava"+(cls?" "+cls:"");
  if (/^(https?:|data:image)/i.test(s)) return '<div class="'+k+'"><img src="'+esc(s)+'" alt=""></div>';
  return '<div class="'+k+'">'+esc(s||fb)+"</div>";
}
function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function castOf(c){ return (c.cast||[]).filter(function(x){ return x && x.name; }); }
function dispOf(c){ return (c.display||"").trim() || c.name || "상대"; }
function udispOf(c){ return (c.userDisplay||"").trim() || c.userName || "나"; }
function findPerson(c, name){
  if (!name) return null;
  var n = name.trim();
  if (n === (c.name||"").trim()) return { name:c.name, avatar:c.avatar };
  var cs = castOf(c);
  for (var i=0;i<cs.length;i++) if (cs[i].name.trim()===n) return cs[i];
  return null;
}

function pickPhoto(done){
  var inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var M=640, w=img.width, h=img.height, r=Math.min(1, M/Math.max(w,h));
        var cv=document.createElement("canvas");
        cv.width=Math.round(w*r); cv.height=Math.round(h*r);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        inp.remove(); done(cv.toDataURL("image/jpeg",0.86));
      };
      img.onerror=function(){ inp.remove(); alert("이 사진은 못 읽었어."); };
      img.src = fr.result;
    };
    fr.onerror=function(){ inp.remove(); alert("사진을 불러오지 못했어."); };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* 확대, 위치 잡아서 동그랗게 자르기 */
function editPhoto(src, done){
  var S = 280;
  var wrap = document.createElement("div");
  wrap.id = "cropwrap";
  wrap.innerHTML = '<div class="tip">손가락으로 움직이고, 두 손가락으로 확대할 수 있어</div>'
    + '<div id="cropbox"><img id="cropimg" alt=""></div>'
    + '<div class="ctl"><input id="cropz" type="range" min="100" max="400" value="100">'
    + '<div class="row"><button class="no" id="cropno">취소</button>'
    + '<button class="ok" id="cropok">저장</button></div></div>';
  document.body.appendChild(wrap);

  var im = wrap.querySelector("#cropimg");
  var base=1, z=1, ox=0, oy=0, iw=0, ih=0;

  function clamp(){
    var dw=iw*base*z, dh=ih*base*z;
    if (ox > 0) ox = 0;
    if (oy > 0) oy = 0;
    if (ox < S-dw) ox = S-dw;
    if (oy < S-dh) oy = S-dh;
  }
  function draw(){
    clamp();
    im.style.width = (iw*base*z)+"px";
    im.style.height = (ih*base*z)+"px";
    im.style.left = ox+"px";
    im.style.top = oy+"px";
  }
  im.onload = function(){
    iw=im.naturalWidth; ih=im.naturalHeight;
    base = S/Math.min(iw,ih);
    z=1; ox=(S-iw*base)/2; oy=(S-ih*base)/2;
    im.style.position="absolute";
    draw();
  };
  im.src = src;

  var box = wrap.querySelector("#cropbox");
  var px=0, py=0, pd=0, pz=1, dragging=false;
  function dist(t){
    var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }
  box.addEventListener("touchstart", function(e){
    if (e.touches.length===1){ dragging=true; px=e.touches[0].clientX; py=e.touches[0].clientY; }
    else if (e.touches.length===2){ dragging=false; pd=dist(e.touches); pz=z; }
  }, {passive:true});
  box.addEventListener("touchmove", function(e){
    e.preventDefault();
    if (e.touches.length===1 && dragging){
      var x=e.touches[0].clientX, y=e.touches[0].clientY;
      ox += x-px; oy += y-py; px=x; py=y; draw();
    } else if (e.touches.length===2 && pd){
      var nz = Math.max(1, Math.min(4, pz * dist(e.touches)/pd));
      var cx=S/2, cy=S/2, k=nz/z;
      ox = cx - (cx-ox)*k; oy = cy - (cy-oy)*k;
      z = nz; wrap.querySelector("#cropz").value = Math.round(z*100); draw();
    }
  }, {passive:false});
  box.addEventListener("touchend", function(){ dragging=false; pd=0; }, {passive:true});
  box.addEventListener("mousedown", function(e){ dragging=true; px=e.clientX; py=e.clientY; });
  window.addEventListener("mousemove", function(e){
    if(!dragging) return;
    ox += e.clientX-px; oy += e.clientY-py; px=e.clientX; py=e.clientY; draw();
  });
  window.addEventListener("mouseup", function(){ dragging=false; });

  wrap.querySelector("#cropz").oninput = function(){
    var nz = Math.max(1, Math.min(4, this.value/100));
    var cx=S/2, cy=S/2, k=nz/z;
    ox = cx - (cx-ox)*k; oy = cy - (cy-oy)*k;
    z = nz; draw();
  };
  wrap.querySelector("#cropno").onclick = function(){ wrap.remove(); };
  wrap.querySelector("#cropok").onclick = function(){
    var out=200, cv=document.createElement("canvas");
    cv.width=out; cv.height=out;
    var sc = base*z, sx = -ox/sc, sy = -oy/sc, ss = S/sc;
    cv.getContext("2d").drawImage(im, sx, sy, ss, ss, 0, 0, out, out);
    wrap.remove();
    done(cv.toDataURL("image/jpeg",0.85));
  };
}


/* 꾹 누르기 */
function bindHold(el, fn){
  var tm=null, moved=false;
  el.addEventListener("touchstart", function(){
    moved=false;
    tm=setTimeout(function(){ if(!moved) fn(); }, 420);
  }, {passive:true});
  el.addEventListener("touchmove", function(){ moved=true; clearTimeout(tm); }, {passive:true});
  el.addEventListener("touchend", function(){ clearTimeout(tm); }, {passive:true});
  el.addEventListener("contextmenu", function(e){ e.preventDefault(); fn(); });
}
function copyText(t){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return; }
  } catch(e){}
  var ta=document.createElement("textarea");
  ta.value=t; ta.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  ta.remove();
}

function cur(){ for (var i=0;i<chars.length;i++) if (chars[i].id===curId) return chars[i]; return null; }
function render(){
  view.className=""; dock.style.display="none";
  elLeft.textContent=""; elRight.textContent="";
  elLeft.onclick=null; elRight.onclick=null;
  if (screen==="list") return viewList();

  if (screen==="edit") return viewEdit();
  if (screen==="cfg")  return viewCfg();
  if (screen==="note") return viewNote();
  if (screen==="lore") return viewLore();
  if (screen==="sms")  return viewSms();

}

/* ---------- 캐릭터 설정 ---------- */
function field(label,key,val,big,hint){
  var tag = big ? '<textarea data-k="'+key+'" style="min-height:'+big+'px">'+esc(val||"")+'</textarea>'
                : '<input data-k="'+key+'" value="'+esc(val||"")+'">';
  return '<label>'+esc(label)+'</label>'+tag+(hint?'<div class="hint">'+hint+'</div>':"");
}
function photoBlock(label,key,val){
  return '<label>'+esc(label)+'</label><div class="pick">'+avaHTML(val,"🙂","lg")
    + '<div class="btns"><button class="btn sm" data-pick="'+key+'">사진 고르기</button>'
    + (/^data:image/.test(val||"") ? '<button class="btn sm" data-adj="'+key+'">위치 조정</button>' : "")
    + '<button class="btn sm" data-clear="'+key+'">지우기</button></div></div>'
    + '<div class="hint">앨범에서 고르면 작게 줄여서 저장돼. 이모지를 쓰려면 아래 칸에.</div>'
    + '<input data-k="'+key+'" value="'+esc(/^data:image/.test(val||"")?"":(val||""))+'">';
}

  h += '<div class="sec first">캐릭터</div>';
  h += field("이름","name",c.name);
  h += field("표시 이름","display",c.display);

  h += field("한 줄 소개","tagline",c.tagline);
  h += field("캐릭터 프롬프트","prompt",c.prompt,200);
  h += field("세계관 / 상황","world",c.world,120);
  h += field("첫 마디","greeting",c.greeting,140);
  h += field("문체 예시","sample",c.sample,180);

  h += '<div class="sec">같이 나올 인물</div>';
  var cast = c.cast || (c.cast=[]);
  for (var i=0;i<3;i++){
    var p = cast[i] || (cast[i]={name:"",avatar:"",prompt:"",style:""});
    h += '<div class="castbox">'
       + '<label>이름</label><input data-cast="'+i+'" data-ck="name" value="'+esc(p.name)+'">'
       + '<div class="pick" style="margin-top:10px">'+avaHTML(p.avatar,"🙂","lg")
       + '<div class="btns"><button class="btn sm" data-castpick="'+i+'">사진</button>'
       + (/^data:image/.test(p.avatar||"") ? '<button class="btn sm" data-castadj="'+i+'">위치</button>' : "")
       + '<button class="btn sm" data-castclear="'+i+'">지우기</button></div></div>'
       + '<label>설정</label><textarea data-cast="'+i+'" data-ck="prompt" style="min-height:80px">'+esc(p.prompt)+'</textarea>'
       + '<label>말투 · 문체</label><textarea data-cast="'+i+'" data-ck="style" style="min-height:70px">'+esc(p.style||"")+'</textarea>'
       + '</div>';
  }

  h += '<div class="sec">나</div>';
  h += field("내 이름","userName",c.userName);
  h += field("내 표시 이름","userDisplay",c.userDisplay);
  h += photoBlock("내 프로필 사진","userAvatar",c.userAvatar);
  h += field("내 캐릭터 프롬프트","userPrompt",c.userPrompt,140);

  h += '<div class="sec">응답</div>';
  h += '<label>길이</label><select data-k="length">'
     + ["짧게","보통","길게","장문"].map(function(o){ return '<option'+((c.length||"길게")===o?" selected":"")+'>'+o+"</option>"; }).join("")+"</select>";
  h += '<div class="hint">짧게 2~5줄 · 보통 6~8줄 · 길게 9~14줄 · 장문 14~20줄</div>';
  h += '<label>대사 언어</label><select data-k="lang">'
     + ["한국어","일본어","영어","중국어"].map(function(o){ return '<option'+((c.lang||"한국어")===o?" selected":"")+'>'+o+"</option>"; }).join("")+"</select>";
  h += '<label>발음 표기</label><select data-k="romaji">'
     + '<option value="on"'+(c.romaji?" selected":"")+'>켜기</option>'
     + '<option value="off"'+(c.romaji?"":" selected")+'>끄기</option></select>';

  h += '<div class="sec">로어북</div>';
  h += '<div class="hint">키워드가 나올 때만 전달되는 설정집. 인물, 장소, 사건을 적어두면 돼.</div>';
  h += '<button class="btn" id="lore">로어북 열기 ('+((c.lore||[]).length)+'개)</button>';
  h += '<button class="btn primary" id="done">저장하고 대화하기</button>';
  h += '<button class="btn danger" id="del">이 캐릭터 삭제</button>';
  view.innerHTML=h;

  Array.prototype.forEach.call(view.querySelectorAll("[data-k]"), function(el){
    el.oninput = el.onchange = function(){
      var k=el.getAttribute("data-k"), v=el.value;
      if (k==="romaji"){ c.romaji = (v==="on"); saveChars(); return; }
      if (k==="length" || k==="lang"){ c[k]=v; saveChars(); return; }
      if ((k==="avatar"||k==="userAvatar") && /^data:image/.test(c[k]||"") && !v) return;
      c[k]=v; saveChars();
    };
  });

    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-castpick]"), function(el){

      var i=+el.getAttribute("data-castpick");

        editPhoto(orig, function(cr){ c.cast[i].avatar=cr; saveChars(); render(); });

    };

  Array.prototype.forEach.call(view.querySelectorAll("[data-castadj]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-castadj");
      var orig = get(origKey(c.id,"cast"+i), null) || c.cast[i].avatar;
      if (!orig) return;
      editPhoto(orig, function(cr){ c.cast[i].avatar=cr; saveChars(); render(); });
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-castclear]"), function(el){
    el.onclick=function(){ c.cast[+el.getAttribute("data-castclear")].avatar=""; saveChars(); render(); };
  });

    c[k]=cropped;

    render();
  }
  Array.prototype.forEach.call(view.querySelectorAll("[data-pick]"), function(el){
    el.onclick=function(){
      var k=el.getAttribute("data-pick");
      pickPhoto(function(orig){
        put(origKey(c.id,k), orig);
        editPhoto(orig, function(cr){ savePhoto(k, cr); });
      });
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-adj]"), function(el){
    el.onclick=function(){
      var k=el.getAttribute("data-adj");
      var orig = get(origKey(c.id,k), null) || c[k];
      if (!orig) return;
      editPhoto(orig, function(cr){ savePhoto(k, cr); });
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-clear]"), function(el){
    el.onclick=function(){ c[el.getAttribute("data-clear")]=""; saveChars(); render(); };
  });
  $("#lore").onclick=function(){ saveChars(); go("lore", c.id); };
  $("#done").onclick=function(){ saveChars(); go("chat", c.id); };
  $("#del").onclick=function(){
    if (!confirm((c.name||"이 캐릭터")+" 삭제할까? 대화도 같이 지워져.")) return;
    chars = chars.filter(function(x){ return x.id!==c.id; });
    saveChars(); setLog(c.id,[]); go("list");
  };
}

var KINDS = ["문자","일기","편지","속마음","플리","나레"];

function pieces(c, text){
  var names = [ (c.name||"").trim() ].concat(castOf(c).map(function(x){ return x.name.trim(); }))
                .filter(function(x){ return x; });
  var t = String(text||"");
  // '플리:' 처럼 머리말만 쓴 경우도 태그로 취급
  t = t.replace(new RegExp("^\\s*(" + KINDS.join("|") + ")\\s*[:：]\\s*$", "gm"), "[$1]");
  t = t.replace(new RegExp("^\\s*\\[\\s*(" + KINDS.join("|") + ")\\s*\\]\\s*$", "gm"), "[$1]");

  var lines = t.split("\n"), res = [], curKind = null, curWho = null, buf = [];
  function flush(){
    var body = buf.join("\n").trim();
    buf = [];
    if (!body) return;
    if (curKind) res.push({ card:curKind, text:body });
    else res.push({ who:curWho, text:body });
  }
  var openRe  = new RegExp("^\\s*\\[(" + KINDS.join("|") + ")\\]\\s*$");
  var closeRe = new RegExp("^\\s*\\[/\\s*(" + KINDS.join("|") + ")\\s*\\]\\s*$");

  for (var i=0;i<lines.length;i++){
    var L = lines[i], m;
    if ((m = L.match(openRe))){ flush(); curKind = m[1]; continue; }
    if (closeRe.test(L)){ flush(); curKind = null; continue; }
    m = L.match(/^\s*\[([^\]\n]{1,20})\]\s*(.*)$/);
    if (m && KINDS.indexOf(m[1].trim()) < 0){
      flush(); curKind = null; curWho = m[1].trim();
      if (m[2].trim()) buf.push(m[2]);
      continue;
    }
    buf.push(L);
  }
  flush();

  // 태그를 빼먹었어도 곡 목록처럼 생겼으면 플리로 본다
  var out = [];
  res.forEach(function(seg){
    if (seg.card){ out.push(seg); return; }
    var ls = seg.text.split("\n"), run = [], rest = [];
    function dumpRun(){
      if (run.length >= 2) out.push({ card:"플리", text:run.join("\n") });
      else Array.prototype.push.apply(rest, run);
      run = [];
    }
    ls.forEach(function(L){
      if (/::/.test(L) && /\S\s*[-–—]\s*\S/.test(L)) run.push(L);
      else { dumpRun(); rest.push(L); }
    });
    dumpRun();
    var r = rest.join("\n").trim();
    if (r) out.push({ who:seg.who, text:r });
  });
  return out;
}




/* 첫 마디를 @: 나레이션 / @이름: 말풍선 으로 나눠 담기 */
function seedGreeting(c, txt){
  var names = [ (c.name||"").trim() ].concat(castOf(c).map(function(x){ return x.name.trim(); })).filter(Boolean);
  var uname = (c.userName||"").trim();
  var out=[], mode="bub", who=null, buf=[];

  function flush(){
    var t=buf.join("\n").trim(); buf=[];
    if (!t) return;
    if (mode==="narr"){ out.push({ r:"a", t:t, narr:true }); return; }
    if (mode==="user"){ out.push({ r:"u", t:t }); return; }
    if (who && names.length && who!==names[0]) out.push({ r:"a", t:"["+who+"]\n"+t });
    else out.push({ r:"a", t:t });
  }

  String(txt).split("\n").forEach(function(L){
    var m = L.match(/^\s*@\s*([^:：\n]*)\s*[:：]\s*([\s\S]*)$/);
    if (m){
      flush();
      var tag = m[1].trim();
      if (!tag){ mode="narr"; who=null; }
      else if (/^(user|나|유저)$/i.test(tag) || (uname && tag===uname)){ mode="user"; who=null; }
      else {
        mode="bub"; who=null;
        for (var i=0;i<names.length;i++){
          if (names[i]===tag || names[i].indexOf(tag)>=0 || tag.indexOf(names[i])>=0){ who=names[i]; break; }
        }
        if (!who) who = names[0] || null;
      }
      if (m[2].trim()) buf.push(m[2]);
      return;
    }
    var m2 = L.match(/^\s*말풍선\s*[:：]\s*([\s\S]*)$/);
    if (m2){ flush(); mode="bub"; who=null; if(m2[1].trim()) buf.push(m2[1]); return; }
    buf.push(L);
  });
  flush();
  if (!out.length) out.push({ r:"a", t:String(txt).trim() });
  return out;
}


/* 장면 전환 · 앞 이야기 요약해서 접기 */
function makeRecap(c, done){
  var log = getLog(c.id);
  var body = log.slice(-40).map(function(m){
    return (m.r==="u" ? (c.userName||"나") : (c.name||"상대")) + ": " + m.t;
  }).join("\n").slice(-9000);
  if (!body) return done();
  var sys = "너는 이야기를 정리하는 도우미다. 아래 상황극 기록을 6~10줄로 요약한다. "
          + "인물 사이에 무슨 일이 있었는지, 관계가 어떻게 변했는지, 아직 풀리지 않은 것이 무엇인지 담는다. "
          + "대사나 묘사를 옮기지 말고 사실만 담백하게 적는다.";
  var prev = c.recap ? "이전 요약:\n"+c.recap+"\n\n" : "";
  var url, headers, bd;
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    bd={ model:cfg.model, max_tokens:1200, messages:[{role:"system",content:sys},{role:"user",content:prev+body}] };
  } else {
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    bd={ systemInstruction:{parts:[{text:sys}]}, contents:[{role:"user",parts:[{text:prev+body}]}],
         generationConfig:{ maxOutputTokens:1200 } };
  }
  fetch(url,{method:"POST",headers:headers,body:JSON.stringify(bd)})
  .then(function(r){ return r.text(); })
  .then(function(txt){
    var d=null; try{ d=JSON.parse(txt); }catch(e){}
    var out="";
    if (cfg.mode==="openai"){
      var ch=d&&d.choices&&d.choices[0];
      out=ch?((ch.message&&ch.message.content)||""):"";
    } else {
      var cd=d&&d.candidates&&d.candidates[0];
      out=cd?((cd.content&&cd.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
    }
    if (out.trim()){ c.recap = out.trim(); saveChars(); }
    done();
  })
  .catch(function(){ done(); });
}

function pickLore(c){
  var items = c.lore || [];
  if (!items.length) return [];
  var log = getLog(c.id).slice(-4).map(function(m){ return m.t; }).join(" ");
  var out = [], rest = [];
  items.forEach(function(it){
    if (!it.text) return;
    if (it.always){ out.push(it); return; }
    var keys = (it.keys||"").split(/[,，]/).map(function(x){ return x.trim(); }).filter(Boolean);
    for (var i=0;i<keys.length;i++){

  });

}

function smsKey(id){ return "gz.smsl."+id; }
function getThreads(id){ return get(smsKey(id), []); }
function setThreads(id,v){ put(smsKey(id), v); }
function curThread(c){
  var th = getThreads(c.id);
  for (var i=0;i<th.length;i++) if (th[i].id===smsCur) return th[i];
  return null;
}
function saveThread(c, t){
  var th = getThreads(c.id), hit=false;
  for (var i=0;i<th.length;i++) if (th[i].id===t.id){ th[i]=t; hit=true; break; }
  if (!hit) th.unshift(t);
  setThreads(c.id, th);
}
var smsCur = null;

function peopleOf(c){
  var arr = [{ key:"user", name:c.userName||"나", disp:udispOf(c), avatar:c.userAvatar }];
  arr.push({ key:"main", name:c.name||"상대", disp:dispOf(c), avatar:c.avatar });
  castOf(c).forEach(function(x,i){ arr.push({ key:"cast"+i, name:x.name, disp:x.name, avatar:x.avatar }); });
  return arr;
}
function personByName(c, nm){
  var ps = peopleOf(c), n=(nm||"").trim();
  for (var i=0;i<ps.length;i++){
    var p=ps[i];
    if (p.name.trim()===n || p.disp.trim()===n) return p;
  }
  for (var j=0;j<ps.length;j++){
    var q=ps[j];
    if (n && (q.name.indexOf(n)>=0 || n.indexOf(q.name)>=0)) return q;
  }
  return { key:"etc", name:n, disp:n, avatar:"" };
}
function isUserName(c, n){
  var t=(n||"").trim();
  return /^(user|나|유저)$/i.test(t) || (c.userName && t===c.userName.trim()) || (c.userDisplay && t===c.userDisplay.trim());
}

/* /문자 @A @B @C */
function parseSms(c, text){
  var t = text.trim();
  if (!/^\/문자/.test(t)) return null;
  var ats = t.slice(3).match(/@[^\s@]+/g);
  if (!ats || ats.length < 2) return { pick:true };
  var names = ats.map(function(a){ return a.slice(1); });
  return { names:names };
}

function makeThread(c, names){
  var parts = [], random = false;
  names.forEach(function(n){
    if (n==="랜덤"){ random = true; return; }
    parts.push(isUserName(c,n) ? personByName(c, c.userName||"나") : personByName(c,n));
  });
  if (!parts.length) return null;
  var peek = true;
  parts.forEach(function(p){ if (p.key==="user") peek=false; });
  var t = {
    id: uid(),
    from: parts[0].name,
    parts: parts,
    random: random,
    peek: peek,
    log: []
  };
  t.title = random ? (parts[0].disp + " → ?")
          : parts.map(function(p){ return p.disp; }).join(", ");
  saveThread(c, t);
  smsCur = t.id;
  go("sms", c.id);
  return t;
}

    h += '<div class="sm'+(right?" r":"")+(same?"":" gap")+'" data-si="'+i+'">';

    h += '<div class="empty">'+(t.peek?"더 보기를 눌러봐.":"먼저 보내거나 더 보기를 눌러봐.")+'</div>';
  h += '</div>';

  $("#smslist2").onclick=function(){ go("smslist", c.id); };

      var i=+el.getAttribute("data-si");
      smsMenu(i);
    });

}

function smsMenu(i){
  var c=cur(), t=curThread(c); if(!t) return;
  var m=t.log[i]; if(!m) return;
  var pick = prompt("1 복사 · 2 수정 · 3 삭제 · 4 여기부터 지우기", "1");
  if (!pick) return;
  pick = pick.trim();
  if (pick==="1") copyText(m.t);
  else if (pick==="2"){
    var v = prompt("수정", m.t);
    if (v!==null){ m.t=v; saveThread(c,t); paintSms(); }
  }
  else if (pick==="3"){ t.log.splice(i,1); saveThread(c,t); paintSms(); }
  else if (pick==="4"){ t.log.splice(i); saveThread(c,t); paintSms(); }
}

function buildSmsSystem(c, t){
  var p=[], cs=castOf(c);
  p.push("문자 메시지만 쓴다. 지문, 묘사, 설명, 별표는 한 줄도 쓰지 않는다.");
  p.push("");
  p.push("# 인물");
  p.push((c.name||"") + " — " + (c.tagline||"") + " " + (c.prompt||""));
  cs.forEach(function(x){ p.push(x.name+" — "+(x.prompt||"")+(x.style?" / 말투: "+x.style:"")); });
  p.push((c.userName||"나") + " — " + (c.userPrompt||""));
  if (c.world){ p.push(""); p.push("# 상황"); p.push(c.world); }
  if (c.note){ p.push(""); p.push("# 반드시 기억할 것"); p.push(c.note); }
  if (c.recap){ p.push(""); p.push("# 지금까지의 이야기"); p.push(c.recap); }
  var lore = pickLore(c);
  if (lore.length){
    p.push(""); p.push("# 설정집");
    lore.forEach(function(it){ p.push("- "+(it.title?it.title+": ":"")+it.text); });
  }
  var rl = getLog(c.id).slice(-8).map(function(m){
    return (m.r==="u" ? (c.userName||"나") : (c.name||"상대")) + ": " + m.t;
  }).join("\n");
  if (rl){ p.push(""); p.push("# 조금 전까지의 상황"); p.push(rl); }

  p.push("");
  p.push("# 이 문자방");
  p.push("참여자: " + t.parts.map(function(x){ return x.name; }).join(", ") + (t.random ? ", 그리고 상황에 맞는 상대 한 명" : ""));
  if (t.random) p.push(t.from + "가 지금 상황에 맞는 상대에게 보낸다. 설정에 없는 인물이어도 된다. 상대 이름을 정하고 그 이름으로 계속 쓴다.");

  p.push("");
  p.push("# 형식");
  p.push("한 줄에 하나씩 '이름: 내용' 형식으로만 쓴다. 다른 형식은 쓰지 않는다.");
  p.push("한 번에 2~4줄만 쓴다. 문자답게 짧고 구어체로, 실제로 폰으로 칠 법하게 쓴다.");
  p.push("문장을 도중에 끊지 말고 끝까지 맺는다.");
  if (t.peek){
    p.push((c.userName||"나")+"는 이 문자방에 없다. 참여자들끼리만 주고받는다.");
    p.push("여러 명이면 서로 답하며 자연스럽게 이어간다.");
  } else {
    var npcs = t.parts.filter(function(x){ return x.key!=="user"; }).map(function(x){ return x.name; });
    p.push(npcs.join(", ")+"의 문자만 쓴다. "+(c.userName||"나")+"의 문자는 절대 대신 쓰지 않는다.");
  }
  return p.join("\n");
}

function smsTurn(){
  var c=cur(); if(!c||busy) return;
  var t=curThread(c); if(!t) return;
  if(!cfg.key){ paintSms("API 키가 없어. 설정에서 넣어줘."); return; }
  busy=true; paintSms(null,true);

  var transcript = t.log.map(function(m){ return m.who+": "+m.t; }).join("\n");
  var ask = t.peek ? "이어서 문자를 2~4줄 더 써줘." : "이어서 문자를 2~4줄 써줘.";
  var content = (transcript ? "지금까지 문자:\n"+transcript+"\n\n" : "") + ask;
  var sys = buildSmsSystem(c, t);
  var lim = Math.max(1500, Math.min(cfg.maxTokens||2600, 4000));

  var url, headers, body;
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    body={ model:cfg.model, max_tokens:lim, messages:[{role:"system",content:sys},{role:"user",content:content}] };
  } else {
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    body={ systemInstruction:{parts:[{text:sys}]}, contents:[{role:"user",parts:[{text:content}]}],
           generationConfig:{ maxOutputTokens:lim } };
  }

  fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body)})
  .then(function(res){ return res.text().then(function(txt){
    var data=null; try{ data=JSON.parse(txt); }catch(e){}
    if(!res.ok){
      var em=(data&&data.error&&(data.error.message||data.error))||txt.slice(0,300);
      throw new Error("서버가 "+res.status+" 로 응답했어.\n"+em);
    }
    var out="";
    if (cfg.mode==="openai"){
      var ch=data&&data.choices&&data.choices[0];
      out=ch?((ch.message&&ch.message.content)||ch.text||""):"";
    } else {
      var cand=data&&data.candidates&&data.candidates[0];
      out=cand?((cand.content&&cand.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
    }
    return out.trim();
  });})
  .then(function(out){
    var tt=curThread(c);
    out.split("\n").forEach(function(L){
      var x=L.trim(); if(!x) return;
      x = x.replace(/\*/g,"");
      var m=x.match(/^\s*([^:：]{1,20})[:：]\s*([\s\S]*)$/);
      if (!m || !m[2].trim()) return;
      var who = m[1].trim();
      if (!tt.peek && isUserName(c, who)) return;
      tt.log.push({ who:who, t:m[2].trim() });
    });
    saveThread(c, tt);
    busy=false; paintSms();
  })
  .catch(function(e){ busy=false; paintSms(e.message||"연결 실패"); });
}

function smsSend(text){
  var c=cur(); if(!c) return;
  var t=curThread(c); if(!t) return;
  t.log.push({ who:(c.userName||"나"), t:text, mine:true });
  saveThread(c, t);
  paintSms(); smsTurn();
}

function actsHTML(i){
  return '<div class="acts"><button data-cp="'+i+'">복사</button>'
       + '<button data-ed="'+i+'">수정</button>'
       + '<button class="del" data-del="'+i+'">삭제</button>'
       + '<button class="del" data-cut="'+i+'">여기부터 지우기</button></div>';
}
function altBarHTML(m,i){
  if (!m.alts || m.alts.length<2) return "";
  return '<div class="altbar" data-alt="'+i+'"><button data-ap="'+i+'">‹</button>'
       + '<span>'+((m.ai||0)+1)+' / '+m.alts.length+'</span>'
       + '<button data-an="'+i+'">›</button></div>';

function paint(err, thinking){
  var c=cur(); if(!c) return;
  var log=getLog(c.id), h="";
  for (var i=0;i<log.length;i++){
    var m=log[i];
    if (editIdx===i){
      h += '<div class="msg'+(m.r==="u"?" me":"")+'"><div class="col" style="max-width:100%;width:100%">'
         + '<textarea class="editbox" id="eb">'+esc(m.t)+'</textarea>'
         + '<div class="acts"><button data-save="'+i+'">저장</button><button data-cancel="1">취소</button></div></div></div>';
      continue;
    }
    if (m.narr){
      h += '<div class="narr" data-i="'+i+'">'+fmt(m.t).replace(/<em>|<\/em>/g,"")+'</div>' + (selIdx===i?actsHTML(i):"");
      continue;
    }
    if (m.ooc){
      h += '<div class="ooc" data-i="'+i+'">'+esc(m.t)+'</div>' + (selIdx===i?actsHTML(i):"");
      continue;
    }
    if (m.r==="u"){
      h += '<div class="msg me"><div class="col"><div class="bub" data-i="'+i+'">'+fmt(m.t)+'</div>'
         + (selIdx===i?actsHTML(i):"")+'</div></div>';
      continue;
    }
    var ps = pieces(c, m.t), body = "";
    ps.forEach(function(p){
      if (p.card){ body += cardHTML(p.card, p.text, c); return; }
      var who = p.who ? (findPerson(c,p.who) || {name:p.who, avatar:"👤"}) : {name:dispOf(c), avatar:c.avatar};
      body += '<div class="msg">'+avaHTML(who.avatar,"🙂","sm")
            + '<div class="col"><div class="who">'+esc(who.name||"")+'</div>'
            + '<div class="bub" data-i="'+i+'">'+fmt(p.text)+'</div></div></div>';
    });
    h += body + altBarHTML(m,i) + (selIdx===i?actsHTML(i):"");
  }
  if (thinking) h += '<div class="thinking">'+esc(c.name||"상대")+" 입력 중…</div>";
  if (err) h += '<div class="err">'+esc(err)+"</div>";
  if (!log.length && !thinking && !err) h += '<div class="empty">먼저 말을 걸어봐.</div>';
  view.innerHTML=h;

  Array.prototype.forEach.call(view.querySelectorAll("[data-i]"), function(el){
    var i=+el.getAttribute("data-i");
    bindHold(el, function(){ selIdx = (selIdx===i) ? -1 : i; paint(); });
    var sx=null;
    el.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; }, {passive:true});
    el.addEventListener("touchend", function(e){
      if (sx===null) return;
      var dx = e.changedTouches[0].clientX - sx; sx=null;
      if (Math.abs(dx) < 55) return;
      var lg=getLog(c.id), m=lg[i];
      if (!m || !m.alts || m.alts.length<2) return;
      var n = (m.ai||0) + (dx<0 ? 1 : -1);
      if (n<0) n = m.alts.length-1;
      if (n>=m.alts.length) n = 0;
      m.ai=n; m.t=m.alts[n]; setLog(c.id,lg); paint();
    }, {passive:true});
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-cp]"), function(el){
    el.onclick=function(){ copyText(getLog(c.id)[+el.getAttribute("data-cp")].t); selIdx=-1; paint(); };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-ap],[data-an]"), function(el){
    el.onclick=function(){
      var i=+(el.getAttribute("data-ap")||el.getAttribute("data-an"));
      var dir = el.hasAttribute("data-an") ? 1 : -1;
      var lg=getLog(c.id), m=lg[i];
      if (!m||!m.alts) return;
      var n=(m.ai||0)+dir;
      if (n<0) n=m.alts.length-1;
      if (n>=m.alts.length) n=0;
      m.ai=n; m.t=m.alts[n]; setLog(c.id,lg); paint();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-ed]"), function(el){
    el.onclick=function(){ editIdx=+el.getAttribute("data-ed"); selIdx=-1; paint(); };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-del]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-del"), l=getLog(c.id);
      l.splice(i,1); setLog(c.id,l); selIdx=-1; paint();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-cut]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-cut"), l=getLog(c.id);
      if (!confirm("여기부터 뒤로 전부 지울까?")) return;
      l.splice(i); setLog(c.id,l); selIdx=-1; paint();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-save]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-save"), l=getLog(c.id);
      l[i].t = $("#eb").value; setLog(c.id,l); editIdx=-1; paint();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-cancel]"), function(el){
    el.onclick=function(){ editIdx=-1; paint(); };
  });
  if (editIdx<0) view.scrollTop = view.scrollHeight;
}

var CMDS = {
  "/전환":"장면을 전환한다. 먼저 첫 줄에 [나레] 를 쓰고 시간과 장소가 어떻게 바뀌었는지 소설처럼 서술한 뒤 [/나레] 로 닫는다. 그 아래에 인물의 말풍선을 이어 쓴다. 나레이션은 이번 턴에만 쓰고 다음 턴부터는 쓰지 않는다.",
  "/모브":"이번 턴에 지금 상황에 어울리는 새 인물을 한 명 등장시킨다. 그 인물의 이름을 정하고, 말할 때 줄 맨 앞에 대괄호로 그 이름을 적는다. 설정에 없는 단역이어도 된다.",
  "/일기":"이번 턴에는 인물이 쓴 일기만 보여준다. 첫 줄에 [일기] 를 쓰고 본문을 1인칭으로 쓴 뒤 [/일기] 로 닫는다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다.",
  "/편지":"이번 턴에는 인물이 쓴 편지만 보여준다. 첫 줄에 [편지] 를 쓰고 본문을 쓴 뒤 [/편지] 로 닫는다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다.",
  "/속마음":"이번 턴에는 인물의 지금 속마음만 보여준다. 첫 줄에 [속마음] 을 쓰고 1인칭으로 솔직하게 쓴 뒤 [/속마음] 으로 닫는다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다.",
  "/플리":"이번 턴에는 노래 세 곡만 고른다. 첫 줄에 [플리] 를 쓰고, 아래 순서대로 한 줄에 하나씩 '제목 - 가수 :: 이유' 형식으로 쓴 뒤 [/플리] 로 닫는다. 첫 곡은 지금 상황에 어울려서 듣고 있는 곡, 둘째 곡은 상대를 생각하며 들었던 곡, 셋째 곡은 평소에 자주 듣던 곡이다. 이유는 한 문장으로 쓴다. 실제로 존재하는 곡만 쓰고, 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다."
};

    p.push(sm.log.slice(-14).map(function(m){ return m.who+": "+m.t; }).join("\n"));
  }

  p.push("");
  p.push("# 쓰는 법");
  p.push("행동과 상황 묘사, 속마음은 별표 하나로 감싼다. 대사는 별표 없이 그대로 쓰고 따옴표는 안 붙인다. 지문과 대사는 빈 줄로 나누지 말고 한 덩어리로 이어 쓴다.");
  p.push("지문은 3인칭 과거형 소설체다. '~합니다' 같은 존댓말 서술은 쓰지 않는다. 소리, 냄새, 빛, 온도 같은 감각을 넣고, 인물의 속마음이나 감춘 의도를 짚어도 된다.");
  p.push("대사는 실제 회화에서 쓰는 표현만 쓴다. 소설이나 각본에서만 보이는 문어체 표현은 쓰지 않는다. 정중한 인물이라도 말투는 입말이다.");
  p.push("대사에서 감정을 말로 설명하지 않고, 상대의 호칭을 반복해 부르지 않는다. 문장을 일부러 짧게 끊거나 조사를 생략하지 않는다.");
  p.push("꾸미는 말은 한 문장에 하나까지만 쓴다. 행동으로 이미 보여준 것을 다시 설명하지 않는다. 비유는 꼭 필요할 때만 쓴다.");
  p.push("지문과 대사의 비율은 장면에 따라 달라진다. 대사 수도 정해져 있지 않다. 한 마디만 하고 끝낼 수도 있고 여러 마디를 이어갈 수도 있다. 매번 같은 개수로 쓰지 않는다.");
  p.push(lenMap[c.length]||lenMap["길게"]);
  p.push("첫 화면에 나온 도입부 나레이션은 시작할 때만 쓰인 것이다. 답변에서는 그런 전지적 나레이션을 쓰지 않고, 인물의 시점에서만 쓴다.");
  p.push("설정에 없는 단역은 그 자리에 있을 이유가 분명할 때만 등장시킨다. 둘만 있는 장면에 이유 없이 끼어들게 하지 않는다. 한 번 나온 단역도 상황이 끝나면 더 나오지 않는다.");
  p.push("상대역의 대사와 행동, 속마음은 대신 쓰지 않는다. AI나 설정에 대한 메타 발언도 하지 않는다. 이야기를 끝맺지 말고 상대가 이어갈 여지를 남긴다.");

  var lang=c.lang||"한국어";
  if (lang!=="한국어"){
    p.push("");
    p.push("# 언어");
    if (c.romaji){
      p.push("대사는 "+lang+"로 쓰고, 바로 뒤 소괄호 안에 한국어 발음, 쉼표, 한국어 번역 순으로 넣는다. 예: " + langSample(lang, true));
    } else {
      p.push("대사는 "+lang+"로 쓰고, 바로 뒤 소괄호 안에 한국어 번역만 넣는다. 예: " + langSample(lang, false));
      p.push("발음이나 로마자 표기는 절대 쓰지 않는다. 괄호 안에는 번역 문장 하나만 들어간다.");
    }
    p.push("별표 안의 지문은 한국어로만 쓴다. 괄호는 번역에만 쓴다.");
    p.push(lang+" 대사도 실제 원어민이 말하는 방식으로 쓴다. 소설이나 자막에서만 쓰는 문어체 표현은 피한다. 번역도 그 결에 맞춰 자연스러운 한국어로 옮긴다.");
  }

  p.push("");
  p.push("# 장면 지정");
  p.push("상대 메시지가 (상황: ...) 형태로 오면 그것은 상대가 깔아준 장면이다. 그 내용을 그대로 일어난 일로 받아들이고 이어서 쓴다. 그 문장을 그대로 옮겨 적지 않고, 그 장면 안에서 인물이 무엇을 하는지 쓴다. 그것은 상대의 대사가 아니다.");

  p.push("");
  p.push("# OOC");
  p.push("상대 메시지가 OOC 로 시작하면 연기를 멈추고 그 지시에 짧게만 답한다. 이야기 본문은 쓰지 않고, 그 지시는 다음 턴부터 반영한다.");

  if (c.sample){
    p.push("");
    p.push("# 문체 예시");
    p.push("아래 글의 내용이 아니라 문장의 결과 호흡만 따라간다.");
    p.push(c.sample);
  }
  if (turn){
    p.push("");
    p.push("# 이번 턴");
    p.push(turn);
  }
  return p.join("\n");
}

function apiText(m){
  if (m.narr) return (m.r==="a" ? "(도입부 나레이션: " : "(상황: ") + m.t + ")";
  if (m.ooc) return "OOC: " + m.t.replace(/^\/ooc\s*/i,"");
  if (m.r==="u"){
    var k = cmdOf(m.t);
    if (k){
      var extra = m.t.slice(k.length).trim();
      return (CMD_SAY[k]||"") + (extra ? " " + extra : "");
    }
  }
  return m.t;
}

function cutLog(c, log){
  var b = c.breakAt||0;
  return (b>0 && b<log.length) ? log.slice(b) : log;
}
function callAPI(c, log, turnInstr){
  log = cutLog(c, log);
  var sys=buildSystem(c, turnInstr), url, headers, body;
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    body={ model:cfg.model, max_tokens:cfg.maxTokens,
      messages:[{role:"system",content:sys}].concat(log.map(function(m){
        return { role: m.r==="u"?"user":"assistant", content: apiText(m) };
      })) };
  } else {
    var contents=log.map(function(m){
      return { role: m.r==="u"?"user":"model", parts:[{ text: apiText(m) }] };
    });
    if (contents.length && contents[0].role==="model")
      contents.unshift({ role:"user", parts:[{ text:"(상황 시작)" }] });
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    body={ systemInstruction:{parts:[{text:sys}]}, contents:contents, generationConfig:{ maxOutputTokens:cfg.maxTokens } };
  }
  return fetch(url,{ method:"POST", headers:headers, body:JSON.stringify(body) })
  .then(function(res){
    return res.text().then(function(txt){
      var data=null; try{ data=JSON.parse(txt); }catch(e){}
      if (!res.ok){
        var em=(data&&data.error&&(data.error.message||data.error))||txt.slice(0,300);
        throw new Error("서버가 "+res.status+" 로 응답했어.\n"+em);
      }
      var out="";
      if (cfg.mode==="openai"){
        var ch=data&&data.choices&&data.choices[0];
        if(!ch) throw new Error("응답이 비어서 돌아왔어. 주소나 모델 이름을 확인해봐.");
        out=((ch.message&&ch.message.content)||ch.text||"").trim();
      } else {
        var cand=data&&data.candidates&&data.candidates[0];
        if(!cand) throw new Error("응답이 비어서 돌아왔어. 모델 이름이나 키를 확인해봐.");
        out=((cand.content&&cand.content.parts)||[]).map(function(x){return x.text||"";}).join("").trim();
      }
      if(!out) throw new Error("본문이 비어 있어. 응답 길이를 늘리거나 프롬프트를 바꿔봐.");
      return out;
    });
  });
}

function turn(){
  var c=cur(); if(!c||busy) return;
  if(!cfg.key){ paint("API 키가 없어. 오른쪽 위 설정에서 넣어줘."); return; }
  if(cfg.mode==="openai" && !cfg.base){ paint("API 주소가 비어 있어. 설정에서 넣어줘."); return; }
  busy=true; elSend.disabled=true; paint(null,true);
  var lg0 = getLog(c.id);
  var lastU = null;
  for (var q=lg0.length-1;q>=0;q--) if (lg0[q].r==="u"){ lastU=lg0[q]; break; }
  if (lastU && cmdOf(lastU.t)==="/전환" && !lastU.done){
    lastU.done = true;
    setLog(c.id, lg0);
    return makeRecap(c, function(){
      c.breakAt = getLog(c.id).length - 1;
      saveChars();
      busy=false; elSend.disabled=false;
      turn();
    });
  }
  var lg = getLog(c.id).slice(), ti = null;
  if (regenAlt && lg.length && lg[lg.length-1].r==="a") lg = lg.slice(0,-1);
  for (var i=lg.length-1;i>=0;i--){
    if (lg[i].r==="u"){ var k=cmdOf(lg[i].t); if(k && !lg[i].ooc) ti=CMDS[k]; break; }
  }
  callAPI(c,lg,ti).then(function(text){
    var l=getLog(c.id); l.push({r:"a",t:text}); setLog(c.id,l);
    busy=false; elSend.disabled=false; paint();
  }).catch(function(e){
    busy=false; elSend.disabled=false;
    paint(e.message||"연결에 실패했어.");
  });
}

elSend.onclick=function(){
  var c=cur(); if(!c||busy) return;
  var t=elInp.value.trim(); if(!t) return;
  elInp.value=""; elInp.style.height="auto";

  if (screen==="sms"){ smsSend(t); return; }

  var sms = parseSms(c, t);
  if (sms){
    if (sms.pick) return go("smslist", c.id);
    return makeThread(c, sms.names);
  }

  var l=getLog(c.id);
  var isOoc = /^\/ooc\b/i.test(t) || /^\(?\s*ooc\s*[:：]/i.test(t);
  var mn = t.match(/^@\s*[:：]\s*([\s\S]+)$/);
  if (mn) l.push({r:"u", t:mn[1].trim(), narr:true});
  else l.push(isOoc ? {r:"u",t:t,ooc:true} : {r:"u",t:t});
  setLog(c.id,l);
  selIdx=-1; paint(); turn();
};
$("#star").onclick=function(){
  var el=elInp, st=el.selectionStart, en=el.selectionEnd, v=el.value, cur;
  if (st!==en){ el.value = v.slice(0,st)+"*"+v.slice(st,en)+"*"+v.slice(en); cur = en+2; }
  else { el.value = v.slice(0,st)+"*"+v.slice(st); cur = st+1; }
  el.focus();
  try { el.setSelectionRange(cur,cur); } catch(e){}
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,140)+"px";
};
elInp.addEventListener("input",function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,140)+"px";
});
$("#regen").onclick=function(){
  var c=cur(); if(!c||busy) return;
  var l=getLog(c.id);
  if (l.length && l[l.length-1].r==="a" && !l[l.length-1].narr){ regenAlt=true; paint(); turn(); return; }
  while(l.length && l[l.length-1].r==="a") l.pop();
  setLog(c.id,l); paint(); turn();
};
$("#undo").onclick=function(){
  var c=cur(); if(!c||busy) return;
  var l=getLog(c.id); l.pop(); setLog(c.id,l); paint();
};
$("#note").onclick=function(){ if(cur()) go("note"); };
$("#smsbtn").onclick=function(){ if(cur()) go("smslist"); };
$("#cmds").onclick=function(){
  var k = prompt("명령어를 골라 입력창에 넣을게.\n\n/문자 /일기 /속마음 /편지 /플리\n/전환   장면 넘기기\n/모브   단역 등장\n@:   내가 장면 지정\n/ooc   연기 멈추고 지시", "/문자");
  if (!k) return;
  elInp.value = k.trim()+" ";
  elInp.focus();
};
$("#reset").onclick=function(){
  var c=cur(); if(!c||busy) return;
  if(!confirm("이 캐릭터와의 대화를 처음부터 다시 시작할까?")) return;
  setLog(c.id, c.greeting?seedGreeting(c, c.greeting):[]);
  selIdx=-1; paint();
};

applyTheme();
render();
})();
</script>
