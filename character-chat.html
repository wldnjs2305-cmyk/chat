<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>캐릭터 대화</title>
<style>
  :root{
    --ink:#17151F;
    --surface:#211E2B;
    --raised:#2A2634;
    --line:#37324A;
    --text:#EBE6F2;
    --muted:#948CA6;
    --plum:#9A6FB0;
    --plum-soft:#5C3F73;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    font-size:16px;
    line-height:1.6;
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100dvh}

  /* 상단 바 */
  #bar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  #bar .ttl{flex:1;min-width:0}
  #bar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{
    flex:0 0 auto;border:0;background:transparent;color:var(--text);
    font-size:15px;padding:8px 10px;border-radius:10px;cursor:pointer;
  }
  .iconbtn:active{background:var(--raised)}

  /* 본문 */
  #view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(env(safe-area-inset-bottom) + 24px)}
  #view.chat{padding-bottom:12px}

  /* 목록 */
  .card{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;
  }
  .card:active{background:var(--raised)}
  .ava{
    flex:0 0 auto;width:44px;height:44px;border-radius:12px;
    background:var(--raised);display:flex;align-items:center;justify-content:center;
    font-size:22px;overflow:hidden;
  }
  .ava img{width:100%;height:100%;object-fit:cover}
  .card .meta{flex:1;min-width:0}
  .card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .ds{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px;line-height:1.9}

  /* 버튼 */
  .btn{
    width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;
    cursor:pointer;margin-top:10px;
  }
  .btn:active{background:var(--raised)}
  .btn.primary{background:var(--plum);border-color:var(--plum);color:#fff;font-weight:600}
  .btn.danger{color:#E08585}
  .row{display:flex;gap:8px}
  .row .btn{margin-top:10px}

  /* 폼 */
  label{display:block;margin:18px 0 6px;font-size:13px;color:var(--muted)}
  label:first-of-type{margin-top:4px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  input,textarea,select{
    width:100%;padding:12px;border-radius:11px;
    border:1px solid var(--line);background:var(--surface);color:var(--text);
    font-size:16px;font-family:inherit;line-height:1.6;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--plum)}
  textarea{resize:vertical;min-height:90px}
  .sec{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--plum);font-weight:600}
  .sec:first-child{margin-top:0;padding-top:0;border-top:0}

  /* 대화 */
  .msg{margin-bottom:18px;max-width:88%}
  .msg.me{margin-left:auto}
  .who{font-size:12px;color:var(--muted);margin-bottom:5px}
  .msg.me .who{text-align:right}
  .bub{
    padding:11px 14px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line);
    white-space:pre-wrap;word-break:break-word;
  }
  .msg.me .bub{background:var(--plum-soft);border-color:transparent}
  .bub em{color:var(--muted);font-style:italic}
  .thinking{color:var(--muted);font-size:14px;padding:4px 2px 18px}
  .err{
    background:#3A2230;border:1px solid #6B3348;color:#F0C4D0;
    padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:18px;
    white-space:pre-wrap;word-break:break-word;
  }

  /* 입력 */
  #dock{
    flex:0 0 auto;border-top:1px solid var(--line);background:var(--surface);
    padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
  }
  #dock .tools{display:flex;gap:14px;padding:0 2px 8px}
  #dock .tools button{
    background:transparent;border:0;color:var(--muted);font-size:13px;
    font-family:inherit;padding:0;cursor:pointer;
  }
  #dock .line{display:flex;gap:8px;align-items:flex-end}
  #inp{flex:1;min-height:44px;max-height:140px;border-radius:22px;padding:11px 16px}
  #send{
    flex:0 0 auto;width:44px;height:44px;border-radius:22px;border:0;
    background:var(--plum);color:#fff;font-size:17px;cursor:pointer;
  }
  #send:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <button class="iconbtn" id="left"></button>
    <div class="ttl"><h1 id="title">캐릭터</h1><div class="sub" id="subtitle"></div></div>
    <button class="iconbtn" id="right"></button>
  </header>
  <main id="view"></main>
  <div id="dock" style="display:none">
    <div class="tools">
      <button id="regen">다시 생성</button>
      <button id="undo">마지막 지우기</button>
      <button id="reset">대화 초기화</button>
    </div>
    <div class="line">
      <textarea id="inp" rows="1" placeholder="메시지"></textarea>
      <button id="send">↑</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- 저장 ---------- */
var mem = {};
var canStore = (function(){
  try { localStorage.setItem("gz.t","1"); localStorage.removeItem("gz.t"); return true; }
  catch(e){ return false; }
})();
function put(k,v){
  var s = JSON.stringify(v);
  if (canStore) { try { localStorage.setItem(k,s); return; } catch(e){} }
  mem[k]=s;
}
function get(k,d){
  var s = null;
  if (canStore) { try { s = localStorage.getItem(k); } catch(e){} }
  if (s===null) s = mem[k];
  if (s===null || s===undefined) return d;
  try { return JSON.parse(s); } catch(e){ return d; }
}

var cfg = get("gz.cfg", {
  key:"", base:"https://generativelanguage.googleapis.com",
  model:"gemini-3.6-flash", maxTokens:1400
});
var chars = get("gz.chars", []);
function saveCfg(){ put("gz.cfg", cfg); }
function saveChars(){ put("gz.chars", chars); }
function logKey(id){ return "gz.log."+id; }
function getLog(id){ return get(logKey(id), []); }
function setLog(id,l){ put(logKey(id), l); }

/* ---------- 도구 ---------- */
var $ = function(s){ return document.querySelector(s); };
var view=$("#view"), bar=$("#bar"), dock=$("#dock");
var elTitle=$("#title"), elSub=$("#subtitle"), elLeft=$("#left"), elRight=$("#right");
var elInp=$("#inp"), elSend=$("#send");

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmt(s){
  // *지문* 은 흐린 기울임체, 나머지는 그대로
  return esc(s).split(/(\*[^*\n]+\*)/g).map(function(p){
    if (p.length>2 && p.charAt(0)==="*" && p.charAt(p.length-1)==="*")
      return "<em>"+p.slice(1,-1)+"</em>";
    return p;
  }).join("");
}
function avaHTML(v, fallback){
  var s = (v||"").trim();
  if (/^https?:\/\//i.test(s)) return '<div class="ava"><img src="'+esc(s)+'" alt=""></div>';
  return '<div class="ava">'+esc(s||fallback)+"</div>";
}
function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- 화면 전환 ---------- */
var screen = "list", curId = null, busy = false;

function go(s, id){
  screen = s; if (id !== undefined) curId = id;
  render();
}
function cur(){
  for (var i=0;i<chars.length;i++) if (chars[i].id===curId) return chars[i];
  return null;
}

function render(){
  view.className = "";
  dock.style.display = "none";
  elLeft.textContent = ""; elRight.textContent = "";
  elLeft.onclick = null; elRight.onclick = null;

  if (screen==="list") return viewList();
  if (screen==="chat") return viewChat();
  if (screen==="edit") return viewEdit();
  if (screen==="cfg")  return viewCfg();
}

/* ---------- 목록 ---------- */
function viewList(){
  elTitle.textContent = "캐릭터";
  elSub.textContent = chars.length ? chars.length+"명" : "";
  elRight.textContent = "설정";
  elRight.onclick = function(){ go("cfg"); };

  var h = "";
  if (!chars.length){
    h += '<div class="empty">아직 캐릭터가 없어.<br>아래에서 하나 만들어봐.</div>';
  } else {
    for (var i=0;i<chars.length;i++){
      var c = chars[i], n = getLog(c.id).length;
      h += '<div class="card" data-open="'+c.id+'">'
         + avaHTML(c.avatar,"🙂")
         + '<div class="meta"><div class="nm">'+esc(c.name||"이름 없음")+'</div>'
         + '<div class="ds">'+esc(c.tagline || (n? n+"개의 메시지" : "아직 대화 없음"))+'</div></div>'
         + '</div>';
    }
  }
  h += '<button class="btn primary" id="new">새 캐릭터</button>';
  if (!cfg.key) h += '<div class="hint">대화하려면 설정에서 API 키를 먼저 넣어줘.</div>';
  view.innerHTML = h;

  $("#new").onclick = function(){
    var c = {
      id:uid(), name:"", avatar:"", tagline:"", prompt:"", world:"",
      greeting:"", userName:"", userAvatar:"", userPrompt:"", length:"보통"
    };
    chars.push(c); saveChars(); go("edit", c.id);
  };
  Array.prototype.forEach.call(view.querySelectorAll("[data-open]"), function(el){
    el.onclick = function(){ go("chat", el.getAttribute("data-open")); };
  });
}

/* ---------- 캐릭터 편집 ---------- */
function field(label, key, val, ph, big, hint){
  var tag = big
    ? '<textarea data-k="'+key+'" placeholder="'+esc(ph)+'" style="min-height:'+big+'px">'+esc(val)+'</textarea>'
    : '<input data-k="'+key+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'">';
  return '<label>'+esc(label)+'</label>'+tag+(hint?'<div class="hint">'+hint+'</div>':"");
}

function viewEdit(){
  var c = cur(); if (!c) return go("list");
  elTitle.textContent = "캐릭터 설정";
  elSub.textContent = c.name || "";
  elLeft.textContent = "← 목록";
  elLeft.onclick = function(){ saveChars(); go("list"); };

  var h = "";
  h += '<div class="sec">캐릭터</div>';
  h += field("이름","name",c.name,"이치조 미나토");
  h += field("프로필 사진","avatar",c.avatar,"이모지 또는 이미지 주소",0,"이모지 하나를 넣거나, http로 시작하는 이미지 주소를 넣어도 돼.");
  h += field("한 줄 소개","tagline",c.tagline,"나고야 이치조 가문의 후계자");
  h += field("캐릭터 프롬프트","prompt",c.prompt,"성격, 배경, 말투, 습관, 관계 등을 자유롭게 적어줘.",200);
  h += field("세계관 / 상황","world",c.world,"지금 어떤 상황에서 시작하는지.",120);
  h += field("첫 마디","greeting",c.greeting,"*문을 열자마자 시선이 마주친다* 늦었네.",100,"방에 들어가면 캐릭터가 이 말부터 해. 비워두면 내가 먼저 말을 걸어야 해.");

  h += '<div class="sec">나</div>';
  h += field("내 이름","userName",c.userName,"시라유키 히나");
  h += field("내 프로필 사진","userAvatar",c.userAvatar,"이모지 또는 이미지 주소");
  h += field("내 캐릭터 프롬프트","userPrompt",c.userPrompt,"내가 연기하는 인물의 설정. 캐릭터가 나를 어떻게 알고 있는지.",140);

  h += '<div class="sec">응답</div>';
  h += '<label>길이</label><select data-k="length">'
     + ["짧게","보통","길게"].map(function(o){
         return '<option'+(c.length===o?" selected":"")+'>'+o+"</option>"; }).join("")
     + "</select>";

  h += '<button class="btn primary" id="done">저장하고 대화하기</button>';
  h += '<button class="btn danger" id="del">이 캐릭터 삭제</button>';
  view.innerHTML = h;

  Array.prototype.forEach.call(view.querySelectorAll("[data-k]"), function(el){
    el.oninput = el.onchange = function(){ c[el.getAttribute("data-k")] = el.value; saveChars(); };
  });
  $("#done").onclick = function(){ saveChars(); go("chat", c.id); };
  $("#del").onclick = function(){
    if (!confirm((c.name||"이 캐릭터")+" 삭제할까? 대화 내용도 같이 지워져.")) return;
    chars = chars.filter(function(x){ return x.id!==c.id; });
    saveChars(); put(logKey(c.id), []); go("list");
  };
}

/* ---------- 설정 ---------- */
function viewCfg(){
  elTitle.textContent = "설정";
  elSub.textContent = "";
  elLeft.textContent = "← 목록";
  elLeft.onclick = function(){ go("list"); };

  var h = "";
  h += '<div class="sec">연결</div>';
  h += '<label>API 키</label><input id="k" value="'+esc(cfg.key)+'" placeholder="AIza..." autocapitalize="off" autocorrect="off" spellcheck="false">';
  h += '<div class="hint">Google AI Studio에서 받은 키를 넣으면 돼. 키는 이 기기에만 저장되고 아무 데도 전송되지 않아.</div>';
  h += '<label>모델</label><input id="m" value="'+esc(cfg.model)+'" placeholder="gemini-3.6-flash" autocapitalize="off" spellcheck="false">';
  h += '<label>서버 주소</label><input id="b" value="'+esc(cfg.base)+'" autocapitalize="off" spellcheck="false">';
  h += '<div class="hint">기본값은 구글 서버야. 직접 세운 중계 서버를 쓸 거면 그 주소로 바꿔.</div>';
  h += '<label>최대 응답 길이</label><input id="t" value="'+esc(cfg.maxTokens)+'" inputmode="numeric">';

  h += '<div class="sec">백업</div>';
  h += '<div class="hint">사파리가 저장 공간을 정리하면 캐릭터가 사라질 수 있어. 가끔 내보내서 메모장에 붙여두면 안전해.</div>';
  h += '<button class="btn" id="exp">전체 내보내기</button>';
  h += '<label>불러오기</label><textarea id="impbox" placeholder="내보낸 내용을 여기 붙여넣어"></textarea>';
  h += '<button class="btn" id="imp">불러오기</button>';
  if (!canStore) h += '<div class="hint">지금 브라우저에서 저장이 막혀 있어. 창을 닫으면 내용이 사라지니까 꼭 내보내둬.</div>';
  view.innerHTML = h;

  $("#k").oninput = function(){ cfg.key = this.value.trim(); saveCfg(); };
  $("#m").oninput = function(){ cfg.model = this.value.trim(); saveCfg(); };
  $("#b").oninput = function(){ cfg.base = this.value.trim().replace(/\/+$/,""); saveCfg(); };
  $("#t").oninput = function(){ cfg.maxTokens = parseInt(this.value,10)||1400; saveCfg(); };

  $("#exp").onclick = function(){
    var out = { cfg:cfg, chars:chars, logs:{} };
    chars.forEach(function(c){ out.logs[c.id] = getLog(c.id); });
    var box = document.createElement("textarea");
    box.value = JSON.stringify(out);
    box.style.cssText = "width:100%;min-height:120px;margin-top:10px";
    this.parentNode.insertBefore(box, this.nextSibling);
    box.select();
    try { document.execCommand("copy"); alert("복사했어. 메모장에 붙여넣어 둬."); }
    catch(e){ alert("아래 칸의 내용을 길게 눌러서 복사해줘."); }
  };
  $("#imp").onclick = function(){
    var raw = $("#impbox").value.trim();
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (d.cfg) { cfg = d.cfg; saveCfg(); }
      if (d.chars) { chars = d.chars; saveChars(); }
      if (d.logs) for (var id in d.logs) setLog(id, d.logs[id]);
      alert("불러왔어."); go("list");
    } catch(e){ alert("형식이 안 맞아. 내보낸 내용 전체를 붙여넣었는지 확인해줘."); }
  };
}

/* ---------- 대화 ---------- */
function viewChat(){
  var c = cur(); if (!c) return go("list");
  elTitle.textContent = c.name || "이름 없음";
  elSub.textContent = c.tagline || "";
  elLeft.textContent = "← 목록";
  elLeft.onclick = function(){ go("list"); };
  elRight.textContent = "설정";
  elRight.onclick = function(){ go("edit", c.id); };

  view.className = "chat";
  dock.style.display = "block";

  var log = getLog(c.id);
  if (!log.length && c.greeting){
    log = [{ r:"a", t:c.greeting }];
    setLog(c.id, log);
  }
  paint();
}

function paint(err, thinking){
  var c = cur(); if (!c) return;
  var log = getLog(c.id), h = "";
  for (var i=0;i<log.length;i++){
    var m = log[i], me = m.r==="u";
    h += '<div class="msg'+(me?" me":"")+'">'
       + '<div class="who">'+esc(me ? (c.userName||"나") : (c.name||"상대"))+"</div>"
       + '<div class="bub">'+fmt(m.t)+"</div></div>";
  }
  if (thinking) h += '<div class="thinking">'+esc(c.name||"상대")+" 입력 중…</div>";
  if (err) h += '<div class="err">'+esc(err)+"</div>";
  if (!log.length && !thinking && !err)
    h += '<div class="empty">먼저 말을 걸어봐.</div>';
  view.innerHTML = h;
  view.scrollTop = view.scrollHeight;
}

function buildSystem(c){
  var lenMap = {
    "짧게":"2~3문장으로 짧게",
    "보통":"4~6문장 정도로",
    "길게":"8~12문장으로 묘사를 충분히 넣어"
  };
  var p = [];
  p.push("너는 상황극 파트너다. 아래 설정의 '"+(c.name||"캐릭터")+"'를 연기한다.");
  p.push("");
  p.push("[캐릭터]");
  p.push("이름: "+(c.name||""));
  if (c.tagline) p.push(c.tagline);
  if (c.prompt) p.push(c.prompt);
  if (c.world){ p.push(""); p.push("[상황과 세계관]"); p.push(c.world); }
  p.push("");
  p.push("[상대역]");
  p.push("이름: "+(c.userName||"상대"));
  if (c.userPrompt) p.push(c.userPrompt);
  p.push("");
  p.push("[작성 규칙]");
  p.push("- "+(c.name||"캐릭터")+"의 시점에서만 쓴다. 상대역의 대사, 행동, 속마음을 대신 서술하지 않는다.");
  p.push("- 행동과 상황 묘사는 *별표* 안에 쓴다. 대사는 별표 없이 그대로 쓰고 따옴표를 붙이지 않는다.");
  p.push("- 분량은 "+(lenMap[c.length]||lenMap["보통"])+" 쓴다.");
  p.push("- AI, 설정, 프롬프트 같은 메타 발언을 하지 않는다.");
  p.push("- 이야기를 마무리 짓지 말고 상대가 이어갈 여지를 남긴다.");
  p.push("- 설정에 없는 부분은 캐릭터 성격에 맞게 자연스럽게 채운다.");
  p.push("- 한국어로 쓴다.");
  return p.join("\n");
}

function callAPI(c, log){
  var contents = log.map(function(m){
    return { role: m.r==="u" ? "user" : "model", parts:[{ text:m.t }] };
  });
  if (contents.length && contents[0].role==="model")
    contents.unshift({ role:"user", parts:[{ text:"(상황 시작)" }] });

  var url = cfg.base + "/v1beta/models/" + encodeURIComponent(cfg.model)
          + ":generateContent?key=" + encodeURIComponent(cfg.key);

  return fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      systemInstruction:{ parts:[{ text: buildSystem(c) }] },
      contents: contents,
      generationConfig:{ maxOutputTokens: cfg.maxTokens }
    })
  }).then(function(res){
    return res.text().then(function(txt){
      var data = null;
      try { data = JSON.parse(txt); } catch(e){}
      if (!res.ok){
        var msg = (data && data.error && data.error.message) || txt.slice(0,300);
        throw new Error("서버가 " + res.status + " 로 응답했어.\n" + msg);
      }
      var cand = data && data.candidates && data.candidates[0];
      if (!cand) throw new Error("응답이 비어서 돌아왔어. 프롬프트가 막혔거나 모델 이름이 틀렸을 수 있어.");
      var parts = (cand.content && cand.content.parts) || [];
      var out = parts.map(function(p){ return p.text || ""; }).join("").trim();
      if (!out) throw new Error("본문이 비어 있어. 응답 길이를 늘리거나 프롬프트를 조금 바꿔봐.");
      return out;
    });
  });
}

function turn(){
  var c = cur(); if (!c || busy) return;
  if (!cfg.key){ paint("API 키가 없어. 오른쪽 위 설정에서 넣어줘."); return; }
  busy = true; elSend.disabled = true;
  paint(null, true);

  callAPI(c, getLog(c.id)).then(function(text){
    var log = getLog(c.id);
    log.push({ r:"a", t:text });
    setLog(c.id, log);
    busy = false; elSend.disabled = false;
    paint();
  }).catch(function(e){
    busy = false; elSend.disabled = false;
    paint(e.message || "연결에 실패했어. 인터넷과 서버 주소를 확인해줘.");
  });
}

elSend.onclick = function(){
  var c = cur(); if (!c || busy) return;
  var t = elInp.value.trim(); if (!t) return;
  var log = getLog(c.id);
  log.push({ r:"u", t:t });
  setLog(c.id, log);
  elInp.value = ""; elInp.style.height = "auto";
  paint();
  turn();
};
elInp.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 140) + "px";
});

$("#regen").onclick = function(){
  var c = cur(); if (!c || busy) return;
  var log = getLog(c.id);
  while (log.length && log[log.length-1].r==="a") log.pop();
  setLog(c.id, log);
  paint(); turn();
};
$("#undo").onclick = function(){
  var c = cur(); if (!c || busy) return;
  var log = getLog(c.id);
  log.pop(); setLog(c.id, log); paint();
};
$("#reset").onclick = function(){
  var c = cur(); if (!c || busy) return;
  if (!confirm("이 캐릭터와의 대화를 처음부터 다시 시작할까?")) return;
  setLog(c.id, c.greeting ? [{ r:"a", t:c.greeting }] : []);
  paint();
};

render();
})();
</script>
</body>
</html>
