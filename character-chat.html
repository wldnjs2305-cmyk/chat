  :root{
    color-scheme:light;
    --bg:#FFFFFF; --panel:#FFFFFF; --field:#F4F3F7; --line:#E7E5EC;
    --text:#191820; --muted:#8B8896; --bub:#EFEEF2; --mine:#E3DFF6;
    --nar:#736F80; --accent:#6F5FC4; --trc:#4C4857;
    --paper:#FCFBF8; --paper-line:#E2DFD6; --paper-text:#2F2C27;
    --paper-rule:rgba(110,115,135,.15);
  }
  body.dark{
    color-scheme:dark;
    --bg:#0C0C11; --panel:#131318; --field:#1C1C23; --line:#292932;
    --text:#F2F1F6; --muted:#8B8896; --bub:#292930; --mine:#3F3AA8;
    --nar:#ADAABA; --accent:#8B84F0; --trc:#CAC7DA;
    --paper:#1A1A22; --paper-line:#2E2E3A; --paper-text:#DEDCE6;
    --paper-rule:rgba(190,195,220,.13);
  }
  body.dark .msg.me .bub{color:#F5F4FA}
  body.dark .sm.r .b{color:#F5F4FA}

  /* 밝은 테마들 */
  /* 그린 — 크림소다 */
  body[data-theme=green]{
    --bg:#ffffff; --panel:#ffffff; --field:#f0faea; --line:#cfeabd;
    --text:#22331c; --muted:#7ea272; --bub:#eafadf; --mine:#b9ec8f;
    --nar:#767A7E; --accent:#4aa63f; --trc:#6f7377;
    --paper:#f7fdf3; --paper-line:#cfeabd; --paper-text:#22331c;
    --paper-rule:rgba(90,150,70,.17);
    background:linear-gradient(180deg,#ffffff 0%,#fbfff8 34%,#eafbdd 68%,#cdf2ae 100%);
    background-attachment:fixed;
  }
  body[data-theme=green] #app{position:relative;z-index:1}
  body[data-theme=green] #view{background:transparent}
  body[data-theme=green] #bar{background:rgba(255,255,255,.86);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  body[data-theme=green] #dock{background:rgba(247,253,243,.88);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  body[data-theme=green] .bub{border-radius:var(--brad,17px);
    background:#fbfef8;
    border:0;
    box-shadow:0 4px 14px rgba(90,150,70,.12)}
  body[data-theme=green] .msg.me .bub{background:#eefadf;color:#1c2d16}
  body[data-theme=green] .msg .who{color:#3f5c37;font-weight:700;font-size:13.5px;margin:0 0 6px 3px}
  body[data-theme=green] .ava{border:2px solid #fff;box-shadow:0 3px 9px rgba(90,150,70,.22)}
  body[data-theme=green] .card,
  body[data-theme=green] .castbox,
  body[data-theme=green] .statc,
  body[data-theme=green] .mind,
  body[data-theme=green] .pl{border-radius:18px;border:1px solid #cfeabd;
    box-shadow:0 4px 14px rgba(90,150,70,.10)}
  body[data-theme=green] .btn{border-radius:14px}
  body[data-theme=green] #inp{border-radius:18px;border:1px solid #cfeabd;background:#fff}
  body[data-theme=green] #send{background:#8fdc63;color:#1c2d16}

  body[data-theme=ocean]{
    background:linear-gradient(170deg,#f4faff 0%,#e4f0ff 34%,#cde3fb 68%,#aecff5 100%);
    background-attachment:fixed}
  body[data-theme=ocean]::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 18% 14%, rgba(255,255,255,.30), transparent 30%),
      radial-gradient(circle at 84% 22%, rgba(255,255,255,.24), transparent 32%),
      radial-gradient(circle at 50% 92%, rgba(120,180,245,.20), transparent 42%)}
  body[data-theme=ocean] #app{position:relative;z-index:1}
  body[data-theme=ocean] #view{background:transparent}
  body[data-theme=ocean] #bar, body[data-theme=ocean] #dock{
    background:rgba(255,255,255,.30);
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
  /* 유리 젤리 말풍선 */
  body[data-theme=ocean] .bub{
    border-radius:var(--brad,17px);
    background:#fbfdff;
    border:0;
    box-shadow:0 5px 16px rgba(45,102,184,.13);
    backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
  body[data-theme=ocean] .msg.me .bub{background:#eef5fe;color:#17304f}
  body[data-theme=ocean] .msg .who{
    color:#1b3355;font-weight:700;font-size:13.5px;margin:0 0 6px 3px}
  body[data-theme=ocean] .ava{border:2px solid rgba(255,255,255,.95);
    box-shadow:0 3px 10px rgba(45,102,184,.28)}
  body[data-theme=ocean] .card,
  body[data-theme=ocean] .castbox,
  body[data-theme=ocean] .statc,
  body[data-theme=ocean] .mind,
  body[data-theme=ocean] .pl{
    border-radius:22px;border:1px solid rgba(255,255,255,.90);
    background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(222,238,255,.50));
    box-shadow:0 8px 20px rgba(45,102,184,.12), inset 0 1px 0 rgba(255,255,255,.96);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  body[data-theme=ocean] .btn{border-radius:16px}
  body[data-theme=ocean] #inp{border-radius:22px;border:1px solid rgba(255,255,255,.94);
    background:linear-gradient(180deg, rgba(255,255,255,.88), rgba(218,235,255,.56))}
  body[data-theme=ocean] #send{
    background:linear-gradient(135deg,#7cb6f2,#246fc9);color:#fff;
    box-shadow:0 4px 12px rgba(36,111,201,.36)}
  body[data-theme=ocean] .sec{color:#246fc9}

  /* 딸기토끼 */
  body[data-theme=berry]{
    --bg:#fff8fa; --panel:#fffdfe; --field:#fff0f6; --line:#ffcfe0;
    --text:#5c3346; --muted:#c78aa2; --bub:#fff6f9; --mine:#ffe3ee;
    --nar:#7E7986; --accent:#ff5c7f; --trc:#7a747f;
    --paper:#fffdfe; --paper-line:#ffcfe0; --paper-text:#5c3346;
    --paper-rule:rgba(255,140,180,.20);
  }
  body[data-theme=berry]{
    background:linear-gradient(135deg,#fff8fa 0%,#ffeaf1 40%,#ffd6e4 75%,#ffb8d1 100%);
    background-attachment:fixed;
  }
  @keyframes sb-a{ from{opacity:.35} to{opacity:1} }
  @keyframes sb-b{ from{opacity:.55} to{opacity:1} }
  body[data-theme=berry] #app{position:relative;z-index:1}
  body[data-theme=berry] #bar,
  body[data-theme=berry] #dock{background:rgba(255,244,248,.72);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  body[data-theme=berry] #view{background:transparent}
  /* 말풍선 — 흰 발광에 분홍 잔광 */
  body[data-theme=berry] .bub{
    border-radius:var(--brad,17px);border:0;
    background:#fffbfd;
    box-shadow:0 4px 14px rgba(255,140,180,.13)}
  body[data-theme=berry] .msg.me .bub{background:#fdf0f6;color:#4a2836}
  /* 이름은 분홍 알약 뱃지로 */
  body[data-theme=berry] .msg .who{
    color:#3a2b33;font-weight:700;font-size:13.5px;margin:0 0 6px 3px}
  /* 프사에 흰 테두리와 분홍 링 */
  body[data-theme=berry] .ava{
    border:2px solid #fff;
    box-shadow:0 3px 9px rgba(255,120,160,.30)}
  body[data-theme=berry] .card,
  body[data-theme=berry] .castbox,
  body[data-theme=berry] .statc,
  body[data-theme=berry] .mind,
  body[data-theme=berry] .pl,
  body[data-theme=berry] .paper{
    border-radius:20px;border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(255,140,180,.14)}
  body[data-theme=berry] .btn{border-radius:14px}
  body[data-theme=berry] #inp{border-radius:22px;border:1px solid #ffd6e4}
  body[data-theme=berry] #send{
    background:linear-gradient(135deg,#ff9ab8,#ff5c7f);color:#fff;
    box-shadow:0 4px 10px rgba(255,92,127,.38)}
  body[data-theme=berry] .sec{color:#ff5c7f}

  /* 레트로 — 피처폰 액정 */
  body[data-theme=retro]{
    --bg:#c5d1b8; --panel:#d3dbe3; --field:#bcc9ad; --line:#9ba5b5;
    --text:#2b3a1f; --muted:#5d6b4f; --bub:#d5dfc8; --mine:#aebb9d;
    --nar:#55663f; --accent:#1d2c88; --trc:#3f4d33;
    --paper:#cfd9c2; --paper-line:#9ba5b5; --paper-text:#2b3a1f;
  }
  body[data-theme=retro]{
    background-image:repeating-linear-gradient(0deg,
      rgba(0,0,0,.045) 0px, rgba(0,0,0,.045) 1px, transparent 1px, transparent 3px);
  }
  body[data-theme=retro] #bar{
    background:linear-gradient(to bottom,#7a9aef 0%,#5480d5 15%,#1d2c88 100%);
    border-bottom:1px solid #0f184b}
  body[data-theme=retro] #bar h1,
  body[data-theme=retro] #bar .sub,
  body[data-theme=retro] .iconbtn{color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
  body[data-theme=retro] .bub,
  body[data-theme=retro] .card,
  body[data-theme=retro] .castbox,
  body[data-theme=retro] .statc,
  body[data-theme=retro] .mind,
  body[data-theme=retro] .paper,
  body[data-theme=retro] input,
  body[data-theme=retro] textarea,
  body[data-theme=retro] select,
  body[data-theme=retro] .btn{
    border-radius:3px;border:2px solid #9ba5b5;
    box-shadow:inset 1px 1px 3px rgba(0,0,0,.14)}
  body[data-theme=retro] .bub{
    background-image:repeating-linear-gradient(0deg,
      rgba(0,0,0,.05) 0px, rgba(0,0,0,.05) 1px, transparent 1px, transparent 2px)}
  body[data-theme=retro] .ava{border-radius:3px;border:1px solid #1d2c88;
    filter:grayscale(35%) contrast(1.1) saturate(.8)}
  body[data-theme=retro] .sec{color:#1d2c88;letter-spacing:.02em}
  body[data-theme=retro] #dock{background:#d3dbe3;border-top:2px solid #9ba5b5}
  body[data-theme=retro] #send{border-radius:4px}
  body[data-theme=retro] .bub,
  body[data-theme=retro] .who,
  body[data-theme=retro] .sec,
  body[data-theme=retro] label,
  body[data-theme=retro] .btn,
  body[data-theme=retro] #dock .tools button,
  body[data-theme=retro] #bar h1{
    font-family:"DungGeunMo","돋움",Dotum,sans-serif;letter-spacing:.3px}
  body[data-theme=retro] .bub em{
    font-family:"DungGeunMo","돋움",Dotum,sans-serif;font-style:normal;
    opacity:.72;font-weight:400}
  /* 어두운 테마들 — body.dark 뒤에 와야 덮어쓴다 */
  body[data-theme=night]{
    --bg:#12141C; --panel:#171A24; --field:#1E222E; --line:#2A2F3D;
    --text:#E9EBF2; --muted:#858C9E; --bub:#242938; --mine:#33407A;
    --nar:#949BAD; --accent:#7C93E8; --trc:#C2C8DA;
    --paper:#1B1F2A; --paper-line:#2E3444; --paper-text:#DDE1EC;
    --paper-rule:rgba(190,200,230,.13);
  }

  /* 소설 · 대본 — 말풍선 없이 */
  body[data-view=novel] .msg, body[data-view=script] .msg{display:block;margin-bottom:24px}
  body[data-view=novel] .msg .ava, body[data-view=script] .msg .ava{display:none}
  body[data-view=novel] .msg .col, body[data-view=novel] .msg.me .col,
  body[data-view=script] .msg .col, body[data-view=script] .msg.me .col{max-width:100%}
  body[data-view=novel] .msg .who, body[data-view=script] .msg .who{display:none}
  body[data-view=novel] .bub, body[data-view=script] .bub{
    background:transparent;padding:0;border:0;border-radius:0;box-shadow:none;line-height:1.95}
  body[data-view=novel] .bub::before, body[data-view=script] .bub::before{display:none}
  body[data-view=novel] .msg.me .bub, body[data-view=script] .msg.me .bub{
    background:transparent;box-shadow:none;color:var(--text);
    border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    border-radius:0;padding:18px 2px;margin:6px 0}
  body[data-view=novel] .msg.me, body[data-view=script] .msg.me{margin-bottom:26px}
  /* 소설 — 지문은 연한 회색 정자체, 대사는 진하게 */
  .nov{white-space:pre-wrap;word-break:break-word;
    font-family:var(--f-body);font-size:var(--fs);line-height:1.95;letter-spacing:-.004em}
  .nov em{font-family:inherit;font-style:normal;font-weight:400;color:var(--nar)}
  .nov .np{margin:0 0 1.05em}
  .nov .np:last-child{margin-bottom:0}
  .nov .nn{color:var(--nar)}
  .nov .ns{color:var(--text);font-weight:500}
  .nov .ns .q2{color:inherit;font-weight:inherit}
  .nov .q2 + .tr{display:block;margin-top:1px}
  /* 대본 — 대사마다 이름표 */
  .dturn{margin-bottom:22px}
  .dturn > :last-child{margin-bottom:0}
  .snar, .ssay{white-space:pre-wrap;word-break:break-word;margin:0 0 12px;
    font-family:var(--f-body);font-size:var(--fs);line-height:1.9;letter-spacing:-.004em}
  .snar{color:var(--nar)}
  .ssay b{font-weight:700}
  .ssay b::after{content:" │ ";color:var(--muted);font-weight:400}
  .ssay .q2 + .tr{display:block;margin-top:1px}
  .dsay{white-space:pre-wrap;word-break:break-word;margin:0 0 11px;
    font-family:var(--f-body);font-size:var(--fs);line-height:1.95;letter-spacing:-.004em}
  .dsay em{font-family:var(--f-nar);font-style:italic;font-weight:300;color:var(--nar);
    font-size:calc(var(--fs) - 0.5px);line-height:1.95}
  .dsay b{font-weight:600}
  .dsay b::after{content:" │ ";color:var(--muted);font-weight:400}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:16px;line-height:1.6;overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100dvh;overflow-x:hidden}
  #bar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  #bar .ttl{flex:1;min-width:0;text-align:center}
  #bar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb{display:inline-flex;align-items:center;justify-content:center;
    min-width:44px;height:42px;font-size:19px;line-height:1;cursor:pointer}
  .iconbtn.hbs{padding:0;min-width:88px;display:flex;align-items:center;justify-content:flex-end}
  .iconbtn{flex:0 0 auto;min-width:88px;font-size:17px;border:0;background:transparent;color:var(--accent);font-size:15px;font-family:inherit;padding:8px 4px;cursor:pointer}
  .iconbtn:nth-of-type(2){text-align:right}
  .iconbtn:active{opacity:.5}
  #view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 14px calc(env(safe-area-inset-bottom) + 24px)}
  #view.chat{padding:18px 14px 8px}
  #view.sms{padding:0}

  .card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .card:active{background:var(--field)}
  .ava{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
  .ava.sm{width:32px;height:32px;font-size:16px}
  .ava.lg{width:62px;height:62px;font-size:28px}
  .ava.xs{width:26px;height:26px;font-size:13px}
  .ava img{width:100%;height:100%;object-fit:cover}
  .card .meta{flex:1;min-width:0}
  .card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .ds{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--muted);text-align:center;padding:56px 20px;font-size:14px;line-height:1.9}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;
    background:transparent;touch-action:none}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-11px;
    border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.22)}
  .btn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer;margin-top:10px}
  .btn:active{background:var(--field)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.danger{color:#D06060}
  .btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0}
  label{display:block;margin:18px 0 6px;font-size:13px;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:16px;font-family:inherit;line-height:1.6}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:90px}
  .sec{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--accent);font-weight:600}
  .sec.first{margin-top:0;padding-top:0;border-top:0}
  .pick{display:flex;align-items:center;gap:12px;margin-top:4px}
  .pick .btns{display:flex;gap:8px;flex-wrap:wrap}
  .castbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}

  /* 대화 */
  .msg{margin-bottom:var(--mgap,14px);display:flex;gap:9px;align-items:flex-start}
  .msg.me{justify-content:flex-end}
  .msg .col{min-width:0;max-width:var(--bw,84%)}
  .msg.me .col{max-width:calc(var(--bw,84%) - 6%)}
  .who{font-size:13.5px;font-weight:600;margin:2px 0 6px 2px}
  .bub{position:relative;padding:var(--bpv,9px) var(--bph,13px);border-radius:var(--brad,17px);background:var(--bub);white-space:pre-wrap;word-break:break-all;line-break:strict;font-family:var(--f-body);font-size:var(--fs);line-height:1.85;letter-spacing:-.004em;cursor:pointer}
  .msg.me .bub{background:var(--mine)}
  /* 꼬리 — 프사 쪽 모서리만 각지게 남긴다 */
  body .msg .bub{border-top-left-radius:4px}
  body .msg.me .bub{border-top-left-radius:var(--brad,17px);border-top-right-radius:4px}
  body[data-view=doc] .msg .bub,
  body[data-view=doc] .msg.me .bub{border-radius:0}
  .bub em{font-family:var(--f-nar);font-style:italic;font-weight:300;color:var(--nar);font-size:calc(var(--fs) - 0.5px);line-height:1.9}
  mark{background:rgba(255,214,0,.42);color:inherit;border-radius:3px;padding:0 1px}
  body.dark mark{background:rgba(255,214,0,.28)}
  .bub .tr{color:var(--trc);font-size:calc(var(--fs) - 1.5px)}
  .narr{margin:4px 0 20px;padding:10px 14px;text-align:left;color:var(--nar);
    font-family:var(--f-nar);font-style:italic;font-weight:300;
    font-size:calc(var(--fs) - 0.5px);line-height:1.8;white-space:pre-wrap;word-break:break-word;cursor:pointer}
  .ooc{margin:0 0 18px;padding:9px 13px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:14px;white-space:pre-wrap}
  .altbar{display:flex;align-items:center;justify-content:flex-start;gap:6px;
    margin:-12px 0 16px 41px;color:var(--muted);font-size:12px}
  .altbar button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-size:14px;line-height:1;padding:5px 11px;border-radius:12px;cursor:pointer}
  .altbar button:active{background:var(--field)}
  .altbar span{padding:0 2px;min-width:34px;text-align:center}
  .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .acts button{background:var(--field);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer}
  .acts button.del{color:#D06060}
  .sacts{justify-content:flex-start;margin-top:6px}
  .sm.r .sacts{justify-content:flex-end}
  .editbox{width:100%;min-height:120px;margin-top:4px}
  .thinking{color:var(--muted);font-size:14px;padding:2px 2px 20px 50px}
  .err{background:#FBE9EF;border:1px solid #EFC3D2;color:#8A3552;padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:18px;white-space:pre-wrap}
  body.dark .err{background:#3A2230;border-color:#6B3348;color:#F0C4D0}

  /* 특수 카드 */
  .smswrap.mini{margin:14px 0 16px;min-height:0;padding:0;border-radius:0;background:transparent}
  .smswrap.mini[data-th],
  body.dark .smswrap.mini[data-th]{--sbg:var(--bg)}
  .smswrap.mini .sm{margin-bottom:4px}
  .phone{background:var(--field);border-radius:20px;padding:12px;margin:10px 0}
  .phone .ph{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:10px;font-weight:600;font-size:14px}
  .sm .b .tr, .phone .pm .tr{color:var(--stime,var(--muted));font-size:.88em}
  .sm .b em, .phone .pm em, .mind em, .paper em{font-family:var(--f-nar);font-style:italic;
    font-weight:300;opacity:.82}
  .phone .pm{background:var(--panel);border-radius:14px;padding:9px 13px;margin-bottom:7px;max-width:86%;
    font-family:var(--f-sms, var(--f-body));font-size:var(--sfs,15px);line-height:1.6}
  .phone .pm.me{background:var(--mine);margin-left:auto}
  .paper{position:relative;background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;padding:18px 18px 20px;margin:10px 0;font-family:var(--f-nar);font-weight:300;color:var(--paper-text);line-height:2;font-size:15.5px;white-space:pre-wrap}
  .paper .pt{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;font-family:inherit}
  /* 편지 · 일기 — 줄은 본문 칸에만 그어서 글줄과 정확히 맞춘다 */
  .paper.letter, .paper.diary{
    background-color:var(--paper);
    border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.07)}
  .paper.letter{padding:19px 20px 22px}
  .paper.diary{padding:16px 20px 22px}
  /* 줄 간격은 정수 px 로 고정한다. em 으로 두면 한 줄마다 0.5px 씩 밀려서 아래로 갈수록 어긋난다 */
  .paper .ruled{
    line-height:var(--rlh,25px);
    background-image:repeating-linear-gradient(180deg,
      transparent 0, transparent calc(var(--rlh,25px) - 1px),
      var(--paper-rule, rgba(110,115,135,.15)) calc(var(--rlh,25px) - 1px),
      var(--paper-rule, rgba(110,115,135,.15)) var(--rlh,25px));
    background-position:0 0;
    background-repeat:repeat}
  .paper .ruled em{line-height:inherit;font-size:1em}
  .paper.letter .lto{font-family:inherit;font-weight:400;line-height:var(--rlh,25px);
    margin:0 0 var(--rlh,25px);letter-spacing:.01em}
  .paper.letter .lsign{display:block;text-align:right;line-height:var(--rlh,25px);
    margin:var(--rlh,25px) 0 0;font-weight:400;letter-spacing:.01em}
  .paper.diary .dhead{display:flex;align-items:baseline;gap:10px;
    font-family:inherit;font-weight:400;font-size:.92em;color:var(--muted);
    padding-bottom:9px;margin-bottom:11px;border-bottom:1.5px solid var(--paper-line)}
  .paper.diary .dhead .wd{font-weight:400;font-size:.86em}
  .udot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E0524F;margin-right:6px;vertical-align:middle}
  .ping{display:flex;align-items:center;gap:10px;margin:12px 0;padding:12px 14px;
    background:var(--field);border:1px solid var(--line);border-radius:14px;cursor:pointer}
  .ping .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#E0524F}
  .ping b{flex:1;min-width:0;font-size:calc(var(--fs) - 1.5px);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ping .go{flex:0 0 auto;font-size:12px;color:var(--accent)}
  .comm{background:var(--field);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin:12px 0;font-size:var(--cfs,14px);line-height:1.6}
  .comm .ctag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11.5px;
    background:var(--mine);color:var(--text);margin-bottom:9px}
  .comm .ctit{font-weight:700;font-size:calc(var(--cfs,14px) + 1px);line-height:1.45}
  .comm .cinfo{font-size:11.5px;color:var(--muted);margin-top:5px}
  .comm .cbody{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
    white-space:pre-wrap;word-break:break-all}
  .comm .chead{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted)}
  .comm .crow{padding:9px 0;border-top:1px solid var(--line)}
  .comm .crow:first-of-type{border-top:0}
  .comm .cwho{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;
    color:var(--muted);margin-bottom:3px}
  .comm .cup{margin-left:auto;color:#D9534F;font-weight:700;font-size:12px}
  .comm .cup::before{content:"▲ ";font-size:9px;vertical-align:1px}
  .comm .cup.dn{color:#4A7FB5}
  .comm .cup.dn::before{content:"▼ "}
  .comm .crow.re{padding-left:16px;position:relative}
  .comm .crow.re::before{content:"";position:absolute;left:4px;top:12px;bottom:10px;
    width:2px;border-radius:1px;background:var(--line)}
  .comm .crow.re .cwho{opacity:.85}
  .comm .cre{color:var(--accent);font-weight:600}
  .comm .ctx{white-space:pre-wrap;word-break:break-all}
  /* 인스타 */
  .insta{background:var(--field);border:1px solid var(--line);border-radius:16px;
    margin:10px 0;overflow:hidden;font-size:var(--cfs,14px)}
  .insta .ihd{display:flex;align-items:center;gap:9px;padding:11px 13px}
  .insta .iav{width:30px;height:30px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(135deg,#f9ce34,#ee2a7b 55%,#6228d7);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
  .insta .iid{font-weight:700;font-size:.95em;letter-spacing:-.01em}
  .insta .iph{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:var(--bub);min-height:120px;display:flex;align-items:center;justify-content:center;
    padding:26px 20px;text-align:center;color:var(--muted);font-size:.86em;line-height:1.6}
  .insta .ibd{padding:11px 13px 13px}
  .insta .ilk{font-weight:700;font-size:.9em;margin-bottom:7px}
  .insta .icap{line-height:1.6}
  .insta .icap b{font-weight:700;margin-right:5px}
  .insta .itag{color:var(--accent)}
  .insta .ihead{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    font-size:.8em;color:var(--muted)}
  .insta .irow{display:flex;gap:7px;padding:7px 0;line-height:1.55}
  .insta .irow b{font-weight:700;flex:0 0 auto}
  .insta .irow.re{padding-left:18px}
  .insta .ilike{margin-left:auto;color:var(--muted);font-size:.8em;white-space:nowrap}
  /* 카드별 글꼴 */
  .comm, .insta{font-family:"Noto Sans KR",sans-serif}
  .ord{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif}
  .statc{font-family:"Do Hyeon",sans-serif}
  .pl{font-family:"Gothic A1",sans-serif}
  .mind.secret{font-family:"Nanum Gothic Coding","Nanum Gothic",monospace;font-style:normal}
  /* 공고 */
  .notice{background:var(--paper);border:3px double var(--paper-line);border-radius:4px;
    margin:10px 0;padding:20px 18px;color:var(--paper-text);font-size:var(--cfs,14px)}
  .notice .npub{text-align:center;font-family:"Gothic A1",sans-serif;font-size:.8em;
    letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
  .notice .ntit{text-align:center;font-family:"Black Han Sans",sans-serif;
    font-size:1.5em;line-height:1.35;letter-spacing:-.02em;margin-bottom:16px;word-break:keep-all;text-wrap:balance}
  .notice .nrows{border-top:1.5px solid var(--paper-line);border-bottom:1.5px solid var(--paper-line);
    padding:12px 0;font-family:"Gothic A1",sans-serif}
  .notice .nrow{display:flex;gap:12px;padding:5px 0;line-height:1.6;align-items:flex-start}
  .notice .nk{flex:0 0 88px;font-weight:700;color:var(--muted);font-size:.92em;word-break:keep-all}
  .notice .nv{flex:1;min-width:0;white-space:pre-wrap;word-break:keep-all}
  @media (max-width:520px){
    .notice .nrow{display:block;padding:7px 0}
    .notice .nk{margin-bottom:2px;font-size:.84em;letter-spacing:.03em}
  }
  .notice .nem{text-align:center;font-family:"Black Han Sans",sans-serif;
    font-size:1.25em;line-height:1.45;margin:15px 0 4px;letter-spacing:-.01em;
    word-break:keep-all;white-space:pre-wrap;text-wrap:balance}
  .notice .nft{text-align:center;font-family:"Gothic A1",sans-serif;font-size:.85em;
    color:var(--muted);line-height:1.7;margin-top:10px;white-space:pre-wrap;word-break:keep-all;text-wrap:balance}
  .notice .nbody{font-family:"Gothic A1",sans-serif;line-height:1.75;white-space:pre-wrap;word-break:keep-all;margin-top:12px}
  .comm .csite{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:.02em}
  .comm[data-site="디시"] .ctag{background:#3b4a63;color:#e8eef7}
  .comm[data-site="카페"] .ctag{background:#e6f0dd;color:#41662c}
  .comm[data-site="카페"] .cup{color:#4f8c3a}
  .comm[data-site="에타"] .ctag{background:#dff0e4;color:#2f6b42}
  .comm[data-site="에타"] .cup{color:#3f9d5c}
  .statc{background:var(--field);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin:12px 0}
  .statc .pt{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:9px}
  .statc .row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);
    font-size:calc(var(--fs) - 1.5px);line-height:1.6}
  .statc .row:first-of-type{border-top:0}
  .statc .row b{flex:0 0 30%;font-weight:600;color:var(--muted)}
  .statc .row span{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
  .statc .row.full{display:block;color:var(--text)}
  .mind.secret{border:1px dashed var(--line)}
  .mind.secret .pt{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
  .mind,.paper,.statc,.narr{font-size:var(--cfs,14px);line-height:1.75}
  .mind{background:var(--field);border:1px solid var(--line);border-radius:18px;padding:15px 17px;margin:11px 0;font-family:var(--f-nar);font-style:italic;font-weight:300;color:var(--nar);white-space:pre-wrap}
  .ord{background:var(--field);border:1px solid var(--line);border-radius:16px;
    margin:10px 0;overflow:hidden;font-size:var(--cfs,14px)}
  .ord .ohd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:13px 16px 12px;border-bottom:1px solid var(--line)}
  .ord .ohd b{font-size:1em;font-weight:700;letter-spacing:-.01em}
  .ord .ohd i{font-style:normal;font-size:.82em;color:var(--muted)}
  .ord .orow{display:flex;align-items:flex-start;gap:12px;padding:12px 16px}
  .ord .orow + .orow{border-top:1px solid var(--line)}
  .ord .omain{flex:1;min-width:0}
  .ord .onm{font-size:.98em;line-height:1.42;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ord .osub{font-size:.8em;color:var(--muted);margin-top:5px;line-height:1.4}
  .ord .oright{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;
    align-items:flex-end;gap:5px}
  .ord .opr{font-size:.98em;font-weight:700;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .ord .ost{font-size:.74em;line-height:1;padding:4px 8px;border-radius:99px;
    white-space:nowrap;background:var(--line);color:var(--muted)}
  .ord .ost.on{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent)}
  .pl{background:var(--field);border-radius:16px;padding:6px 4px;margin:10px 0}
  .pl a{display:block;padding:10px 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
  .pl a:last-child{border-bottom:0}
  .pl .t{font-size:15px;font-weight:600}
  .pl .ar{font-size:13px;color:var(--muted)}
  .pl .rs{font-size:12.5px;color:var(--nar);margin-top:3px;font-style:italic}

  /* 사진 편집기 */
  #cropwrap{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.72);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:20px;-webkit-backdrop-filter:blur(6px)}
  #cropbox{width:280px;height:280px;border-radius:50%;overflow:hidden;position:relative;background:#000;
    box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
  #cropbox img{position:absolute;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
  #cropwrap .ctl{width:280px;display:flex;flex-direction:column;gap:10px}
  #cropwrap input[type=range]{width:100%;padding:0}
  #cropwrap .row{display:flex;gap:8px}
  #cropwrap .row button{flex:1;padding:13px;border-radius:12px;border:0;font-family:inherit;font-size:15px;cursor:pointer}
  #cropwrap .ok{background:var(--accent);color:#fff;font-weight:600}
  #cropwrap .no{background:rgba(255,255,255,.16);color:#fff}
  #cropwrap .tip{color:#fff;opacity:.75;font-size:13px;text-align:center}

  /* 문자 화면 */
  .smswrap{margin:0;min-height:100%;padding:0 0 10px;background:var(--sbg)}

<script>
(function(){

var mem = {};

function put(k,v){

  mem[k]=s; return true;
}

  var s = null;
  if (canStore) { try { s = localStorage.getItem(k); } catch(e){} }

var $ = function(s){ return document.querySelector(s); };
var view=$("#view"), dock=$("#dock");

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function hilite(t){
  if (!findQ) return t;
  var q = findQ.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return t.replace(new RegExp("("+q+")","g"), "<mark>$1</mark>");
}
/* 지문이 끝나고 대사가 이어지는 자리의 줄바꿈은 붙인다. 빈 줄은 문단이라 그대로 둔다 */
/* 모델이 흘린 태그 조각을 지운다 */
function stripJunk(s){
  var t = String(s||"");
  t = t.replace(/<\/?[a-zA-Z][^>\n]{0,80}>/g,"");
  t = t.replace(/["\u201d]?\s*(?:class|style|id)\s*=\s*"[^"\n]{0,60}"\s*>?/g,"");
  t = t.replace(/^\s*#{1,6}\s+/gm,"");
  t = t.replace(/["\u201d]?\s*[a-zA-Z]{1,10}\s*"\s*>/g,"");
  t = t.replace(/<\s*\/?\s*(?:span|div|em|b|i|p|br|tr|td)\b[^>]{0,60}>?/gi,"");
  return t;
}
function joinFlow(s){
  var t = stripJunk(s).replace(/\r/g,"");
  return t.split(/\n{2,}/).map(function(par){
    return par.split("\n").map(function(l){ return l.trim(); })
              .filter(Boolean).join(" ");
  }).filter(Boolean).join("\n\n");
}
function quoteMark(t){
  /* 태그 안쪽은 건드리지 않는다 */
  return String(t).split(/(<[^>]*>)/).map(function(part,i){
    if (i % 2) return part;
    part = part.replace(/(&quot;[^&\n]*?&quot;|"[^"\n]*?"|“[^”\n]*?”)/g,'<span class="q2">$1</span>');
    return part.replace(/('[^'\n]{1,80}'|‘[^’\n]{1,80}’)/g,'<span class="q1">$1</span>');
  }).join("");
}
/* 말풍선에서는 대사 조각을 통째로 감싼 따옴표만 벗긴다. 지문 안쪽 따옴표는 놔둔다 */
function dropQuotes(s){
  return String(s||"").split(/(\*{1,3}[\s\S]+?\*{1,3})/).map(function(part,i){
    if (i % 2) return part;
    return part.split(/\n{2,}/).map(function(blk){
      var t = blk.trim();
      var m = t.match(/^[\u201c"]([\s\S]*)[\u201d"]$/);
      return m ? blk.replace(t, m[1]) : blk;
    }).join("\n\n");
  }).join("");
}
function fmt(s){
  var t = esc(joinFlow(dropQuotes(s))).replace(/\n{3,}/g,"\n\n").trim();
  t = t.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
  t = t.replace(/\*{1,3}([^*]+?)\*{1,3}/g,'<em>$1</em>');
  t = quoteMark(t);
  return hilite(t.replace(/\*/g,""));
}
/* 지문(별표 안)과 대사를 조각으로 나눈다 */
function docSegs(raw){
  var t=String(raw||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();
  var segs=[], re=/\*{1,3}([\s\S]+?)\*{1,3}/g, last=0, m;
  while ((m=re.exec(t))){
    if (m.index>last){ var pre=t.slice(last,m.index).trim(); if(pre) segs.push({nar:false,t:pre}); }
    var inner=m[1].trim(); if(inner) segs.push({nar:true,t:inner});
    last=re.lastIndex;
  }
  var tail=t.slice(last).trim(); if(tail) segs.push({nar:false,t:tail});
  if (!segs.length && t) segs.push({nar:false,t:t});
  return segs;
}
/* 한 줄씩 끊긴 걸 한 문단으로 이어 붙인다. 빈 줄은 문단 나눔으로 남긴다 */
function flow(s){
  return String(s||"").split(/\n{2,}/).map(function(par){
    return par.split("\n").map(function(l){ return l.trim(); }).filter(Boolean).join(" ");
  }).filter(Boolean).join("\n\n");
}
function fmtIn(s){
  var t=esc(flow(stripJunk(s)));
  t=t.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
  return t.replace(/\*/g,"");
}
/* 대사에 따옴표를 씌운다. 이미 있으면 그대로 둔다 */
function quoteSay(txt){
  var t = String(txt||"").trim();
  if (!t) return t;
  if (/^["“'‘「『]/.test(t)) return t;
  return "\u201c" + t + "\u201d";
}
/* 소설 — 한 덩어리로 흐르고, 지문만 회색, 대사에는 따옴표 */
function novelHTML(raw, i){
  /* 원문의 문단 나눔을 그대로 살린다 */
  var pars = String(stripJunk(raw)).replace(/\r/g,"").split(/\n{2,}/), out = "";
  pars.forEach(function(par){
    par = par.split("\n").map(function(x){ return x.trim(); }).filter(Boolean).join(" ");
    if (!par) return;
    var segs = docSegs(par), inner = "";
    segs.forEach(function(sg, k){
      var body = sg.nar ? sg.t : quoteSay(sg.t);
      var tx = esc(body);
      tx = tx.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
      tx = hilite(quoteMark(tx));
      inner += (sg.nar ? '<span class="nn">' : '<span class="ns">') + tx + '</span>';
      if (k < segs.length-1) inner += " ";
    });
    if (inner) out += '<p class="np">'+inner+'</p>';
  });
  if (!out) return "";
  return '<div class="nov" data-i="'+i+'">'+out+'</div>';
}
/* 대본 — 지문과 대사를 나누고 대사에만 이름표 */
function scriptHTML(nm, raw, i){
  var segs = docSegs(stripJunk(raw)), out = "";
  segs.forEach(function(sg){
    var tx = esc(flow(sg.nar ? sg.t : quoteSay(sg.t)));
    tx = tx.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
    tx = hilite(quoteMark(tx));
    if (sg.nar) out += '<div class="snar">'+tx+'</div>';
    else out += '<div class="ssay"><b>'+esc(nm||"")+'</b>'+tx+'</div>';
  });
  if (!out) return "";
  return '<div class="dturn" data-i="'+i+'">'+out+'</div>';
}
function docHTML(nm, raw, i){
  var t = String(raw||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();
  if (!t) return "";
  var out = esc(t);
  out = out.replace(/\*{1,3}([\s\S]+?)\*{1,3}/g,'<em>$1</em>');
  out = out.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
  return '<div class="dsay" data-i="'+i+'"><b>'+esc(nm||"")+'</b>'+hilite(out)+'</div>';

function avaHTML(v, fb, cls){
  var s=(v||"").trim(), k="ava"+(cls?" "+cls:"");
  if (/^(https?:|data:image)/i.test(s)) return '<div class="'+k+'"><img src="'+esc(s)+'" alt=""></div>';
  return '<div class="'+k+'">'+esc(s||fb)+"</div>";
}
function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function castOf(c){ return (c.cast||[]).filter(function(x){ return x && x.name; }); }

function faceOf(c){

function pickPhoto(done){
  var inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var M=640, w=img.width, h=img.height, r=Math.min(1, M/Math.max(w,h));
        var cv=document.createElement("canvas");

/* 확대, 위치 잡아서 동그랗게 자르기 */
function editPhoto(src, done){
  var S = 280;
  var wrap = document.createElement("div");
  wrap.id = "cropwrap";
  wrap.innerHTML = '<div class="tip">손가락으로 움직이고, 두 손가락으로 확대할 수 있어</div>'
    + '<div id="cropbox"><img id="cropimg" alt=""></div>'
    + '<div class="ctl"><input id="cropz" type="range" min="100" max="400" value="100">'
    + '<div class="row"><button class="no" id="cropno">취소</button>'
    + '<button class="ok" id="cropok">저장</button></div></div>';
  document.body.appendChild(wrap);

  var im = wrap.querySelector("#cropimg");
  var base=1, z=1, ox=0, oy=0, iw=0, ih=0;

  function clamp(){
    var dw=iw*base*z, dh=ih*base*z;
    if (ox > 0) ox = 0;
    if (oy > 0) oy = 0;
    if (ox < S-dw) ox = S-dw;
    if (oy < S-dh) oy = S-dh;
  }
  function draw(){
    clamp();
    im.style.width = (iw*base*z)+"px";
    im.style.height = (ih*base*z)+"px";
    im.style.left = ox+"px";
    im.style.top = oy+"px";
  }
  im.onload = function(){
    iw=im.naturalWidth; ih=im.naturalHeight;
    base = S/Math.min(iw,ih);
    z=1; ox=(S-iw*base)/2; oy=(S-ih*base)/2;
    im.style.position="absolute";
    draw();
  };
  im.src = src;

  var box = wrap.querySelector("#cropbox");
  var px=0, py=0, pd=0, pz=1, dragging=false;
  function dist(t){
    var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }
  box.addEventListener("touchstart", function(e){
    if (e.touches.length===1){ dragging=true; px=e.touches[0].clientX; py=e.touches[0].clientY; }
    else if (e.touches.length===2){ dragging=false; pd=dist(e.touches); pz=z; }
  }, {passive:true});
  box.addEventListener("touchmove", function(e){
    e.preventDefault();
    if (e.touches.length===1 && dragging){
      var x=e.touches[0].clientX, y=e.touches[0].clientY;
      ox += x-px; oy += y-py; px=x; py=y; draw();
    } else if (e.touches.length===2 && pd){
      var nz = Math.max(1, Math.min(4, pz * dist(e.touches)/pd));
      var cx=S/2, cy=S/2, k=nz/z;
      ox = cx - (cx-ox)*k; oy = cy - (cy-oy)*k;
      z = nz; wrap.querySelector("#cropz").value = Math.round(z*100); draw();
    }
  }, {passive:false});
  box.addEventListener("touchend", function(){ dragging=false; pd=0; }, {passive:true});
  box.addEventListener("mousedown", function(e){ dragging=true; px=e.clientX; py=e.clientY; });
  window.addEventListener("mousemove", function(e){
    if(!dragging) return;
    ox += e.clientX-px; oy += e.clientY-py; px=e.clientX; py=e.clientY; draw();
  });
  window.addEventListener("mouseup", function(){ dragging=false; });

  wrap.querySelector("#cropz").oninput = function(){
    var nz = Math.max(1, Math.min(4, this.value/100));
    var cx=S/2, cy=S/2, k=nz/z;
    ox = cx - (cx-ox)*k; oy = cy - (cy-oy)*k;
    z = nz; draw();
  };
  wrap.querySelector("#cropno").onclick = function(){ wrap.remove(); };
  wrap.querySelector("#cropok").onclick = function(){
    var out=200, cv=document.createElement("canvas");
    cv.width=out; cv.height=out;
    var sc = base*z, sx = -ox/sc, sy = -oy/sc, ss = S/sc;
    cv.getContext("2d").drawImage(im, sx, sy, ss, ss, 0, 0, out, out);
    wrap.remove();
    done(cv.toDataURL("image/jpeg",0.85));
  };
}

/* 어떤 모양으로 온 프리셋이든 블록으로 쪼갠다 */
function psBlocks(o){
  var out=[], seen={};
  function add(nm, body, on){
    body=String(body==null?"":body).trim();
    if (body.length<8) return;
    var key=body.slice(0,300);
    if (seen[key]) return;
    seen[key]=1;
    nm=String(nm||"").trim().slice(0,40);
    out.push({ name: nm || ("블록 "+(out.length+1)), text: body.slice(0,60000), on: on!==false });
  }
  if (o && isArr(o.blocks) && o.blocks.length){
    o.blocks.forEach(function(b){ if (b) add(b.name, b.text, b.on!==false); });
    if (out.length) return out;
  }
  /* 실리태번: prompts + prompt_order 로 켜짐 여부를 읽는다 */
  if (o && isArr(o.prompts)){
    var byId={}, order=null, used={};
    o.prompts.forEach(function(p){ if (p && p.identifier) byId[p.identifier]=p; });
    if (isArr(o.prompt_order) && o.prompt_order.length){
      var last=o.prompt_order[o.prompt_order.length-1];
      if (last && isArr(last.order)) order=last.order;
    }
    var push=function(p, on){
      if (!p || typeof p!=="object" || p.marker) return;
      if (p.identifier && PS_SKIP[p.identifier]) return;
      var body=p.content || p.text || p.prompt;
      if (body) add(p.name, body, on && p.enabled!==false);
    };
    if (order){
      order.forEach(function(it){
        if (!it) return;
        used[it.identifier]=1;
        push(byId[it.identifier], it.enabled!==false);
      });
      o.prompts.forEach(function(p){ if (p && p.identifier && !used[p.identifier]) push(p, false); });
    } else {
      o.prompts.forEach(function(p){ push(p, true); });
    }
  }
  /* 리수: promptTemplate */
  if (o && isArr(o.promptTemplate)){
    o.promptTemplate.forEach(function(p){
      if (!p || typeof p!=="object") return;
      if (p.type && !PS_RISU[p.type]) return;
      var body=p.text || p.content;
      if (body) add(p.name || p.type2 || p.type, body, true);
    });
  }
  PS_KEYS.forEach(function(k){ if (typeof o[k]==="string") add(k, o[k], true); });
  if (!out.length){
    (function walk(v,d){
      if (d>4 || v==null) return;
      if (typeof v==="string"){ if (v.trim().length>=25) add("", v, true); return; }
      if (isArr(v)){ v.forEach(function(x){ walk(x,d+1); }); return; }
      if (typeof v==="object") for (var k in v){ if (/key|token|api|url|model/i.test(k)) continue; walk(v[k],d+1); }
    })(o,0);
  }
  return out.slice(0,60);
}
/* 그냥 글만 있는 파일은 큰 제목 단위로 쪼갠다 */
function psTextBlocks(t){
  var lines=String(t||"").replace(/\r/g,"").split("\n"), heads=0;
  lines.forEach(function(L){ if (/^#{1,2}\s+\S/.test(L)) heads++; });
  if (heads<2) return [{ name:"본문", text:String(t||"").trim().slice(0,60000), on:true }];
  var out=[], cur=null;
  lines.forEach(function(L){
    var m=L.match(/^#{1,2}\s+(.+)$/);
    if (m){
      if (cur && cur.text.trim()) out.push(cur);
      cur={ name:m[1].trim().slice(0,40), text:"", on:true };
      return;
    }
    if (!cur) cur={ name:"머리말", text:"", on:true };
    cur.text += L+"\n";
  });
  if (cur && cur.text.trim()) out.push(cur);
  out.forEach(function(b){ b.text=b.text.trim().slice(0,60000); });
  return out.length ? out.slice(0,60) : [{ name:"본문", text:String(t||"").trim().slice(0,60000), on:true }];
}
function parsePresets(raw, fname){
  var base=String(fname||"").replace(/\.[^.]+$/,"").trim() || "새 프리셋";
  var d=null;
  try{ d=JSON.parse(raw); }catch(e){}
  if (d===null || typeof d!=="object"){
    var t=String(raw||"").trim();
    if (!t) return [];
    var junk=(t.match(/[\u0000-\u0008\u000E-\u001F\uFFFD]/g)||[]).length;
    if (junk > t.length*0.02) return [];   /* 압축된 파일은 글자가 깨져서 온다 */
    return [ mkPreset(base, psTextBlocks(t)) ];
  }
  var list = isArr(d) ? d : (isArr(d.presets) ? d.presets : [d]);
  var out=[];
  list.forEach(function(o){
    if (typeof o==="string"){ if(o.trim()) out.push(mkPreset(base, psTextBlocks(o))); return; }
    if (!o || typeof o!=="object") return;
    var bs=psBlocks(o);
    if (!bs.length) return;
    var p=mkPreset(o.name||o.title||o.preset_name||o.presetName||base, bs);
    if (o.mode==="replace") p.mode="replace";
    p.temp = psTemp(o.temperature!==undefined ? o.temperature : o.temp);
    p.topP = psTop(o.top_p!==undefined ? o.top_p : o.topP);
    p.maxTokens = psNum(o.max_tokens!==undefined ? o.max_tokens
                    : (o.openai_max_tokens!==undefined ? o.openai_max_tokens
                    : (o.maxResponse!==undefined ? o.maxResponse : o.maxTokens)));
    out.push(p);
  });
  return out;
}
function presetById(id){
  for (var i=0;i<presets.length;i++) if (presets[i].id===id) return presets[i];
  return null;
}
/* 이 캐릭터에 실제로 걸리는 프리셋 */
function presetOf(c){
  var sel = c ? (c.preset||"") : "";
  if (sel==="none") return null;
  if (sel) return presetById(sel) || (cfg.preset ? presetById(cfg.preset) : null);
  return cfg.preset ? presetById(cfg.preset) : null;
}
/* 제미나이 추론 예산. 중계 서버가 그대로 넘겨줘야 먹힌다 */
var THINK_BUDGET = { off:0, low:512, mid:2048, high:8192 };
function applyThink(body, isGemini){
  var k = cfg.think || "auto";
  if (k === "auto") return body;
  var n = THINK_BUDGET[k];
  if (n === undefined) return body;
  if (isGemini){
    body.generationConfig = body.generationConfig || {};
    body.generationConfig.thinkingConfig = { thinkingBudget: n };
  } else {
    body.reasoning_effort = (k==="off") ? "none" : (k==="mid" ? "medium" : k);
    body.extra_body = body.extra_body || {};
    body.extra_body.google = { thinking_config: { thinking_budget: n } };
  }
  return body;
}

    btn.disabled=true; out.textContent="확인하는 중…";
    var t0=Date.now(), url, headers, body;
    var sys="한 문장으로만 답한다.";
    if (cfg.mode==="openai"){
      var b=(cfg.base||"").replace(/\/+$/,"");
      url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
      headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
      body={ model:cfg.model, max_tokens:300, messages:[{role:"system",content:sys},{role:"user",content:"연결 확인. '좋아'라고만 답해줘."}] };
    } else {

             generationConfig:{ maxOutputTokens:300 } };
    }
    fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body)})
    .then(function(res){ return res.text().then(function(txt){
      var ms=Date.now()-t0, d=null;
      try{ d=JSON.parse(txt); }catch(e){}
      if(!res.ok){
        var em=(d&&d.error&&(d.error.message||d.error))||txt.slice(0,200);
        throw new Error(res.status+" · "+em);
      }
      var o="";
      if (cfg.mode==="openai"){
        var ch=d&&d.choices&&d.choices[0];
        o=ch?((ch.message&&ch.message.content)||ch.text||""):"";
      } else {
        var cd=d&&d.candidates&&d.candidates[0];
        o=cd?((cd.content&&cd.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
      }
      o=(o||"").trim();
      out.textContent = o ? ("연결 성공 · "+ms+"ms · 응답: "+o.slice(0,60))
                          : ("응답은 왔는데 본문이 비었어 · "+ms+"ms · 모델 이름을 확인해봐");
    });})
    .catch(function(e){ out.textContent = "실패 · "+(e.message||"연결 안 됨"); })

    var same = prev===l.who;
    h += '<div class="msg'+(mine?" me":"")+'" data-sml="'+i+'">';
    if (!mine) h += avaHTML(same?"":pp.avatar,"👤", same?"ava sm hide":"ava sm").replace('class="ava','class="ava');

       + (!mine && !same ? '<div class="who">'+esc(pp.disp||pp.name||l.who)+'</div>' : "")
       + '<div class="bub">'+fmt(l.t||"")+'</div></div></div>';

  });

       }).join("")
     + '</div>';

    el.onclick=function(){ smWho=el.getAttribute("data-smw"); render(); };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-sml]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-sml");
      var v=prompt("고치기 · 비우면 삭제", sm.lines[i].t||"");
      if (v===null) return;
      if (!String(v).trim()) sm.lines.splice(i,1);
      else sm.lines[i].t=String(v);
      saveChars(); render();
    };
  });
  $("#smgo").onclick=function(){
    var v=($("#smtx").value||"").trim();

    sm.lines.push({ who:smWho, t:v });

  };

    if (!confirm((sm.name||"이 예시")+" 삭제할까?")) return;

  };

function newRoom(c){
  var rs=roomsOf(c);
  var gs=greetingsOf(c).filter(function(x){ return String(x||"").trim(); });
  var pick=0;
  if (gs.length>1){
    var q=prompt("어느 첫 마디로 시작할까\n"
      + gs.map(function(g,i){ return (i+1)+" "+String(g).replace(/\s+/g," ").slice(0,24); }).join("\n")
      + "\n0 아무거나", "1");
    if (q===null) return;
    var n=parseInt(q,10);
    if (n===0) pick=Math.floor(Math.random()*gs.length);
    else if (n>=1 && n<=gs.length) pick=n-1;
  }
  c.startG = gs.length ? gs[pick] : "";
  var d=new Date(), two=function(n){ return (n<10?"0":"")+n; };
  var nm = (d.getMonth()+1)+"월 "+d.getDate()+"일 "+two(d.getHours())+":"+two(d.getMinutes());
  rs.push({ id: uid(), name: nm, at: Date.now() });
  c.room = rs[rs.length-1].id;
  saveChars();
  go("chat", c.id);
}
function roomMenu(c, rid){
  var rs=roomsOf(c);
  if (c.room!==rid){
    var pick=prompt("1 이 방으로 가기 · 2 이름 바꾸기 · 3 복제 · 4 삭제", "1");
    if (!pick) return;
    pick=pick.trim();
    if (pick==="1"){ c.room=rid; saveChars(); return go("chat", c.id); }
    if (pick==="2") return renameRoom(c, rid);
    if (pick==="3") return copyRoom(c, rid);
    if (pick==="4") return delRoom(c, rid);
    return;
  }
  var p2=prompt("1 이름 바꾸기 · 2 복제 · 3 삭제", "1");
  if (!p2) return;
  p2=p2.trim();
  if (p2==="1") return renameRoom(c, rid);
  if (p2==="2") return copyRoom(c, rid);
  if (p2==="3") return delRoom(c, rid);
}
function renameRoom(c, rid){
  var rs=roomsOf(c), r=null;
  for (var i=0;i<rs.length;i++) if (rs[i].id===rid) r=rs[i];
  if (!r) return;
  var v=prompt("방 이름", r.name||"");
  if (v===null) return;
  r.name=String(v).slice(0,30) || r.name;
  saveChars(); render();
}
function copyRoom(c, rid){
  var rs=roomsOf(c), src=get(roomKey(c.id, rid), []), nid=uid();
  if (!put(roomKey(c.id, nid), src)){
    alert("저장 공간이 부족해. 안 쓰는 방이나 사진을 지우고 다시 해줘.");
    return;
  }
  rs.push({ id:nid, name:(roomName(c,rid)+" 복사본").slice(0,30), at:Date.now() });
  saveChars(); render();
}
function delRoom(c, rid){
  var rs=roomsOf(c);
  if (rs.length<=1){ alert("방이 하나뿐이야. 지우려면 초기화를 써."); return; }
  if (!confirm(roomName(c,rid)+" 방을 지울까? 그 안의 대화도 같이 사라져.")) return;
  try { localStorage.removeItem(roomKey(c.id, rid)); } catch(e){}
  c.rooms = rs.filter(function(r){ return r.id!==rid; });
  if (c.room===rid) c.room = c.rooms[0].id;
  saveChars(); render();
}

/* 카드 본문 — 한 줄씩 끊긴 걸 문단으로 잇고 별표는 기울임으로 */
function cardText(t){
  var out=esc(flow(stripJunk(t)));
  out=out.replace(/\*{1,3}([^*\n]+?)\*{1,3}/g,'<em>$1</em>');
  out=out.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
  return out;
}
/* 대화 안에 끼는 작은 문자 화면 — 문자탭과 같은 클래스를 쓴다 */
function smsMini(body, c){
  var me = (c.userName||"나").trim();
  var rows = String(body||"").split("\n").filter(function(l){ return l.trim(); }).map(function(l){
    var m = l.match(/^\s*([^:：]{1,20})[:：]\s*([\s\S]*)$/);
    var nm = m ? m[1].trim() : "";
    return { who: nm, t: m ? m[2].trim() : l.trim(), mine: !!(nm && nm===me) };
  });
  if (!rows.length) return "";
  var th = cfg.smsTheme || "기본";
  var avLast = (th==="imessage");
  var names = {};
  rows.forEach(function(r){ if(!r.mine && r.who) names[r.who]=1; });
  var dm = Object.keys(names).length <= 1 ? "1" : "0";

  var out = '<div class="smswrap mini" data-th="'+esc(th)+'" data-dm="'+dm+'">';
  var prev = null;
  rows.forEach(function(r, i){
    var next = rows[i+1];
    var same = prev === (r.mine ? "\u0001me" : r.who);
    var lastOfRun = !next || (next.mine!==r.mine) || (next.who!==r.who);
    var p = findPerson(c, r.who) || { name:r.who, disp:r.who, avatar:"👤" };
    var showAv = avLast ? lastOfRun : !same;
    out += '<div class="sm'+(r.mine?" r":"")+(same?"":" gap")+(lastOfRun?" last":"")+'">';
    if (!r.mine) out += avaHTML(showAv?p.avatar:"","🙂", showAv?"av":"av hide").replace('class="ava','class="av');
    out += '<div class="col">'
         + (!r.mine && !same ? '<div class="who2">'+esc(p.disp||p.name||r.who)+'</div>' : "")
         + '<div class="brow"><div class="b">'+cardText(r.t)+'</div></div></div></div>';
    prev = r.mine ? "\u0001me" : r.who;
  });
  return out + '</div>';
}
function todayLabel(){
  var d=new Date();
  return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일";
}
function cardHTML(kind, body, c){
  if (kind==="문자") return smsMini(body, c);
  if (kind==="인스타"){
    var acc="", cap="", like="", shot="", ic=[], imode=0;
    String(body||"").split("\n").forEach(function(L){
      var t=L.trim(); if(!t) return;
      var m;
      if (imode<2){
        if ((m=t.match(/^(?:계정|아이디|닉네임|작성자)\s*[:：]\s*(.*)$/))){ acc=m[1].trim(); return; }
        if ((m=t.match(/^(?:사진|이미지|그림)\s*[:：]\s*(.*)$/))){ shot=m[1].trim(); return; }
        if ((m=t.match(/^(?:좋아요|하트|likes?)\s*[:：]?\s*([\d,]+)/i))){ like=m[1]; return; }
        if ((m=t.match(/^(?:본문|캡션|글)\s*[:：]\s*(.*)$/))){ cap=m[1].trim(); return; }
      }
      if (/^(?:본문|캡션|글)\s*[:：]?\s*$/.test(t)){ imode=1; return; }
      if (/^(?:댓글|덧글|리플)\s*[:：]?\s*[\[(]?\s*\d*\s*[\])]?\s*(?:개)?\s*$/.test(t)){ imode=2; return; }
      if (imode===2){
        var re3=false, x=t.replace(/^[-•*\s]+/,"").trim();
        if (/^(?:[ㄴ└↳>»])\s*/.test(x)){ re3=true; x=x.replace(/^(?:[ㄴ└↳>»])\s*/,""); }
        if (/^@/.test(x)) re3=true;
        var mm3 = x.match(/^([^|｜:：]{1,30})\s*[|｜:：]\s*([\s\S]*?)(?:\s*[|｜]\s*([\d,]+))?$/);
        if (mm3) ic.push({ who:mm3[1].trim(), t:(mm3[2]||"").trim(), up:(mm3[3]||"").trim(), re:re3 });
        else ic.push({ who:"", t:x, up:"", re:re3 });
        return;
      }
      if (cap) cap += " " + t; else cap = t;
    });
    if (!acc) acc = (c && c.name) ? String(c.name).replace(/\s+/g,"").toLowerCase() : "user";
    function tagify(x){ return esc(x).replace(/(#[^\s#]+)/g,'<span class="itag">$1</span>'); }
    var oi = '<div class="insta">'
      + '<div class="ihd"><div class="iav">'+esc(acc.charAt(0).toUpperCase())+'</div>'
      + '<div class="iid">'+esc(acc)+'</div></div>'
      + '<div class="iph">'+(shot ? esc(shot) : "사진")+'</div>'
      + '<div class="ibd">'
      + (like ? '<div class="ilk">좋아요 '+esc(like)+'개</div>' : "")
      + (cap ? '<div class="icap"><b>'+esc(acc)+'</b>'+tagify(cap)+'</div>' : "");
    if (ic.length){
      oi += '<div class="ihead">댓글 '+ic.length+'개</div>';
      ic.forEach(function(x){
        oi += '<div class="irow'+(x.re?" re":"")+'"><b>'+esc(x.who||"익명")+'</b>'
            + '<span>'+tagify(x.t||"")+'</span>'
            + (x.up ? '<span class="ilike">♥ '+esc(x.up)+'</span>' : "")
            + '</div>';
      });
    }
    return oi + '</div></div>';
  }
  if (kind==="공고"){
    var pub="", ntit="", rows=[], nem="", nft="", nbody=[], nmode=0;
    String(body||"").split("\n").forEach(function(L){
      var t=L.trim().replace(/^[-•*]\s*/,""); if(!t) return;
      var m;
      if ((m=t.match(/^(?:발행|발행처|기관|주최|출처)\s*[:：]\s*(.*)$/))){ pub=m[1].trim(); return; }
      if ((m=t.match(/^제목\s*[:：]\s*(.*)$/))){ ntit=m[1].trim(); return; }
      if ((m=t.match(/^(?:강조|사례금|현상금|보상)\s*[:：]\s*(.*)$/))){ nem=m[1].trim(); return; }
      if ((m=t.match(/^(?:꼬리말|안내|비고|연락처|문의)\s*[:：]\s*(.*)$/))){
        nft = nft ? nft+"\n"+m[1].trim() : m[1].trim(); return; }
      if ((m=t.match(/^항목\s*[:：]\s*([^|｜]+)[|｜]\s*([\s\S]*)$/))){
        rows.push({ k:m[1].trim(), v:m[2].trim() }); return; }
      if (/^본문\s*[:：]?\s*$/.test(t)){ nmode=1; return; }
      if (nmode===0 && (m=t.match(/^([^:：\n]{1,16})\s*[:：]\s*([\s\S]+)$/))){
        rows.push({ k:m[1].trim(), v:m[2].trim() }); return; }
      if (rows.length && !nmode){ rows[rows.length-1].v += "\n" + t; return; }
      nbody.push(t);
    });
    if (!ntit && !rows.length && !nbody.length) return "";
    /* 숫자+화폐단위+서술어가 줄바꿈으로 찢기지 않게 묶어준다 ("1억 / 원 지급" 방지) */
    function nbsp(s){
      return String(s)
        .replace(/([0-9０-９]|[억만천백조])\s+(원|만원|억원|달러|엔|위안)(?![가-힣])/g, "$1\u00A0$2")
        .replace(/(원|만원|억원|달러|엔|위안)\s+(지급|지원|제공|수여|보상|포상)/g, "$1\u00A0$2")
        .replace(/([0-9０-９])\s+(명|건|개|회|시간|일|년|개월|주)(?![가-힣])/g, "$1\u00A0$2");
    }
    var on = '<div class="notice">';
    if (pub)  on += '<div class="npub">'+esc(pub)+'</div>';
    if (ntit) on += '<div class="ntit">'+esc(nbsp(ntit))+'</div>';
    if (rows.length){
      on += '<div class="nrows">';
      rows.forEach(function(r){
        on += '<div class="nrow"><div class="nk">'+esc(r.k)+'</div>'
            + '<div class="nv">'+esc(r.v)+'</div></div>';
      });
      on += '</div>';
    }
    if (nbody.length) on += '<div class="nbody">'+esc(nbody.join("\n"))+'</div>';
    if (nem) on += '<div class="nem">'+esc(nbsp(nem))+'</div>';
    if (nft) on += '<div class="nft">'+esc(nbsp(nft))+'</div>';
    return on + '</div>';
  }
  if (kind==="커뮤"){
    var site="", tag="", ttl="", body2=[], cm=[], mode=0;
    var meta={ who:"", when:"", hit:"", cmt:"", up:"" }, infoRaw="";
    function setMeta(k,v){ if(v && !meta[k]) meta[k]=v; }
    /* 여러 라벨이 한 줄에 몰려 있으면 라벨 앞에서 줄을 끊는다 */
    var LAB = "사이트|커뮤|커뮤니티|말머리|게시판|갤러리|카테고리|분류|제목|정보|글쓴이|작성자|닉네임|아이디|작성일시|등록일시|작성시간|작성일|등록일|날짜|조회|조회수|추천|추천수|본문|내용|댓글|덧글|리플|답글";
    /* 라벨 쪼개기는 댓글 앞부분에만 쓴다. 댓글 안에서는 '작성자:' 가 닉네임일 수 있다 */
    var whole = String(body||"");
    var cutRe = /(?:^|\n|\s)(?:댓글|덧글|리플|답글)\s*[:：]?\s*[\[(]?\s*\d*\s*[\])]?\s*(?:개)?/;
    var cut = whole.search(cutRe);
    var head = cut < 0 ? whole : whole.slice(0, cut);
    var tail = cut < 0 ? ""    : whole.slice(cut);
    head = head.replace(new RegExp("(?!^)\\s*(?=(?:"+LAB+")\\s*[:：])","g"), "\n");
    tail = tail.replace(/^\s+/, "").replace(/\s+-\s+/g, "\n");
    var pre = head + (tail ? "\n" + tail : "");
    function clean(v){ return String(v||"").replace(/[\s|｜·,]+$/,"").trim(); }
    function oneComment(x){
      var t = String(x||"").replace(/^[-•*\s]+/,"").trim(), re = false;
      if (/^(?:[ㄴ└↳>»]|re\s*[:：])\s*/i.test(t)){ re = true; t = t.replace(/^(?:[ㄴ└↳>»]|re\s*[:：])\s*/i,""); }
      if (/^@/.test(t)) re = true;
      var m1 = t.match(/^([^|｜]{1,40})[|｜]\s*([\s\S]*?)(?:[|｜]\s*([+\-]?\d+))?$/);
      if (m1) return { who:clean(m1[1]), t:(m1[2]||"").trim(), up:(m1[3]||"").trim(), re:re };
      var m2 = t.match(/^([^:：\n]{1,24})\s*[:：]\s*([\s\S]+)$/);
      if (m2) return { who:clean(m2[1]), t:m2[2].trim(), up:"", re:re };
      var m3 = t.match(/^(\S{1,24}\([\d.]+\)|익명\s*\d*|ㅇㅇ)\s+([\s\S]+)$/);
      if (m3) return { who:m3[1].trim(), t:m3[2].trim(), up:"", re:re };
      return { who:"", t:t, up:"", re:re };
    }
    pre.split("\n").forEach(function(L){
      var t=L.trim(); if(!t) return;
      t = t.replace(/^[-•*]\s*/,"");
      var m;
      if (mode<2){
        if ((m=t.match(/^(?:사이트|커뮤|커뮤니티)\s*[:：]\s*(.*)$/))){ site=clean(m[1]); return; }
        if ((m=t.match(/^(?:말머리|게시판|갤러리|카테고리|분류)\s*[:：]\s*(.*)$/))){ tag=clean(m[1]); return; }
        if ((m=t.match(/^제목\s*[:：]\s*(.*)$/))){ ttl=clean(m[1]); return; }
        if ((m=t.match(/^정보\s*[:：]\s*(.*)$/))){ infoRaw=clean(m[1]); return; }
        if ((m=t.match(/^(?:글쓴이|작성자|닉네임|아이디)\s*[:：]\s*(.*)$/))){ setMeta("who",clean(m[1])); return; }
        if ((m=t.match(/^(?:시간|작성일시|등록일시|작성시간|작성일|등록일|날짜)\s*[:：]\s*(.*)$/))){ setMeta("when",clean(m[1])); return; }
        if ((m=t.match(/^(?:조회|조회수)\s*[:：]?\s*([\d,]+)/))){ setMeta("hit","조회 "+m[1]); return; }
        if ((m=t.match(/^(?:추천|추천수)\s*[:：]?\s*([+\-]?[\d,]+)/))){ setMeta("up","추천 "+m[1]); return; }
      }
      if (/^(?:본문|내용)\s*[:：]?\s*$/.test(t)){ mode=1; return; }
      var mc = t.match(/^(?:댓글|덧글|리플|답글)\s*[:：]?\s*[\[(]?\s*\d*\s*[\])]?\s*(?:개)?\s*(.*)$/);
      if (mc){
        mode = 2;
        if (!mc[1].trim()) return;
        mc[1].split(/\s+-\s+|\n/).forEach(function(one){
          var o = one.trim(); if(!o) return;
          cm.push(oneComment(o));
        });
        return;
      }
      if (mode===2){
        cm.push(oneComment(t));
        return;
      }
      body2.push(t);
    });
    /* 제목이 안 떨어졌으면 본문 첫 줄에서 건져낸다 */
    if (!ttl && body2.length){
      var b0 = body2[0].match(/^제목\s*[:：]\s*(.*)$/);
      if (b0){ ttl=b0[1].trim(); body2.shift(); }
    }
    if (!tag && /[>›»]/.test(site)){
      var sp = site.split(/\s*[>›»]\s*/);
      site = sp[0].trim(); tag = (sp[1]||"").trim();
    }
    var sKey = /디시|dc|갤러리/i.test(site) ? "디시"
             : /에타|에브리|everytime|대나무/i.test(site) ? "에타"
             : /카페|cafe|다음|네이버/i.test(site) ? "카페" : "기타";
    var info = infoRaw;
    if (!info){
      var bits=[];
      if (!meta.who) meta.who = sKey==="디시" ? "ㅇㅇ(118.235)" : (sKey==="기타" ? "" : "익명");
      if (meta.who) bits.push(meta.who);
      bits.push(meta.when || "방금 전");
      if (meta.hit) bits.push(meta.hit);
      if (meta.up) bits.push(meta.up);
      if (cm.length) bits.push("댓글 "+cm.length);
      info = bits.join(" · ");
    }
    var out='<div class="comm" data-site="'+esc(sKey)+'">';
    if (site) out += '<div class="csite">'+esc(site)+'</div>';
    if (tag) out += '<div class="ctag">'+esc(tag)+'</div>';
    if (ttl) out += '<div class="ctit">'+esc(ttl)+'</div>';
    if (info) out += '<div class="cinfo">'+esc(info)+'</div>';
    if (body2.length) out += '<div class="cbody">'+cardText(body2.join("\n"))+'</div>';
    if (cm.length){
      out += '<div class="chead">댓글 '+cm.length+'</div>';
      cm.forEach(function(x){
        var tx = esc(x.t||"").replace(/^(@\S+)/,'<span class="cre">$1</span>');
        /* 추천수는 디시에만 */
        var upHTML = (sKey==="디시" && x.up)
          ? '<span class="cup'+(/^-/.test(x.up)?" dn":"")+'">'+esc(x.up).replace(/^-/,"")+'</span>' : "";
        out += '<div class="crow'+(x.re?" re":"")+'"><div class="cwho">'+esc(x.who||"익명")
             + upHTML
             + '</div><div class="ctx">'+tx+'</div></div>';
      });
    }
    return out+'</div>';
  }
  if (kind==="알림"){
    var nm = String(body||"").split("\n")[0].replace(/^[-•*\s]+/,"").trim() || "문자";
    return '<div class="ping" data-ping="'+esc(nm)+'"><span class="dot"></span>'
         + '<b>'+esc(nm)+'</b><span class="go">문자 보기</span></div>';
  }
  if (kind==="일기"){
    var dl = String(body||"").replace(/\r/g,"").split("\n");
    var dtxt = "", di = -1;
    for (var q=0; q<dl.length && q<4; q++){
      var L = dl[q].trim().replace(/^[\[(]|[\])]$/g,"").trim();
      if (!L) continue;
      if (/^날짜\s*[:：]/.test(L)){ dtxt = L.replace(/^날짜\s*[:：]\s*/,"").trim(); di=q; break; }
      if (/^\d{4}\s*[.\-년]/.test(L) || /^\d{1,2}\s*월\s*\d{1,2}\s*일/.test(L)){ dtxt = L; di=q; break; }
    }
    if (di>=0) dl.splice(di,1);
    var wd = "";
    var mw = dtxt.match(/([월화수목금토일])\s*요일/);
    if (mw){ wd = mw[0]; dtxt = dtxt.replace(/[,·\s(]*([월화수목금토일])\s*요일[)]*/,"").trim(); }
    if (!dtxt) dtxt = todayLabel();
    return '<div class="paper diary" style="font-family:'+handOf(c)+'"><div class="dhead"><span>'+esc(dtxt)+'</span>'
         + (wd?'<span class="wd">'+esc(wd)+'</span>':"")
         + '</div><div class="ruled">'+cardText(dl.join("\n"))+'</div></div>';
  }
  if (kind==="편지"){
    var ll = String(body||"").replace(/\r/g,"").split("\n");
    while (ll.length && !ll[0].trim()) ll.shift();
    while (ll.length && !ll[ll.length-1].trim()) ll.pop();
    var to = "", sign = "";
    if (ll.length && /(에게|께|보내)\s*[.,]?$/.test(ll[0].trim()) && ll[0].trim().length<=40){
      to = ll.shift().trim();
    }
    if (ll.length && ll[ll.length-1].trim().length<=40 && /(가|이|올림|드림|씀|로부터)\s*[.]?$/.test(ll[ll.length-1].trim())){
      sign = ll.pop().trim();
    }
    return '<div class="paper letter" style="font-family:'+handOf(c)+'"><div class="ruled">'
         + (to?'<div class="lto">'+esc(to)+'</div>':"")
         + '<div>'+cardText(ll.join("\n"))+'</div>'
         + (sign?'<span class="lsign">'+esc(sign)+'</span>':"")
         + '</div></div>';
  }
  if (kind==="속마음") return '<div class="mind">'+cardText(body)+'</div>';
  if (kind==="비밀")   return '<div class="mind secret"><div class="pt">비밀</div>'+cardText(body)+'</div>';
  if (kind==="관계" || kind==="상태" || kind==="소문"){
    var rows="";
    String(body||"").split("\n").forEach(function(L){
      L=L.replace(/^[-•*\s]+/,"").trim();
      if (!L) return;
      var mm=L.match(/^([^:：]{1,24})[:：]\s*(.*)$/);
      if (mm) rows += '<div class="row"><b>'+esc(mm[1].trim())+'</b><span>'+cardText(mm[2])+'</span></div>';
      else rows += '<div class="row full">'+cardText(L)+'</div>';
    });
    return '<div class="statc"><div class="pt">'+esc(kind)+'</div>'+rows+'</div>';
  }
  if (kind==="주문" || kind==="결제"){
    var rows2 = "", cnt2 = 0;
    body.split("\n").forEach(function(l){
      l = l.replace(/^[-•*\s]+/,"").trim();
      if (!l) return;
      var f = l.split(/\s*\|\s*/);
      if (f.length < 2) return;
      var nm = (f[0]||"").trim(), pr = (f[1]||"").trim(),
          sl = (f[2]||"").trim(), dt = (f[3]||"").trim(), st = (f[4]||"").trim();
      var sub = [sl, dt].filter(Boolean).join(" · ");
      var live = /배송중|배송 준비|출고|결제예정|예정|진행|구독중|이용중/.test(st);
      cnt2++;
      rows2 += '<div class="orow"><div class="omain">'
             + '<div class="onm">'+esc(nm)+'</div>'
             + (sub?'<div class="osub">'+esc(sub)+'</div>':"")
             + '</div><div class="oright">'
             + '<div class="opr">'+esc(pr)+'</div>'
             + (st?'<div class="ost'+(live?" on":"")+'">'+esc(st)+'</div>':"")
             + '</div></div>';
    });
    if (!rows2) return "";
    return '<div class="ord"><div class="ohd"><b>'
         + (kind==="결제" ? "결제 내역" : "주문 내역")
         + '</b><i>'+cnt2+'건</i></div>'+rows2+'</div>';
  }
  if (kind==="나레")   return '<div class="narr">'+cardText(body)+'</div>';
  if (kind==="플리"){
    var out = '<div class="pl">';
    body.split("\n").forEach(function(l){
      if (!l.trim()) return;
      var parts = l.replace(/^[-•*\d.\s]+/,"").split(/\s*::\s*/);
      var song = parts[0]||"", why = parts[1]||"";
      var sp = song.split(/\s+[-–—]\s+/);
      var title = sp[0]||song, artist = sp[1]||"";
      out += '<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(title+" "+artist)
           + '" target="_blank" rel="noreferrer"><div class="t">♪ '+esc(title)+'</div>'
           + (artist?'<div class="ar">'+esc(artist)+'</div>':"")
           + (why?'<div class="rs">'+esc(why)+'</div>':"")+'</a>';
    });
    return out+'</div>';
  }
  return "";
}

var KINDS = ["일기","편지","속마음","플리","나레","관계","상태","비밀","소문","커뮤","인스타","주문","결제"];
/* 이 카드들은 해당 명령어를 친 턴에만 카드로 그린다. 그냥 대화 중에 나오면 본문으로 흘린다 */
var CARD_ONLY = {
  "일기":["/일기"], "편지":["/편지"], "속마음":["/속마음"], "플리":["/플리"],
  "관계":["/관계","/관계도"], "상태":["/상태","/상태창"], "소문":["/소문"],
  "커뮤":["/커뮤반응","/커뮤니티","/커뮤"], "인스타":["/인스타","/인별","/insta"],  "주문":["/쇼핑","/주문","/주문내역"], "결제":["/결제","/결제내역"]
};
/* 이 답변 바로 앞에 유저가 친 명령어를 찾는다 */
function askedCmd(log, idx){
  for (var i=idx-1;i>=0;i--){
    if (log[i].r==="u"){
      if (log[i].ooc) return "/ooc";
      return cmdOf(log[i].t);
    }
  }
  return null;
}

function pieces(c, text){
  var names = [ (c.name||"").trim() ].concat(castOf(c).map(function(x){ return x.name.trim(); }))
                .filter(function(x){ return x; });
  var t = String(text||"");
  // '플리:' 처럼 머리말만 쓴 경우도 태그로 취급
  t = t.replace(new RegExp("^\\s*(" + KINDS.join("|") + ")\\s*[:：]\\s*$", "gm"), "[$1]");
  t = t.replace(new RegExp("^\\s*\\[\\s*(" + KINDS.join("|") + ")\\s*\\]\\s*$", "gm"), "[$1]");

  var lines = t.split("\n"), res = [], curKind = null, curWho = null, buf = [];
  function flush(){
    var body = buf.join("\n").trim();
    buf = [];
    if (!body) return;
    if (curKind) res.push({ card:curKind, text:body });
    else res.push({ who:curWho, text:body });
  }
  var openRe  = new RegExp("^\\s*\\[(" + KINDS.join("|") + ")\\]\\s*$");
  var closeRe = new RegExp("^\\s*\\[/\\s*(" + KINDS.join("|") + ")\\s*\\]\\s*$");

  for (var i=0;i<lines.length;i++){
    var L = lines[i], m;
    if ((m = L.match(openRe))){ flush(); curKind = m[1]; continue; }
    if (closeRe.test(L)){ flush(); curKind = null; continue; }
    m = L.match(/^\s*\[([^\]\n]{1,20})\]\s*(.*)$/);
    if (m && KINDS.indexOf(m[1].trim()) < 0){
      flush(); curKind = null; curWho = m[1].trim();
      if (m[2].trim()) buf.push(m[2]);
      continue;
    }
    buf.push(L);
  }
  flush();

  // 태그가 없어도 게시글처럼 생겼으면 커뮤 글로 알아본다
  function looksComm(b){
    var labs = ["사이트","커뮤니티","말머리","게시판","갤러리","제목","정보","글쓴이","작성자",
                "조회","조회수","추천","추천수","등록일","작성일시","등록일시","작성시간","작성일","본문","댓글"];
    var hit = 0, key = false;
    labs.forEach(function(w){
      if (new RegExp("(?:^|\\n|\\s)"+w+"\\s*[:：\\[(]").test(b)){
        hit++;
        if (w==="사이트"||w==="제목"||w==="말머리"||w==="게시판"||w==="갤러리"||w==="댓글") key = true;
      }
    });
    return key && hit >= 2;
  }
  res = res.map(function(seg){
    if (seg.card) return seg;
    var body = seg.text || "";
    if (!looksComm(body)) return seg;
    var site = seg.who || "";
    /* 첫 줄이 [게시판 이름] 이면 그걸 사이트로 쓴다. 길이 제한 없이 */
    if (!site){
      var mb = body.match(/^\s*\[([^\]\n]{1,60})\]\s*\n?/);
      if (mb){ site = mb[1].trim(); body = body.slice(mb[0].length); }
    }
    if (site && !/(?:^|\n)\s*사이트\s*[:：]/.test(body))
      body = "사이트: "+site+"\n"+body;
    return { card:"커뮤", text:body };
  });
  // 태그를 빼먹었어도 곡 목록처럼 생겼으면 플리로 본다
  var out = [];
  res.forEach(function(seg){
    if (seg.card){ out.push(seg); return; }
    var ls = seg.text.split("\n"), run = [], rest = [];
    function dumpRun(){
      if (run.length >= 2) out.push({ card:"플리", text:run.join("\n") });
      else Array.prototype.push.apply(rest, run);
      run = [];
    }
    ls.forEach(function(L){
      if (/::/.test(L) && /\S\s*[-–—]\s*\S/.test(L)) run.push(L);
      else { dumpRun(); rest.push(L); }
    });
    dumpRun();
    var r = rest.join("\n").trim();
    if (r) out.push({ who:seg.who, text:r });
  });
  return out;
}




/* 첫 마디를 @: 나레이션 / @이름: 말풍선 으로 나눠 담기 */
function greetingsOf(c){
  if (!isArr(c.greetings)) c.greetings = [];
  if (!c.greetings.length && String(c.greeting||"").trim())
    c.greetings = [ String(c.greeting) ];
  return c.greetings;
}
/* 인트로 글을 화자별 줄로 풀고, 다시 글로 묶는다 */
function introLines(c, txt){
  var out=[], cur=null;
  String(txt||"").split("\n").forEach(function(L){
    var m = L.match(/^\s*@\s*([^:：\n]*)\s*[:：]\s*([\s\S]*)$/);
    if (m){
      if (cur) out.push(cur);
      var tag=m[1].trim();
      var who = tag;
      if (/^(user|나|유저)$/i.test(tag)) who = udispOf(c);
      cur = { who: tag ? who : "", t: m[2] };
      return;
    }
    if (!cur) cur = { who:"", t:"" };
    cur.t += (cur.t ? "\n" : "") + L;
  });
  if (cur) out.push(cur);
  return out.filter(function(x){ return String(x.t||"").trim(); })
            .map(function(x){ return { who:x.who, t:String(x.t).trim() }; });
}
function introText(c, lines){
  var me = udispOf(c);
  return (lines||[]).map(function(l){
    var t=String(l.t||"").trim();
    if (!t) return "";
    if (!l.who) return "@: "+t;
    if (l.who===me || l.who===(c.userName||"")) return "@유저: "+t;
    return "@"+l.who+": "+t;
  }).filter(Boolean).join("\n");
}
function seedGreeting(c, txt){
  var names = [ (c.name||"").trim() ].concat(castOf(c).map(function(x){ return x.name.trim(); })).filter(Boolean);
  var uname = (c.userName||"").trim();
  var out=[], mode="bub", who=null, buf=[];

  function flush(){
    var t=buf.join("\n").trim(); buf=[];
    if (!t) return;
    if (mode==="narr"){ out.push({ r:"a", t:t, narr:true }); return; }
    if (mode==="user"){ out.push({ r:"u", t:t }); return; }
    if (who && names.length && who!==names[0]) out.push({ r:"a", t:"["+who+"]\n"+t });
    else out.push({ r:"a", t:t });
  }

  String(txt).split("\n").forEach(function(L){
    var m = L.match(/^\s*@\s*([^:：\n]*)\s*[:：]\s*([\s\S]*)$/);
    if (m){
      flush();
      var tag = m[1].trim();
      if (!tag){ mode="narr"; who=null; }
      else if (/^(user|나|유저)$/i.test(tag) || (uname && tag===uname)){ mode="user"; who=null; }
      else {
        mode="bub"; who=null;
        for (var i=0;i<names.length;i++){
          if (names[i]===tag || names[i].indexOf(tag)>=0 || tag.indexOf(names[i])>=0){ who=names[i]; break; }
        }
        if (!who) who = names[0] || null;
      }
      if (m[2].trim()) buf.push(m[2]);
      return;
    }
    var m2 = L.match(/^\s*말풍선\s*[:：]\s*([\s\S]*)$/);
    if (m2){ flush(); mode="bub"; who=null; if(m2[1].trim()) buf.push(m2[1]); return; }
    buf.push(L);
  });
  flush();
  if (!out.length) out.push({ r:"a", t:String(txt).trim() });
  return out;
}


/* 장면 전환 · 앞 이야기 요약해서 접기 */
function makeRecap(c, done){
  var log = getLog(c.id);
  var body = log.slice(-40).map(function(m){
    return (m.r==="u" ? (c.userName||"나") : (c.name||"상대")) + ": " + m.t;
  }).join("\n").slice(-9000);
  if (!body) return done();
  var sys = "너는 이야기를 정리하는 도우미다. 아래 상황극 기록을 6~10줄로 요약한다. "
          + "인물 사이에 무슨 일이 있었는지, 관계가 어떻게 변했는지, 아직 풀리지 않은 것이 무엇인지 담는다. "
          + "대사나 묘사를 옮기지 말고 사실만 담백하게 적는다.";
  var prev = recapOf(c) ? "이전 요약:\n"+recapOf(c)+"\n\n" : "";
  var url, headers, bd;
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    bd={ model:cfg.model, max_tokens:1200, messages:[{role:"system",content:sys},{role:"user",content:prev+body}] };
  } else {
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    bd={ systemInstruction:{parts:[{text:sys}]}, contents:[{role:"user",parts:[{text:prev+body}]}],
         generationConfig:{ maxOutputTokens:1200 } };
  }
  fetch(url,{method:"POST",headers:headers,body:JSON.stringify(bd)})
  .then(function(r){ return r.text(); })
  .then(function(txt){
    var d=null; try{ d=JSON.parse(txt); }catch(e){}
    var out="";
    if (cfg.mode==="openai"){
      var ch=d&&d.choices&&d.choices[0];
      out=ch?((ch.message&&ch.message.content)||""):"";
    } else {
      var cd=d&&d.candidates&&d.candidates[0];
      out=cd?((cd.content&&cd.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
    }
    if (out.trim()) setRecap(c, out.trim());
    done();
  })
  .catch(function(){ done(); });
}

function parseLoreBulk(raw){
  var blocks = String(raw||"").replace(/\r/g,"").split(/\n\s*\n/);
  var out = [];
  blocks.forEach(function(b){
    var t="", k="", body=[], mode=null;
    b.split("\n").forEach(function(L){
      var m;
      if ((m = L.match(/^\s*제목\s*[:：]\s*(.*)$/))){ t=m[1].trim(); mode="t"; return; }
      if ((m = L.match(/^\s*키워드\s*[:：]\s*(.*)$/))){ k=m[1].trim(); mode="k"; return; }
      if ((m = L.match(/^\s*내용\s*[:：]\s*(.*)$/))){ if(m[1].trim()) body.push(m[1]); mode="c"; return; }
      if (!t && !k && (m = L.match(/^\s*([^|\n]{1,30})\|\s*(.*)$/))){ t=m[1].trim(); k=m[2].trim(); mode="c"; return; }
      if (mode==="c" || mode===null) body.push(L);
      else if (mode==="k" && L.trim()) k += ", "+L.trim();
      else if (mode==="t" && L.trim()) body.push(L);
    });
    var text = body.join("\n").trim();
    if (!text && !k) return;
    out.push({ title:t, keys:k, text:text, always:false });
  });
  return out;
}

/* 지금 대화에 걸리는 항목만 골라오기 */
function pickLore(c){
  var items = allLore(c);
  if (!items.length) return [];
  var log = getLog(c.id).slice(-4).map(function(m){ return m.t; }).join(" ");
  var out = [], rest = [];
  items.forEach(function(it){
    if (!it.text) return;
    if (it.always){ out.push(it); return; }
    var kk = (it.keys||"")
      .replace(/\{\{\s*user\s*\}\}/gi, c.userName||"")
      .replace(/\{\{\s*char\s*\}\}/gi, c.name||"");
    var keys = kk.split(/[,，]/).map(function(x){ return x.trim(); }).filter(Boolean);
    for (var i=0;i<keys.length;i++){
      if (log.indexOf(keys[i]) >= 0){ rest.push(it); return; }
    }
  });
  return out.concat(rest).slice(0,5);
}

  var arr = [{ key:"user", name:c.userName||"나", disp:udispOf(c), avatar:c.userAvatar }];

function personByName(c, nm){
  var ps = peopleOf(c), n=(nm||"").trim();
  for (var i=0;i<ps.length;i++){
    var p=ps[i];
    if (p.name.trim()===n || p.disp.trim()===n) return p;
  }
  for (var j=0;j<ps.length;j++){
    var q=ps[j];
    if (n && (q.name.indexOf(n)>=0 || n.indexOf(q.name)>=0)) return q;
  }
  return { key:"etc", name:n, disp:n, avatar:"" };
}

function parseSms(c, text){
  var t = text.trim();
  return null;
  var ats = t.match(/@[^\s@]+/g);
  if (!ats || ats.length < 2) return { pick:true };
  var names = ats.map(function(a){ return a.slice(1); });
  return { names:names };
}

function makeThread(c, names){
  var parts = [], random = false;
  names.forEach(function(n){
    if (n==="랜덤"){ random = true; return; }
    parts.push(isUserName(c,n) ? personByName(c, c.userName||"나") : personByName(c,n));
  });
  if (!parts.length) return null;
  var peek = true;
  parts.forEach(function(p){ if (p.key==="user") peek=false; });
  var t = {
    id: uid(),
    from: parts[0].name,
    parts: parts,
    random: random,
    peek: peek,
    log: []
  };
  t.title = random ? (parts[0].disp + " → ?")
          : parts.map(function(p){ return p.disp; }).join(", ");
  saveThread(c, t);
  smsCur = t.id;
  go("sms", c.id);
  return t;
}

    h += '<div class="col">'

       + '</div></div>';
    prev = m.who;
  });

  if (thinking) h += '<div class="hint" style="padding:8px 4px">쓰는 중…</div>';

  if (!t.log.length && !thinking && !err)

  h += '</div>';

  $("#smsx").onclick=function(){ go("smslist", c.id); };
  $("#smscog").onclick=function(){

                   String(ths.indexOf(cfg.smsTheme||"기본")+1));

    }
    if (v==="4"){
      var fs=["테마 따라가기"].concat(Object.keys(FONTS));
      var q2=prompt(fs.map(function(x,i){ return (i+1)+" "+x; }).join("\n"),
                    String(Math.max(0,fs.indexOf(cfg.fSms||"테마 따라가기"))+1));

  var smsAddPerson=function(){

    var left=ps.filter(function(x){ return !have[x.name]; });

    var v=prompt("이 방에 넣을 사람\n"+(menu||"설정에 있는 사람은 다 들어와 있어.")+"\n\n번호를 넣거나 이름을 직접 적어줘.", "");
    if (v===null) return;
    v=String(v).trim(); if(!v) return;
    var pick=null, n=parseInt(v,10);
    if (n>=1 && n<=left.length) pick=left[n-1];
    else pick=personByName(c, v);

    if (have[pick.name]) return alert("이미 들어와 있어.");
    t.parts.push(pick);

  };
  var smsSetTime=function(){
    var base = t.start || Date.now(), d = new Date(base);
    var curv = d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate())+" "+two(d.getHours())+":"+two(d.getMinutes());
    var v = prompt("몇 시로 할까\n(예: 2003-05-17 18:30)", curv);
    if (v===null) return;
    var mm = String(v).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T]+(\d{1,2}):(\d{2})$/);
    if (!mm) return alert("형식이 안 맞아. 2003-05-17 18:30 처럼 적어줘.");
    var ns = new Date(+mm[1], +mm[2]-1, +mm[3], +mm[4], +mm[5]).getTime();
    var how = t.log.length
      ? prompt("1 여기서부터 이 시각으로 (앞엣것은 그대로)\n2 방 전체를 이 시각으로 옮기기", "1")
      : "2";
    if (how===null) return;
    how = String(how).trim();
    if (how==="2"){
      var diff = ns - (t.start || base);
      t.start = ns;
      t.log.forEach(function(x){ if (x.at) x.at += diff; });
    } else {
      t.jump = ns;                 /* 다음 메시지부터 여기서 시작 */
      if (!t.log.length) t.start = ns;
    }
    saveThread(c, t); paintSms();
  };
  if ($("#smsmore")) $("#smsmore").onclick=function(){ smsTurn(); };
  Array.prototype.forEach.call(view.querySelectorAll("[data-si]"), function(el){
    bindHold(el, function(){

      smsSel = (smsSel===i) ? -1 : i;
