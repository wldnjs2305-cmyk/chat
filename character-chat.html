<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" id="tc" content="#FFFFFF">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>캐릭터 대화</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiB2aWV3Qm94PSIwIDAgMTgwIDE4MCI+CjxyZWN0IHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiByeD0iNDAiIGZpbGw9IiNGM0VGRkEiLz4KPHRleHQgeD0iOTAiIHk9IjkyIiBmb250LXNpemU9IjEwNCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9ImNlbnRyYWwiPiYjMTI4MTQwOzwvdGV4dD4KPC9zdmc+">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiB2aWV3Qm94PSIwIDAgMTgwIDE4MCI+CjxyZWN0IHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiByeD0iNDAiIGZpbGw9IiNGM0VGRkEiLz4KPHRleHQgeD0iOTAiIHk9IjkyIiBmb250LXNpemU9IjEwNCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9ImNlbnRyYWwiPiYjMTI4MTQwOzwvdGV4dD4KPC9zdmc+">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@400;600&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Gowun+Dodum&family=Gowun+Batang&family=Song+Myung&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Gaegu&family=Hi+Melody&family=Black+Han+Sans&display=swap">
<style>
  @font-face{font-family:"RIDIBatang";font-display:swap;
    src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/RIDIBatang.woff") format("woff")}
  @import url('https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap');
  @font-face{font-family:"MaruBuri";font-display:swap;
    src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/MaruBuri-Regular.woff") format("woff")}
  :root{
    color-scheme:light;
    --bg:#FFFFFF; --panel:#FFFFFF; --field:#F4F3F7; --line:#E7E5EC;
    --text:#191820; --muted:#8B8896; --bub:#EFEEF2; --mine:#E3DFF6;
    --nar:#8A8796; --accent:#6F5FC4; --trc:#4C4857;
    --paper:#FAF6EE; --paper-line:#E8DFCC; --paper-text:#3A342C;
  }
  body.dark{
    color-scheme:dark;
    --bg:#0C0C11; --panel:#131318; --field:#1C1C23; --line:#292932;
    --text:#F2F1F6; --muted:#8B8896; --bub:#292930; --mine:#3F3AA8;
    --nar:#9B98A6; --accent:#8B84F0; --trc:#CAC7DA;
    --paper:#1A1A22; --paper-line:#2E2E3A; --paper-text:#DEDCE6;
  }
  body.dark .msg.me .bub{color:#F5F4FA}
  body.dark .sm.r .b{color:#F5F4FA}

  /* 밝은 테마들 */
  body[data-theme=paper]{
    --bg:#FAF6EE; --panel:#FAF6EE; --field:#F1EADC; --line:#E4DAC7;
    --text:#33302A; --muted:#8C8374; --bub:#F2EBDC; --mine:#E9DEC6;
    --nar:#8A8271; --accent:#9A7B4F; --trc:#5C5445;
    --paper:#F5EFE2; --paper-line:#E4DAC7; --paper-text:#33302A;
  }
  body[data-theme=mono]{
    --bg:#FFFFFF; --panel:#FFFFFF; --field:#F3F3F5; --line:#E6E6E9;
    --text:#1A1A1C; --muted:#8A8A91; --bub:#F0F0F3; --mine:#DFDFE4;
    --nar:#86868D; --accent:#45454B; --trc:#5A5A61;
    --paper:#F8F8FA; --paper-line:#E6E6E9; --paper-text:#1A1A1C;
  }
  body[data-theme=pink]{
    --bg:#FDF4F3; --panel:#FDF4F3; --field:#F8E8E7; --line:#F1DCDB;
    --text:#38292C; --muted:#A28A8E; --bub:#F9EBEA; --mine:#F4D4DB;
    --nar:#9C8489; --accent:#B0627A; --trc:#6B4E55;
    --paper:#FBF1EC; --paper-line:#EEDCD5; --paper-text:#38292C;
  }
  /* 어두운 테마들 — body.dark 뒤에 와야 덮어쓴다 */
  body[data-theme=night]{
    --bg:#12141C; --panel:#171A24; --field:#1E222E; --line:#2A2F3D;
    --text:#E9EBF2; --muted:#858C9E; --bub:#242938; --mine:#33407A;
    --nar:#949BAD; --accent:#7C93E8; --trc:#C2C8DA;
    --paper:#1B1F2A; --paper-line:#2E3444; --paper-text:#DDE1EC;
  }
  body[data-theme=cocoa]{
    --bg:#1A1715; --panel:#211D1A; --field:#2A2521; --line:#37302B;
    --text:#F0EAE3; --muted:#9A8E83; --bub:#2E2823; --mine:#5A4436;
    --nar:#A2968A; --accent:#C79B6E; --trc:#D6CCC0;
    --paper:#241F1B; --paper-line:#3A322C; --paper-text:#E7E0D7;
  }
  body[data-theme=plum]{
    --bg:#15121E; --panel:#1C1828; --field:#241F33; --line:#322B45;
    --text:#F0ECF7; --muted:#948AA8; --bub:#2A2440; --mine:#4A3C8C;
    --nar:#9E93B4; --accent:#A78BF0; --trc:#CFC7E2;
    --paper:#1F1A2C; --paper-line:#352E4A; --paper-text:#E8E3F2;
  }

  /* 문서 모드 — 말풍선 없이 소설처럼 */
  body[data-view=doc] .msg{display:block;margin-bottom:22px}
  body[data-view=doc] .msg .ava{display:none}
  body[data-view=doc] .msg .col,
  body[data-view=doc] .msg.me .col{max-width:100%}
  body[data-view=doc] .msg .who{display:none}
  body[data-view=doc] .bub{background:transparent;padding:0;border-radius:0;line-height:1.95}
  body[data-view=doc] .msg.me .bub{background:transparent;
    border-left:2px solid var(--accent);padding-left:12px;opacity:.92}
  .dturn{margin-bottom:22px}
  .dnar,.dsay{white-space:pre-wrap;word-break:break-word;margin:0 0 11px}
  .dnar{font-family:var(--f-nar);font-style:italic;font-weight:300;color:var(--nar);
    font-size:calc(var(--fs) - 0.5px);line-height:1.95}
  .dsay{font-family:var(--f-body);font-size:var(--fs);line-height:1.9;letter-spacing:-.004em}
  .dsay b{font-weight:600}
  .dsay b::after{content:" │ ";color:var(--muted);font-weight:400}
  .dturn > :last-child{margin-bottom:0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:16px;line-height:1.6;overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100dvh}
  #bar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  #bar .ttl{flex:1;min-width:0;text-align:center}
  #bar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{flex:0 0 auto;min-width:50px;border:0;background:transparent;color:var(--accent);font-size:15px;font-family:inherit;padding:8px 4px;cursor:pointer}
  .iconbtn:nth-of-type(2){text-align:right}
  .iconbtn:active{opacity:.5}
  #view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(env(safe-area-inset-bottom) + 24px)}
  #view.chat{padding:18px 14px 8px}

  .card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .card:active{background:var(--field)}
  .ava{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
  .ava.sm{width:32px;height:32px;font-size:16px}
  .ava.lg{width:62px;height:62px;font-size:28px}
  .ava.xs{width:26px;height:26px;font-size:13px}
  .ava img{width:100%;height:100%;object-fit:cover}
  .card .meta{flex:1;min-width:0}
  .card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .ds{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--muted);text-align:center;padding:56px 20px;font-size:14px;line-height:1.9}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;
    background:transparent;touch-action:none}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-11px;
    border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.22)}
  .btn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer;margin-top:10px}
  .btn:active{background:var(--field)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.danger{color:#D06060}
  .btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0}
  label{display:block;margin:18px 0 6px;font-size:13px;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:16px;font-family:inherit;line-height:1.6}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:90px}
  .sec{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--accent);font-weight:600}
  .sec.first{margin-top:0;padding-top:0;border-top:0}
  .pick{display:flex;align-items:center;gap:12px;margin-top:4px}
  .pick .btns{display:flex;gap:8px;flex-wrap:wrap}
  .castbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}

  /* 대화 */
  .msg{margin-bottom:20px;display:flex;gap:9px;align-items:flex-start}
  .msg.me{justify-content:flex-end}
  .msg .col{min-width:0;max-width:var(--bw,84%)}
  .msg.me .col{max-width:calc(var(--bw,84%) - 6%)}
  .who{font-size:13.5px;font-weight:600;margin:2px 0 6px 2px}
  .bub{padding:13px 16px;border-radius:18px;background:var(--bub);white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:var(--fs);line-height:1.85;letter-spacing:-.004em;cursor:pointer}
  .msg.me .bub{background:var(--mine)}
  .bub em{font-family:var(--f-nar);font-style:italic;font-weight:300;color:var(--nar);font-size:calc(var(--fs) - 0.5px);line-height:1.9}
  .bub .tr{color:var(--trc);font-size:calc(var(--fs) - 1.5px)}
  .narr{margin:4px 0 20px;padding:10px 14px;text-align:center;color:var(--nar);
    font-family:var(--f-nar);font-style:italic;font-weight:300;
    font-size:calc(var(--fs) - 0.5px);line-height:1.8;white-space:pre-wrap;word-break:break-word;cursor:pointer}
  .ooc{margin:0 0 18px;padding:9px 13px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:14px;white-space:pre-wrap}
  .altbar{display:flex;align-items:center;justify-content:flex-start;gap:6px;
    margin:-12px 0 16px 41px;color:var(--muted);font-size:12px}
  .altbar button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-size:14px;line-height:1;padding:5px 11px;border-radius:12px;cursor:pointer}
  .altbar button:active{background:var(--field)}
  .altbar span{padding:0 2px;min-width:34px;text-align:center}
  .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .acts button{background:var(--field);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer}
  .acts button.del{color:#D06060}
  .editbox{width:100%;min-height:120px;margin-top:4px}
  .thinking{color:var(--muted);font-size:14px;padding:2px 2px 20px 50px}
  .err{background:#FBE9EF;border:1px solid #EFC3D2;color:#8A3552;padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:18px;white-space:pre-wrap}
  body.dark .err{background:#3A2230;border-color:#6B3348;color:#F0C4D0}

  /* 특수 카드 */
  .phone{background:var(--field);border-radius:20px;padding:12px;margin:10px 0}
  .phone .ph{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:10px;font-weight:600;font-size:14px}
  .phone .pm{background:var(--panel);border-radius:14px;padding:9px 13px;margin-bottom:7px;max-width:86%;
    font-family:var(--f-sms, var(--f-body));font-size:var(--sfs,15px);line-height:1.6}
  .phone .pm.me{background:var(--mine);margin-left:auto}
  .paper{background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;padding:18px 18px 20px;margin:10px 0;font-family:"Noto Serif KR",serif;font-weight:300;color:var(--paper-text);line-height:2;font-size:15.5px;white-space:pre-wrap}
  .paper .pt{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;font-family:inherit}
  .mind{border-left:3px solid var(--accent);background:var(--field);border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0;font-family:"Noto Serif KR",serif;font-style:italic;font-weight:300;color:var(--nar);line-height:1.95;font-size:15px;white-space:pre-wrap}
  .pl{background:var(--field);border-radius:16px;padding:6px 4px;margin:10px 0}
  .pl a{display:block;padding:10px 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
  .pl a:last-child{border-bottom:0}
  .pl .t{font-size:15px;font-weight:600}
  .pl .ar{font-size:13px;color:var(--muted)}
  .pl .rs{font-size:12.5px;color:var(--nar);margin-top:3px;font-style:italic}

  /* 사진 편집기 */
  #cropwrap{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.72);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:20px;-webkit-backdrop-filter:blur(6px)}
  #cropbox{width:280px;height:280px;border-radius:50%;overflow:hidden;position:relative;background:#000;
    box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
  #cropbox img{position:absolute;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
  #cropwrap .ctl{width:280px;display:flex;flex-direction:column;gap:10px}
  #cropwrap input[type=range]{width:100%;padding:0}
  #cropwrap .row{display:flex;gap:8px}
  #cropwrap .row button{flex:1;padding:13px;border-radius:12px;border:0;font-family:inherit;font-size:15px;cursor:pointer}
  #cropwrap .ok{background:var(--accent);color:#fff;font-weight:600}
  #cropwrap .no{background:rgba(255,255,255,.16);color:#fff}
  #cropwrap .tip{color:#fff;opacity:.75;font-size:13px;text-align:center}

  /* 문자 화면 */
  .smswrap{margin:-18px -14px 0;min-height:100%;padding:0 0 10px;background:var(--sbg)}
  .smswrap{--sbg:var(--bg);--sother:var(--bub);--sotherink:var(--text);--smine:var(--mine);--smineink:var(--text);
    --sname:var(--muted);--stime:var(--muted);--sro:18px;--srm:18px;--stail:0;--savr:50%}
  .smswrap[data-th=kakao]{--sbg:#b2c7d9;--sother:#fff;--sotherink:#111;--smine:#fae100;--smineink:#1a1a1a;
    --sname:#43535f;--stime:#5a6d7c;--sro:2px 16px 16px 16px;--srm:16px 2px 16px 16px;--stail:1;--savr:16px}
  .smswrap[data-th=imessage]{--sbg:#fff;--sother:#e9e9eb;--sotherink:#111;--smine:#0b84fe;--smineink:#fff;
    --sname:#84848b;--stime:#a2a2a8;--sro:19px;--srm:19px;--stail:0;--savr:50%}
  .smswrap[data-th=retro]{--sbg:#d3dbe3;--sother:#c5d1b8;--sotherink:#2b3a1f;
    --smine:#cdd6c0;--smineink:#22301a;--sname:#3a4a5c;--stime:#5d6b7c;
    --sday:rgba(30,40,60,.16);--sdayink:#1d2c88;--savr:3px;--sro:2px;--srm:2px;--srb:2px}
  body.dark .smswrap[data-th=retro]{--sbg:#2a2f36;--sother:#8fa07e;--sotherink:#141c0e;
    --smine:#9aa98a;--smineink:#141c0e;--sname:#aab6c4;--stime:#8b96a4}
  .smswrap[data-th=retro] .sm .b{
    font-family:var(--f-sms,"DungGeunMo","돋움",Dotum,sans-serif);letter-spacing:.5px;line-height:1.65;
    border:2px solid #9ba5b5;box-shadow:inset 1px 1px 4px rgba(0,0,0,.18);
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0px,rgba(0,0,0,.045) 1px,transparent 1px,transparent 2px)}
  .smswrap[data-th=retro] .smsbar{
    font-family:"DungGeunMo","돋움",Dotum,sans-serif;
    background:linear-gradient(to bottom,#7a9aef 0%,#5480d5 15%,#1d2c88 100%);
    color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.7);border-bottom:1px solid #0f184b}
  .smswrap[data-th=retro] .smsbar .nm,
  .smswrap[data-th=retro] .smsbar .sub,
  .smswrap[data-th=retro] .smsbar button{color:#fff}
  .smswrap[data-th=retro] .who2,
  .smswrap[data-th=retro] .stime,
  .smswrap[data-th=retro] .sday i{font-family:"DungGeunMo","돋움",Dotum,sans-serif}
  .smswrap[data-th=retro] .sm .av{border:1px solid #1d2c88;filter:grayscale(30%) contrast(1.1) saturate(.8)}
  .smswrap[data-th=line]{--sbg:#8cabd8;--sother:#fff;--sotherink:#111;--smine:#06c755;--smineink:#111;
    --sname:#28404f;--stime:#4a6274;--sro:2px 16px 16px 16px;--srm:16px 2px 16px 16px;--stail:1;--savr:50%}
  body.dark .smswrap[data-th=kakao]{--sbg:#1b1b1f;--sother:#2c2c34;--sotherink:#ececf0;--sname:#9a9aa5}
  body.dark .smswrap[data-th=imessage]{--sbg:#000;--sother:#26262a;--sotherink:#fff;--sname:#8e8e93}
  body.dark .smswrap[data-th=line]{--sbg:#000;--sother:#2b2b2e;--sotherink:#e8e8ea;--smine:#7ee08a;--smineink:#0b0b0c;--sname:#8a8a90}

  .smsbar{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;
    border-bottom:1px solid rgba(128,128,128,.22);position:sticky;top:0;background:var(--sbg);z-index:2}
  .smsbar .nm{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .smsbar .sub{font-size:12px;color:var(--sname);font-weight:400}
  .smsbar button{border:0;background:transparent;color:var(--sname);font-size:15px;padding:4px 6px;cursor:pointer}
  .smsbody{padding:14px 12px 4px}
  .sm{display:flex;gap:7px;align-items:flex-start;margin-bottom:3px}
  .sm.gap{margin-top:12px}
  .sm.r{justify-content:flex-end}

})();
function put(k,v){
  var s = JSON.stringify(v);
  if (canStore) { try { localStorage.setItem(k,s); return true; } catch(e){ return false; } }
  mem[k]=s; return true;
}
function get(k,d){
  var s = null;
  if (canStore) { try { s = localStorage.getItem(k); } catch(e){} }
  if (s===null || s===undefined) s = mem[k];
  if (s===null || s===undefined) return d;

}

                          theme:"light", fBody:"프리텐다드", fNar:"본명조", fSize:16, smsTheme:"기본", preset:"", viewMode:"bubble", bubW:84, fSms:"테마 따라가기", sSize:15 });

  if (!isArr(c.rooms) || !c.rooms.length) c.rooms = [{ id:"main", name:"대화 1", at:Date.now() }];

var APP_VER = "2026-09-06 f";

/* ---------- 도구 ---------- */
var $ = function(s){ return document.querySelector(s); };
var view=$("#view"), dock=$("#dock");

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmt(s){
  var t = esc(s).replace(/\n{3,}/g,"\n\n").trim();
  t = t.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
  t = t.replace(/\*{1,3}([^*]+?)\*{1,3}/g,'<em>$1</em>');
  return t.replace(/\*/g,"");
}
/* 지문(별표 안)과 대사를 조각으로 나눈다 */
function docSegs(raw){
  var t=String(raw||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();
  var segs=[], re=/\*{1,3}([\s\S]+?)\*{1,3}/g, last=0, m;
  while ((m=re.exec(t))){
    if (m.index>last){ var pre=t.slice(last,m.index).trim(); if(pre) segs.push({nar:false,t:pre}); }
    var inner=m[1].trim(); if(inner) segs.push({nar:true,t:inner});
    last=re.lastIndex;
  }
  var tail=t.slice(last).trim(); if(tail) segs.push({nar:false,t:tail});
  if (!segs.length && t) segs.push({nar:false,t:t});
  return segs;
}
/* 한 줄씩 끊긴 걸 한 문단으로 이어 붙인다. 빈 줄은 문단 나눔으로 남긴다 */
function flow(s){
  return String(s||"").split(/\n{2,}/).map(function(par){
    return par.split("\n").map(function(l){ return l.trim(); }).filter(Boolean).join(" ");
  }).filter(Boolean).join("\n\n");
}
function fmtIn(s){
  var t=esc(flow(s));
  t=t.replace(/([(（][^)）\n]*[)）])/g,'<span class="tr">$1</span>');
  return t.replace(/\*/g,"");
}
function docHTML(nm, raw, i){
  var out="";
  docSegs(raw).forEach(function(sg){
    if (sg.nar) out += '<div class="dnar" data-i="'+i+'">'+fmtIn(sg.t)+'</div>';
    else out += '<div class="dsay" data-i="'+i+'"><b>'+esc(nm||"")+'</b>'+fmtIn(sg.t)+'</div>';
  });
  return out;
}
function avaHTML(v, fb, cls){
  var s=(v||"").trim(), k="ava"+(cls?" "+cls:"");
  if (/^(https?:|data:image)/i.test(s)) return '<div class="'+k+'"><img src="'+esc(s)+'" alt=""></div>';
  return '<div class="'+k+'">'+esc(s||fb)+"</div>";
}
function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function castOf(c){ return (c.cast||[]).filter(function(x){ return x && x.name; }); }
function dispOf(c){ return (c.display||"").trim() || c.name || "상대"; }
function udispOf(c){ return (c.userDisplay||"").trim() || c.userName || "나"; }
function findPerson(c, name){
  if (!name) return null;
  var n = name.trim();
  if (n === (c.name||"").trim()) return { name:c.name, avatar:c.avatar };
  var cs = castOf(c);
  for (var i=0;i<cs.length;i++) if (cs[i].name.trim()===n) return cs[i];
  return null;
}

function pickPhoto(done){
  var inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var M=640, w=img.width, h=img.height, r=Math.min(1, M/Math.max(w,h));
        var cv=document.createElement("canvas");
        cv.width=Math.round(w*r); cv.height=Math.round(h*r);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        inp.remove(); done(cv.toDataURL("image/jpeg",0.86));
      };
      img.onerror=function(){ inp.remove(); alert("이 사진은 못 읽었어."); };
      img.src = fr.result;
    };
    fr.onerror=function(){ inp.remove(); alert("사진을 불러오지 못했어."); };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* 확대, 위치 잡아서 동그랗게 자르기 */
function editPhoto(src, done){
  var S = 280;
  var wrap = document.createElement("div");
  wrap.id = "cropwrap";
  wrap.innerHTML = '<div class="tip">손가락으로 움직이고, 두 손가락으로 확대할 수 있어</div>'
    + '<div id="cropbox"><img id="cropimg" alt=""></div>'
    + '<div class="ctl"><input id="cropz" type="range" min="100" max="400" value="100">'
    + '<div class="row"><button class="no" id="cropno">취소</button>'
    + '<button class="ok" id="cropok">저장</button></div></div>';
  document.body.appendChild(wrap);

  var im = wrap.querySelector("#cropimg");
  var base=1, z=1, ox=0, oy=0, iw=0, ih=0;

  function clamp(){
    var dw=iw*base*z, dh=ih*base*z;
    if (ox > 0) ox = 0;
    if (oy > 0) oy = 0;
    if (ox < S-dw) ox = S-dw;
    if (oy < S-dh) oy = S-dh;
  }
  function draw(){
    clamp();
    im.style.width = (iw*base*z)+"px";
    im.style.height = (ih*base*z)+"px";
    im.style.left = ox+"px";
    im.style.top = oy+"px";
  }
  im.onload = function(){
    iw=im.naturalWidth; ih=im.naturalHeight;
    base = S/Math.min(iw,ih);
    z=1; ox=(S-iw*base)/2; oy=(S-ih*base)/2;
    im.style.position="absolute";
    draw();
  };
  im.src = src;

  var box = wrap.querySelector("#cropbox");
  var px=0, py=0, pd=0, pz=1, dragging=false;
  function dist(t){
    var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }
  box.addEventListener("touchstart", function(e){
    if (e.touches.length===1){ dragging=true; px=e.touches[0].clientX; py=e.touches[0].clientY; }
    else if (e.touches.length===2){ dragging=false; pd=dist(e.touches); pz=z; }
  }, {passive:true});
  box.addEventListener("touchmove", function(e){
    e.preventDefault();
    if (e.touches.length===1 && dragging){
      var x=e.touches[0].clientX, y=e.touches[0].clientY;
      ox += x-px; oy += y-py; px=x; py=y; draw();
    } else if (e.touches.length===2 && pd){
      var nz = Math.max(1, Math.min(4, pz * dist(e.touches)/pd));
      var cx=S/2, cy=S/2, k=nz/z;
      ox = cx - (cx-ox)*k; oy = cy - (cy-oy)*k;
      z = nz; wrap.querySelector("#cropz").value = Math.round(z*100); draw();
    }
  }, {passive:false});
  box.addEventListener("touchend", function(){ dragging=false; pd=0; }, {passive:true});
  box.addEventListener("mousedown", function(e){ dragging=true; px=e.clientX; py=e.clientY; });
  window.addEventListener("mousemove", function(e){
    if(!dragging) return;
    ox += e.clientX-px; oy += e.clientY-py; px=e.clientX; py=e.clientY; draw();
  });
  window.addEventListener("mouseup", function(){ dragging=false; });

  wrap.querySelector("#cropz").oninput = function(){
    var nz = Math.max(1, Math.min(4, this.value/100));
    var cx=S/2, cy=S/2, k=nz/z;
    ox = cx - (cx-ox)*k; oy = cy - (cy-oy)*k;
    z = nz; draw();
  };
  wrap.querySelector("#cropno").onclick = function(){ wrap.remove(); };
  wrap.querySelector("#cropok").onclick = function(){
    var out=200, cv=document.createElement("canvas");
    cv.width=out; cv.height=out;
    var sc = base*z, sx = -ox/sc, sy = -oy/sc, ss = S/sc;
    cv.getContext("2d").drawImage(im, sx, sy, ss, ss, 0, 0, out, out);
    wrap.remove();
    done(cv.toDataURL("image/jpeg",0.85));
  };
}


/* 꾹 누르기 */
function bindHold(el, fn){

  el.addEventListener("touchend", function(){ clearTimeout(tm); }, {passive:true});
  el.addEventListener("contextmenu", function(e){ e.preventDefault(); fn(); });
}

function isArr(v){ return Object.prototype.toString.call(v)==="[object Array]"; }
function psNum(v){
  if (v===undefined || v===null || v==="") return "";
  var n=parseFloat(v);
  return isFinite(n) ? String(n) : "";
}
/* 리수는 0.8을 80으로 저장한다 */
function psTemp(v){

}
function psTop(v){
  var n=parseFloat(v);
  if (!isFinite(n)) return "";
  if (n>1) n=n/100;
  return String(Math.round(n*100)/100);
}
function mkPreset(name,blocks){
  return { id:uid(), name:String(name||"새 프리셋").slice(0,40), mode:"add",
           blocks: blocks||[], text:"", temp:"", topP:"", maxTokens:"" };
}
/* 예전에 만든 프리셋은 블록 하나로 옮겨준다 */
function presetBlocks(p){
  if (!p) return [];
  if (!isArr(p.blocks)) p.blocks = [];
  if (!p.blocks.length && String(p.text||"").trim()){
    p.blocks = [{ name:"본문", text:String(p.text), on:true }];
    p.text = "";
  }
  return p.blocks;
}
function blkLen(p, onlyOn){
  var n=0;
  presetBlocks(p).forEach(function(b){
    if (onlyOn && b.on===false) return;
    n += String(b.text||"").length;
  });
  return n;
}
/* 켜둔 블록만 이어붙인다 */
function presetText(p){
  var parts=[];
  presetBlocks(p).forEach(function(b){
    if (b.on===false) return;
    var t=String(b.text||"").trim();
    if (!t) return;
    var nm=String(b.name||"").trim();
    parts.push((nm && nm!=="본문" && nm!=="머리말" ? "## "+nm+"\n" : "") + t);
  });
  return parts.join("\n\n");
}
/* 어떤 모양으로 온 프리셋이든 블록으로 쪼갠다 */
function psBlocks(o){
  var out=[], seen={};
  function add(nm, body, on){
    body=String(body==null?"":body).trim();
    if (body.length<8) return;
    var key=body.slice(0,300);
    if (seen[key]) return;
    seen[key]=1;
    nm=String(nm||"").trim().slice(0,40);
    out.push({ name: nm || ("블록 "+(out.length+1)), text: body.slice(0,60000), on: on!==false });
  }
  if (o && isArr(o.blocks) && o.blocks.length){
    o.blocks.forEach(function(b){ if (b) add(b.name, b.text, b.on!==false); });
    if (out.length) return out;
  }
  /* 실리태번: prompts + prompt_order 로 켜짐 여부를 읽는다 */
  if (o && isArr(o.prompts)){
    var byId={}, order=null, used={};
    o.prompts.forEach(function(p){ if (p && p.identifier) byId[p.identifier]=p; });
    if (isArr(o.prompt_order) && o.prompt_order.length){
      var last=o.prompt_order[o.prompt_order.length-1];
      if (last && isArr(last.order)) order=last.order;
    }
    var push=function(p, on){
      if (!p || typeof p!=="object" || p.marker) return;
      if (p.identifier && PS_SKIP[p.identifier]) return;
      var body=p.content || p.text || p.prompt;
      if (body) add(p.name, body, on && p.enabled!==false);
    };
    if (order){
      order.forEach(function(it){
        if (!it) return;
        used[it.identifier]=1;
        push(byId[it.identifier], it.enabled!==false);
      });
      o.prompts.forEach(function(p){ if (p && p.identifier && !used[p.identifier]) push(p, false); });
    } else {
      o.prompts.forEach(function(p){ push(p, true); });
    }
  }
  /* 리수: promptTemplate */
  if (o && isArr(o.promptTemplate)){
    o.promptTemplate.forEach(function(p){
      if (!p || typeof p!=="object") return;
      if (p.type && !PS_RISU[p.type]) return;
      var body=p.text || p.content;
      if (body) add(p.name || p.type2 || p.type, body, true);
    });
  }
  PS_KEYS.forEach(function(k){ if (typeof o[k]==="string") add(k, o[k], true); });
  if (!out.length){
    (function walk(v,d){
      if (d>4 || v==null) return;
      if (typeof v==="string"){ if (v.trim().length>=25) add("", v, true); return; }
      if (isArr(v)){ v.forEach(function(x){ walk(x,d+1); }); return; }
      if (typeof v==="object") for (var k in v){ if (/key|token|api|url|model/i.test(k)) continue; walk(v[k],d+1); }
    })(o,0);
  }
  return out.slice(0,60);
}
/* 그냥 글만 있는 파일은 큰 제목 단위로 쪼갠다 */
function psTextBlocks(t){
  var lines=String(t||"").replace(/\r/g,"").split("\n"), heads=0;
  lines.forEach(function(L){ if (/^#{1,2}\s+\S/.test(L)) heads++; });
  if (heads<2) return [{ name:"본문", text:String(t||"").trim().slice(0,60000), on:true }];
  var out=[], cur=null;
  lines.forEach(function(L){
    var m=L.match(/^#{1,2}\s+(.+)$/);
    if (m){
      if (cur && cur.text.trim()) out.push(cur);
      cur={ name:m[1].trim().slice(0,40), text:"", on:true };
      return;
    }
    if (!cur) cur={ name:"머리말", text:"", on:true };
    cur.text += L+"\n";
  });
  if (cur && cur.text.trim()) out.push(cur);
  out.forEach(function(b){ b.text=b.text.trim().slice(0,60000); });
  return out.length ? out.slice(0,60) : [{ name:"본문", text:String(t||"").trim().slice(0,60000), on:true }];
}
function parsePresets(raw, fname){
  var base=String(fname||"").replace(/\.[^.]+$/,"").trim() || "새 프리셋";
  var d=null;
  try{ d=JSON.parse(raw); }catch(e){}
  if (d===null || typeof d!=="object"){
    var t=String(raw||"").trim();
    if (!t) return [];
    var junk=(t.match(/[\u0000-\u0008\u000E-\u001F\uFFFD]/g)||[]).length;
    if (junk > t.length*0.02) return [];   /* 압축된 파일은 글자가 깨져서 온다 */
    return [ mkPreset(base, psTextBlocks(t)) ];
  }
  var list = isArr(d) ? d : (isArr(d.presets) ? d.presets : [d]);
  var out=[];
  list.forEach(function(o){
    if (typeof o==="string"){ if(o.trim()) out.push(mkPreset(base, psTextBlocks(o))); return; }
    if (!o || typeof o!=="object") return;
    var bs=psBlocks(o);
    if (!bs.length) return;
    var p=mkPreset(o.name||o.title||o.preset_name||o.presetName||base, bs);
    if (o.mode==="replace") p.mode="replace";
    p.temp = psTemp(o.temperature!==undefined ? o.temperature : o.temp);
    p.topP = psTop(o.top_p!==undefined ? o.top_p : o.topP);
    p.maxTokens = psNum(o.max_tokens!==undefined ? o.max_tokens
                    : (o.openai_max_tokens!==undefined ? o.openai_max_tokens
                    : (o.maxResponse!==undefined ? o.maxResponse : o.maxTokens)));
    out.push(p);
  });
  return out;
}
function presetById(id){
  for (var i=0;i<presets.length;i++) if (presets[i].id===id) return presets[i];
  return null;
}
/* 이 캐릭터에 실제로 걸리는 프리셋 */
function presetOf(c){
  var sel = c ? (c.preset||"") : "";
  if (sel==="none") return null;
  if (sel) return presetById(sel) || (cfg.preset ? presetById(cfg.preset) : null);
  return cfg.preset ? presetById(cfg.preset) : null;
}
function genOf(c){
  var ps=presetOf(c), o={ temp:null, topP:null, maxTokens:cfg.maxTokens||2600 };
  if (ps){
    if (ps.temp!=="" && isFinite(+ps.temp)) o.temp=+ps.temp;
    if (ps.topP!=="" && isFinite(+ps.topP)) o.topP=+ps.topP;
    if (ps.maxTokens!=="" && isFinite(+ps.maxTokens) && +ps.maxTokens>0) o.maxTokens=Math.max(200,Math.round(+ps.maxTokens));
  }
  return o;
}

    var sys="한 문장으로만 답한다.";
    if (cfg.mode==="openai"){
      var b=(cfg.base||"").replace(/\/+$/,"");
      url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
      headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
      body={ model:cfg.model, max_tokens:300, messages:[{role:"system",content:sys},{role:"user",content:"연결 확인. '좋아'라고만 답해줘."}] };
    } else {
      var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
      url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
      headers={ "Content-Type":"application/json" };
      body={ systemInstruction:{parts:[{text:sys}]},
             contents:[{role:"user",parts:[{text:"연결 확인. '좋아'라고만 답해줘."}]}],
             generationConfig:{ maxOutputTokens:300 } };
    }
    fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body)})
    .then(function(res){ return res.text().then(function(txt){
      var ms=Date.now()-t0, d=null;
      try{ d=JSON.parse(txt); }catch(e){}
      if(!res.ok){
        var em=(d&&d.error&&(d.error.message||d.error))||txt.slice(0,200);
        throw new Error(res.status+" · "+em);
      }
      var o="";
      if (cfg.mode==="openai"){
        var ch=d&&d.choices&&d.choices[0];
        o=ch?((ch.message&&ch.message.content)||ch.text||""):"";
      } else {
        var cd=d&&d.candidates&&d.candidates[0];
        o=cd?((cd.content&&cd.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
      }
      o=(o||"").trim();
      out.textContent = o ? ("연결 성공 · "+ms+"ms · 응답: "+o.slice(0,60))
                          : ("응답은 왔는데 본문이 비었어 · "+ms+"ms · 모델 이름을 확인해봐");
    });})
    .catch(function(e){ out.textContent = "실패 · "+(e.message||"연결 안 됨"); })

/* ---------- 대화방 ---------- */
function roomBytes(cid, rid){
  try { return (localStorage.getItem(roomKey(cid, rid))||"").length; } catch(e){ return 0; }
}
function viewRooms(){
  var c=cur(); if(!c) return go("list");
  var rs=roomsOf(c);
  elTitle.textContent="대화방"; elSub.textContent=c.name||"";
  elLeft.textContent="대화"; elLeft.onclick=function(){ go("chat", c.id); };

  var h='<div class="hint" style="margin-bottom:10px">캐릭터 설정, 로어북, 프리셋은 방끼리 같이 써. 대화 기록만 따로야.</div>';
  rs.forEach(function(r){
    var lg=get(roomKey(c.id, r.id), []);
    var last=lg.length ? String(lg[lg.length-1].t||"").replace(/\s+/g," ").trim().slice(0,34) : "아직 비어 있어";
    var kb=Math.round(roomBytes(c.id, r.id)/1024);
    h += '<div class="card'+(c.room===r.id?" on":"")+'" data-rm="'+esc(r.id)+'"><div class="meta">'
       + '<div class="nm">'+esc(r.name||"이름 없음")+(c.room===r.id?" · 지금 이 방":"")+'</div>'
       + '<div class="ds">'+esc(lg.length+"개 · "+kb+"KB · "+last)+'</div></div></div>';
  });
  h += '<button class="btn primary" id="rnew">새 대화 시작</button>';
  h += '<div class="hint">새 대화는 첫 마디부터 다시 시작해. 지금 방은 그대로 남아 있어.</div>';
  view.innerHTML=h;

  Array.prototype.forEach.call(view.querySelectorAll("[data-rm]"), function(el){
    el.onclick=function(){ roomMenu(c, el.getAttribute("data-rm")); };
  });
  $("#rnew").onclick=function(){ newRoom(c); };
}
function newRoom(c){
  var rs=roomsOf(c);
  var d=new Date(), two=function(n){ return (n<10?"0":"")+n; };
  var nm = (d.getMonth()+1)+"월 "+d.getDate()+"일 "+two(d.getHours())+":"+two(d.getMinutes());
  rs.push({ id: uid(), name: nm, at: Date.now() });
  c.room = rs[rs.length-1].id;
  saveChars();
  go("chat", c.id);
}
function roomMenu(c, rid){
  var rs=roomsOf(c);
  if (c.room!==rid){
    var pick=prompt("1 이 방으로 가기 · 2 이름 바꾸기 · 3 복제 · 4 삭제", "1");
    if (!pick) return;
    pick=pick.trim();
    if (pick==="1"){ c.room=rid; saveChars(); return go("chat", c.id); }
    if (pick==="2") return renameRoom(c, rid);
    if (pick==="3") return copyRoom(c, rid);
    if (pick==="4") return delRoom(c, rid);
    return;
  }
  var p2=prompt("1 이름 바꾸기 · 2 복제 · 3 삭제", "1");
  if (!p2) return;
  p2=p2.trim();
  if (p2==="1") return renameRoom(c, rid);
  if (p2==="2") return copyRoom(c, rid);
  if (p2==="3") return delRoom(c, rid);
}
function renameRoom(c, rid){
  var rs=roomsOf(c), r=null;
  for (var i=0;i<rs.length;i++) if (rs[i].id===rid) r=rs[i];
  if (!r) return;
  var v=prompt("방 이름", r.name||"");
  if (v===null) return;
  r.name=String(v).slice(0,30) || r.name;
  saveChars(); render();
}
function copyRoom(c, rid){
  var rs=roomsOf(c), src=get(roomKey(c.id, rid), []), nid=uid();
  if (!put(roomKey(c.id, nid), src)){
    alert("저장 공간이 부족해. 안 쓰는 방이나 사진을 지우고 다시 해줘.");
    return;
  }
  rs.push({ id:nid, name:(roomName(c,rid)+" 복사본").slice(0,30), at:Date.now() });
  saveChars(); render();
}
function delRoom(c, rid){
  var rs=roomsOf(c);
  if (rs.length<=1){ alert("방이 하나뿐이야. 지우려면 초기화를 써."); return; }
  if (!confirm(roomName(c,rid)+" 방을 지울까? 그 안의 대화도 같이 사라져.")) return;
  try { localStorage.removeItem(roomKey(c.id, rid)); } catch(e){}
  c.rooms = rs.filter(function(r){ return r.id!==rid; });
  if (c.room===rid) c.room = c.rooms[0].id;
  saveChars(); render();
}

/* ---------- 프리셋 ---------- */
function addPresets(list){
  if (!list.length){ alert("읽을 수 있는 내용이 없어. 파일 안에 지침 글이 들어 있는지 봐줘."); return; }
  var before=presets.slice();
  presets = presets.concat(list);
  if (!savePresets()){
    presets = before; savePresets();
    alert("저장 공간이 부족해. 사진이나 지난 대화를 정리하고 다시 해줘.");
    return;
  }
  alert(list.length+"개 올렸어.");
  render();
}

  }

var KINDS = ["문자","일기","편지","속마음","플리","나레"];

function pieces(c, text){
  var names = [ (c.name||"").trim() ].concat(castOf(c).map(function(x){ return x.name.trim(); }))
                .filter(function(x){ return x; });
  var t = String(text||"");
  // '플리:' 처럼 머리말만 쓴 경우도 태그로 취급
  t = t.replace(new RegExp("^\\s*(" + KINDS.join("|") + ")\\s*[:：]\\s*$", "gm"), "[$1]");
  t = t.replace(new RegExp("^\\s*\\[\\s*(" + KINDS.join("|") + ")\\s*\\]\\s*$", "gm"), "[$1]");

  var lines = t.split("\n"), res = [], curKind = null, curWho = null, buf = [];
  function flush(){
    var body = buf.join("\n").trim();
    buf = [];
    if (!body) return;
    if (curKind) res.push({ card:curKind, text:body });
    else res.push({ who:curWho, text:body });
  }
  var openRe  = new RegExp("^\\s*\\[(" + KINDS.join("|") + ")\\]\\s*$");
  var closeRe = new RegExp("^\\s*\\[/\\s*(" + KINDS.join("|") + ")\\s*\\]\\s*$");

  for (var i=0;i<lines.length;i++){
    var L = lines[i], m;
    if ((m = L.match(openRe))){ flush(); curKind = m[1]; continue; }
    if (closeRe.test(L)){ flush(); curKind = null; continue; }
    m = L.match(/^\s*\[([^\]\n]{1,20})\]\s*(.*)$/);
    if (m && KINDS.indexOf(m[1].trim()) < 0){
      flush(); curKind = null; curWho = m[1].trim();
      if (m[2].trim()) buf.push(m[2]);
      continue;
    }
    buf.push(L);
  }
  flush();

  // 태그를 빼먹었어도 곡 목록처럼 생겼으면 플리로 본다
  var out = [];
  res.forEach(function(seg){
    if (seg.card){ out.push(seg); return; }
    var ls = seg.text.split("\n"), run = [], rest = [];
    function dumpRun(){
      if (run.length >= 2) out.push({ card:"플리", text:run.join("\n") });
      else Array.prototype.push.apply(rest, run);
      run = [];
    }
    ls.forEach(function(L){
      if (/::/.test(L) && /\S\s*[-–—]\s*\S/.test(L)) run.push(L);
      else { dumpRun(); rest.push(L); }
    });
    dumpRun();
    var r = rest.join("\n").trim();
    if (r) out.push({ who:seg.who, text:r });
  });
  return out;
}




/* 첫 마디를 @: 나레이션 / @이름: 말풍선 으로 나눠 담기 */
function seedGreeting(c, txt){
  var names = [ (c.name||"").trim() ].concat(castOf(c).map(function(x){ return x.name.trim(); })).filter(Boolean);
  var uname = (c.userName||"").trim();
  var out=[], mode="bub", who=null, buf=[];

  function flush(){
    var t=buf.join("\n").trim(); buf=[];
    if (!t) return;
    if (mode==="narr"){ out.push({ r:"a", t:t, narr:true }); return; }
    if (mode==="user"){ out.push({ r:"u", t:t }); return; }
    if (who && names.length && who!==names[0]) out.push({ r:"a", t:"["+who+"]\n"+t });
    else out.push({ r:"a", t:t });
  }

  String(txt).split("\n").forEach(function(L){
    var m = L.match(/^\s*@\s*([^:：\n]*)\s*[:：]\s*([\s\S]*)$/);
    if (m){
      flush();
      var tag = m[1].trim();
      if (!tag){ mode="narr"; who=null; }
      else if (/^(user|나|유저)$/i.test(tag) || (uname && tag===uname)){ mode="user"; who=null; }
      else {
        mode="bub"; who=null;
        for (var i=0;i<names.length;i++){
          if (names[i]===tag || names[i].indexOf(tag)>=0 || tag.indexOf(names[i])>=0){ who=names[i]; break; }
        }
        if (!who) who = names[0] || null;
      }
      if (m[2].trim()) buf.push(m[2]);
      return;
    }
    var m2 = L.match(/^\s*말풍선\s*[:：]\s*([\s\S]*)$/);
    if (m2){ flush(); mode="bub"; who=null; if(m2[1].trim()) buf.push(m2[1]); return; }
    buf.push(L);
  });
  flush();
  if (!out.length) out.push({ r:"a", t:String(txt).trim() });
  return out;
}


/* 장면 전환 · 앞 이야기 요약해서 접기 */
function makeRecap(c, done){
  var log = getLog(c.id);
  var body = log.slice(-40).map(function(m){
    return (m.r==="u" ? (c.userName||"나") : (c.name||"상대")) + ": " + m.t;
  }).join("\n").slice(-9000);
  if (!body) return done();
  var sys = "너는 이야기를 정리하는 도우미다. 아래 상황극 기록을 6~10줄로 요약한다. "
          + "인물 사이에 무슨 일이 있었는지, 관계가 어떻게 변했는지, 아직 풀리지 않은 것이 무엇인지 담는다. "
          + "대사나 묘사를 옮기지 말고 사실만 담백하게 적는다.";
  var prev = recapOf(c) ? "이전 요약:\n"+recapOf(c)+"\n\n" : "";
  var url, headers, bd;
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    bd={ model:cfg.model, max_tokens:1200, messages:[{role:"system",content:sys},{role:"user",content:prev+body}] };
  } else {
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    bd={ systemInstruction:{parts:[{text:sys}]}, contents:[{role:"user",parts:[{text:prev+body}]}],
         generationConfig:{ maxOutputTokens:1200 } };
  }
  fetch(url,{method:"POST",headers:headers,body:JSON.stringify(bd)})
  .then(function(r){ return r.text(); })
  .then(function(txt){
    var d=null; try{ d=JSON.parse(txt); }catch(e){}
    var out="";
    if (cfg.mode==="openai"){
      var ch=d&&d.choices&&d.choices[0];
      out=ch?((ch.message&&ch.message.content)||""):"";
    } else {
      var cd=d&&d.candidates&&d.candidates[0];
      out=cd?((cd.content&&cd.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
    }
    if (out.trim()) setRecap(c, out.trim());
    done();
  })
  .catch(function(){ done(); });
}

function parseLoreBulk(raw){
  var blocks = String(raw||"").replace(/\r/g,"").split(/\n\s*\n/);
  var out = [];
  blocks.forEach(function(b){
    var t="", k="", body=[], mode=null;
    b.split("\n").forEach(function(L){
      var m;
      if ((m = L.match(/^\s*제목\s*[:：]\s*(.*)$/))){ t=m[1].trim(); mode="t"; return; }
      if ((m = L.match(/^\s*키워드\s*[:：]\s*(.*)$/))){ k=m[1].trim(); mode="k"; return; }
      if ((m = L.match(/^\s*내용\s*[:：]\s*(.*)$/))){ if(m[1].trim()) body.push(m[1]); mode="c"; return; }
      if (!t && !k && (m = L.match(/^\s*([^|\n]{1,30})\|\s*(.*)$/))){ t=m[1].trim(); k=m[2].trim(); mode="c"; return; }
      if (mode==="c" || mode===null) body.push(L);
      else if (mode==="k" && L.trim()) k += ", "+L.trim();
      else if (mode==="t" && L.trim()) body.push(L);
    });
    var text = body.join("\n").trim();
    if (!text && !k) return;
    out.push({ title:t, keys:k, text:text, always:false });
  });
  return out;
}

/* 지금 대화에 걸리는 항목만 골라오기 */
function pickLore(c){
  var items = c.lore || [];
  if (!items.length) return [];
  var log = getLog(c.id).slice(-4).map(function(m){ return m.t; }).join(" ");
  var out = [], rest = [];
  items.forEach(function(it){
    if (!it.text) return;
    if (it.always){ out.push(it); return; }
    var kk = (it.keys||"")
      .replace(/\{\{\s*user\s*\}\}/gi, c.userName||"")
      .replace(/\{\{\s*char\s*\}\}/gi, c.name||"");
    var keys = kk.split(/[,，]/).map(function(x){ return x.trim(); }).filter(Boolean);
    for (var i=0;i<keys.length;i++){
      if (log.indexOf(keys[i]) >= 0){ rest.push(it); return; }
    }
  });
  return out.concat(rest).slice(0,5);
}

/* ---------- 문자 모드 ---------- */
function smsKey(id){ return "gz.smsl."+id; }
function getThreads(id){ return get(smsKey(id), []); }
function setThreads(id,v){ put(smsKey(id), v); }
function curThread(c){
  var th = getThreads(c.id);
  for (var i=0;i<th.length;i++) if (th[i].id===smsCur) return th[i];
  return null;
}
function saveThread(c, t){
  var th = getThreads(c.id), hit=false;
  for (var i=0;i<th.length;i++) if (th[i].id===t.id){ th[i]=t; hit=true; break; }
  if (!hit) th.unshift(t);
  setThreads(c.id, th);
}
var smsCur = null;

function peopleOf(c){
  var arr = [{ key:"user", name:c.userName||"나", disp:udispOf(c), avatar:c.userAvatar }];
  arr.push({ key:"main", name:c.name||"상대", disp:dispOf(c), avatar:c.avatar });
  castOf(c).forEach(function(x,i){ arr.push({ key:"cast"+i, name:x.name, disp:x.name, avatar:x.avatar }); });
  return arr;
}
function personByName(c, nm){
  var ps = peopleOf(c), n=(nm||"").trim();
  for (var i=0;i<ps.length;i++){
    var p=ps[i];
    if (p.name.trim()===n || p.disp.trim()===n) return p;
  }
  for (var j=0;j<ps.length;j++){
    var q=ps[j];
    if (n && (q.name.indexOf(n)>=0 || n.indexOf(q.name)>=0)) return q;
  }
  return { key:"etc", name:n, disp:n, avatar:"" };
}
function isUserName(c, n){
  var t=(n||"").trim();
  return /^(user|나|유저)$/i.test(t) || (c.userName && t===c.userName.trim()) || (c.userDisplay && t===c.userDisplay.trim());
}

/* /문자 @A @B @C */
function parseSms(c, text){
  var t = text.trim();
  if (!/^\/문자탭/.test(t) && !/^\/문자\s*@/.test(t)) return null;
  var ats = t.match(/@[^\s@]+/g);
  if (!ats || ats.length < 2) return { pick:true };
  var names = ats.map(function(a){ return a.slice(1); });
  return { names:names };
}

function makeThread(c, names){
  var parts = [], random = false;
  names.forEach(function(n){
    if (n==="랜덤"){ random = true; return; }
    parts.push(isUserName(c,n) ? personByName(c, c.userName||"나") : personByName(c,n));
  });
  if (!parts.length) return null;
  var peek = true;
  parts.forEach(function(p){ if (p.key==="user") peek=false; });
  var t = {
    id: uid(),
    from: parts[0].name,
    parts: parts,
    random: random,
    peek: peek,
    log: []
  };
  t.title = random ? (parts[0].disp + " → ?")
          : parts.map(function(p){ return p.disp; }).join(", ");
  saveThread(c, t);
  smsCur = t.id;
  go("sms", c.id);
  return t;
}

/* 상대 고르기 */
var pickN = 3;
function viewSmsPick(){
  var c=cur(); if(!c) return go("list");
  elTitle.textContent="새 문자"; elSub.textContent="누가 누구랑?";
  elLeft.textContent="취소"; elLeft.onclick=function(){ pickN=3; go("smslist", c.id); };
  var ps = peopleOf(c);
  var opt = function(extra){
    return ps.map(function(x){ return '<option value="'+esc(x.name)+'">'+esc(x.disp)+"</option>"; }).join("")
         + (extra||"");
  };
  var h = '<div class="hint" style="margin-bottom:12px">맨 위가 폰 주인이야. 오른쪽 말풍선으로 뜨고 저장명도 이 사람 기준으로 붙어. 셋 이상이면 단톡방이 돼.</div>';
  h += '<label>폰 주인 · 보내는 사람</label><select id="s1">'+opt()+'</select>';
  for (var i=2;i<=pickN;i++){
    h += '<label>'+(i===2?"받는 사람":"참여자 "+(i-1))+'</label>'
       + '<select id="s'+i+'">'
       + (i>2 ? '<option value="">없음</option>' : "")
       + opt('<option value="__random">랜덤 (상황에 맞게)</option><option value="__etc">직접 입력</option>')
       + '</select>'
       + '<input id="s'+i+'e" placeholder="이름 직접 입력" style="margin-top:8px;display:none">';
  }
  h += '<button class="btn" id="more">사람 추가</button>';
  h += '<button class="btn primary" id="sgo">시작</button>';
  view.innerHTML = h;

  for (var j=2;j<=pickN;j++){
    (function(k){
      var sel=$("#s"+k);
      if (sel) sel.onchange=function(){ $("#s"+k+"e").style.display = this.value==="__etc"?"block":"none"; };
    })(j);
  }
  $("#more").onclick=function(){ if (pickN<7){ pickN++; render(); } };
  $("#sgo").onclick=function(){
    var names=[$("#s1").value], seen={};
    seen[names[0]]=1;
    for (var k=2;k<=pickN;k++){
      var el=$("#s"+k); if(!el) continue;
      var v=el.value;
      if (!v) continue;
      if (v==="__random"){ names.push("랜덤"); continue; }
      if (v==="__etc"){
        var e=($("#s"+k+"e").value||"").trim();
        if (e && !seen[e]){ names.push(e); seen[e]=1; }
        continue;
      }
      if (!seen[v]){ names.push(v); seen[v]=1; }
    }
    if (names.length<2) return alert("최소 두 명은 있어야 해.");
    pickN=3;
    makeThread(c, names);
  };
}

function paintSms(err, thinking){
  var c=cur(); if(!c) return;
  var t=curThread(c); if(!t) return;
  var head = t.parts[0] || {disp:"", avatar:""};
  var other = t.peek ? head : (t.parts.filter(function(p){ return p.key!=="user"; })[0] || head);

  var h = '<div class="smswrap" data-th="'+esc(cfg.smsTheme||"기본")+'">';
  h += '<div class="smsbar">'+avaHTML(other.avatar,"💬","sm")
     + '<div class="nm" id="smsnm">'+esc(t.title)+'<div class="sub">'+(t.peek?"엿보는 중":"문자")+'</div></div>'
     + '<button id="smsadd">인원</button><button id="smstime">시각</button><button id="smslist2">목록</button><button id="smsx">✕</button></div>';
  h += '<div class="smsbody">';

  var prev = null, prevDay = "";
  var lastMine = -1;
  for (var q=0;q<t.log.length;q++) if (t.log[q].mine) lastMine = q;
  var readAfter = false;
  if (lastMine >= 0){
    for (var w=lastMine+1;w<t.log.length;w++) if (!t.log[w].mine) readAfter = true;
  }
  t.log.forEach(function(m, i){
    if (m.at){
      var d = ymd(m.at);
      if (d !== prevDay){
        h += '<div class="sday"><i>'+esc(dayLabel(m.at))+'</i></div>';
        prevDay = d; prev = null;
      }
    }
    if (m.sys){
      h += '<div class="sday" data-si="'+i+'"><i>'+esc(m.t)+'</i></div>';
      prev=null; return;
    }
    var right = (m.who === t.from);
    var p = personByName(c, m.who);
    var same = prev === m.who;
    var next = t.log[i+1];
    var lastOfRun = !next || next.who !== m.who || (next.at && m.at && ymd(next.at)!==ymd(m.at));
    var tm = (m.at && lastOfRun) ? '<span class="stime">'+esc(hhmm(m.at))+'</span>' : '';
    var rd = (i===lastMine && readAfter) ? '<span class="stime sread">읽음</span>' : '';
    h += '<div class="sm'+(right?" r":"")+(same?"":" gap")+'" data-si="'+i+'">';
    if (!right) h += avaHTML(same?"":p.avatar,"🙂", same?"av hide":"av").replace('class="ava','class="av');
    h += '<div class="col">'
       + (!right && !same ? '<div class="who2">'+esc(p.disp||m.who)+'</div>' : "")
       + '<div class="brow"><div class="b">'+esc(m.t)+'</div>'+rd+tm+'</div></div></div>';
    prev = m.who;
  });

  if (thinking) h += '<div class="hint" style="padding:8px 4px">쓰는 중…</div>';
  if (err) h += '<div class="err" style="margin:10px 2px">'+esc(err)+'</div>';
  if (!t.log.length && !thinking && !err)
    h += '<div class="empty">'+(t.peek?"더 보기를 눌러봐.":"먼저 보내거나 더 보기를 눌러봐.")+'</div>';
  h += '</div>';
  if (t.peek || !t.log.length) h += '<button class="smsmore" id="smsmore">더 보기</button>';
  h += '</div>';
  view.innerHTML = h;

  $("#smsx").onclick=function(){ go("chat", c.id); };
  $("#smslist2").onclick=function(){ go("smslist", c.id); };
  if ($("#smsnm")) $("#smsnm").onclick=function(){
    var ownerNm = (t.parts[0] && (t.parts[0].disp||t.parts[0].name)) || "폰 주인";
    var v=prompt(ownerNm+"의 폰에 저장된 이름이야.\n직접 적거나, ? 만 넣으면 알아서 지어줄게.", t.title||"");
    if (v===null) return;
    v=String(v).trim();
    if (!v) return;
    if (v==="?"){
      t.named=false; saveThread(c,t);
      var keep=t.log.length; if (keep<4) return alert("문자를 조금 더 주고받은 다음에 눌러줘.");
      nameThread(c, t, true);
      return;
    }
    t.title=v.slice(0,24); t.named=true; saveThread(c,t); paintSms();
  };
  $("#smsadd").onclick=function(){
    var ps=peopleOf(c);
    var have={}; t.parts.forEach(function(x){ have[x.name]=1; });
    var left=ps.filter(function(x){ return !have[x.name]; });
    var menu=left.map(function(x,i){ return (i+1)+" "+x.disp; }).join(" · ");
    var v=prompt("이 방에 넣을 사람\n"+(menu||"설정에 있는 사람은 다 들어와 있어.")+"\n\n번호를 넣거나 이름을 직접 적어줘.", "");
    if (v===null) return;
    v=String(v).trim(); if(!v) return;
    var pick=null, n=parseInt(v,10);
    if (n>=1 && n<=left.length) pick=left[n-1];
    else pick=personByName(c, v);
    if (!pick || !pick.name) return;
    if (have[pick.name]) return alert("이미 들어와 있어.");
    t.parts.push(pick);
    t.title = t.parts.map(function(x){ return x.disp||x.name; }).join(", ");
    t.named = false;
    t.log.push({ who:"", t:pick.disp+"님이 들어왔어요.", sys:true, at:stampAt(t) });
    saveThread(c,t); paintSms();
  };
  $("#smstime").onclick=function(){
    var base = t.start || Date.now(), d = new Date(base);
    var curv = d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate())+" "+two(d.getHours())+":"+two(d.getMinutes());
    var v = prompt("이 방이 시작된 시각\n(예: 2003-05-17 18:30)", curv);
    if (v===null) return;
    var mm = String(v).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T]+(\d{1,2}):(\d{2})$/);
    if (!mm) return alert("형식이 안 맞아. 2003-05-17 18:30 처럼 적어줘.");
    var ns = new Date(+mm[1], +mm[2]-1, +mm[3], +mm[4], +mm[5]).getTime();
    var diff = ns - (t.start || base);
    t.start = ns;
    t.log.forEach(function(x){ if (x.at) x.at += diff; });
    saveThread(c, t); paintSms();
  };
  if ($("#smsmore")) $("#smsmore").onclick=function(){ smsTurn(); };
  Array.prototype.forEach.call(view.querySelectorAll("[data-si]"), function(el){
    bindHold(el, function(){
      var i=+el.getAttribute("data-si");
      smsMenu(i);
    });
  });
  view.scrollTop = view.scrollHeight;
}

function smsMenu(i){
  var c=cur(), t=curThread(c); if(!t) return;
  var m=t.log[i]; if(!m) return;
  var pick = prompt("1 복사 · 2 수정 · 3 삭제 · 4 여기부터 지우기", "1");
  if (!pick) return;
  pick = pick.trim();
  if (pick==="1") copyText(m.t);
  else if (pick==="2"){
    var v = prompt("수정", m.t);
    if (v!==null){ m.t=v; saveThread(c,t); paintSms(); }
  }
  else if (pick==="3"){ t.log.splice(i,1); saveThread(c,t); paintSms(); }
  else if (pick==="4"){ t.log.splice(i); saveThread(c,t); paintSms(); }
}

function buildSmsSystem(c, t){
  var p=[], cs=castOf(c);
  p.push("문자 메시지만 쓴다. 지문, 묘사, 설명, 별표는 한 줄도 쓰지 않는다.");
  p.push("");
  p.push("# 인물");
  p.push((c.name||"") + " — " + (c.tagline||"") + " " + (c.prompt||""));
  cs.forEach(function(x){ p.push(x.name+" — "+(x.prompt||"")+(x.style?" / 말투: "+x.style:"")); });
  p.push((c.userName||"나") + " — " + (c.userPrompt||""));
  if (c.world){ p.push(""); p.push("# 상황"); p.push(fillVars(c, c.world)); }
  if (c.note){ p.push(""); p.push("# 반드시 기억할 것"); p.push(fillVars(c, c.note)); }
  var rc=recapOf(c);
  if (rc){ p.push(""); p.push("# 지금까지의 이야기"); p.push(rc); }
  var lore = pickLore(c);
  if (lore.length){
    p.push(""); p.push("# 설정집");
    lore.forEach(function(it){ p.push("- "+(it.title?it.title+": ":"")+fillVars(c, it.text)); });
  }
  var rl = getLog(c.id).slice(-8).map(function(m){
    return (m.r==="u" ? (c.userName||"나") : (c.name||"상대")) + ": " + m.t;
  }).join("\n");
  if (rl){ p.push(""); p.push("# 조금 전까지의 상황"); p.push(rl); }

  p.push("");
  p.push("# 이 문자방");
  p.push("참여자: " + t.parts.map(function(x){ return x.name; }).join(", ") + (t.random ? ", 그리고 상황에 맞는 상대 한 명" : ""));
  if (t.random) p.push(t.from + "가 지금 상황에 맞는 상대에게 보낸다. 설정에 없는 인물이어도 된다. 상대 이름을 정하고 그 이름으로 계속 쓴다.");

  p.push("");
  p.push("# 형식");
  p.push("한 줄에 하나씩 '이름: 내용' 형식으로만 쓴다. 다른 형식은 쓰지 않는다.");
  p.push("문자답게 짧고 구어체로, 실제로 폰으로 칠 법하게 쓴다. 한 줄이 길어야 두 문장이다.");
  p.push("문장을 도중에 끊지 말고 끝까지 맺는다.");
  var others = t.parts.filter(function(x){ return x.key!=="user"; });
  if (others.length >= 2){
    p.push("");
    p.push("# 단톡방이다");
    p.push("한 번에 4~8줄 쓴다.");
    p.push("같은 사람이 연달아 여러 번 말해도 된다. 한 사람이 던지면 다른 사람이 받고, 처음 사람이 다시 되받는 식으로 주고받는다.");
    p.push("사람마다 말수가 다르다. 말이 많은 사람은 여러 번, 조용한 사람은 한 마디만, 이번에 아예 말하지 않는 사람이 있어도 된다. 모두에게 똑같이 나눠 주지 않는다.");
    p.push("모든 말에 답이 달릴 필요는 없다. 누군가의 말이 그냥 묻히거나, 하던 얘기가 끊기고 다른 화제로 넘어가도 된다.");
    p.push("실제 단톡방처럼 쓴다. 회의록이나 순서대로 돌아가며 한 마디씩 하는 형식이 되면 안 된다.");
  } else {
    p.push("한 번에 2~4줄만 쓴다.");
  }
  if (t.peek){
    p.push((c.userName||"나")+"는 이 문자방에 없다. 참여자들끼리만 주고받는다.");
    p.push("여러 명이면 서로 답하며 자연스럽게 이어간다.");
  } else {
    var npcs = t.parts.filter(function(x){ return x.key!=="user"; }).map(function(x){ return x.name; });
    p.push(npcs.join(", ")+"의 문자만 쓴다. "+(c.userName||"나")+"의 문자는 절대 대신 쓰지 않는다.");
  }
  return p.join("\n");
}

function smsTurn(){
  var c=cur(); if(!c||busy) return;
  var t=curThread(c); if(!t) return;
  if(!cfg.key){ paintSms("API 키가 없어. 설정에서 넣어줘."); return; }
  busy=true; paintSms(null,true);

  var transcript = t.log.map(function(m){ return m.who+": "+m.t; }).join("\n");
  var ask = t.peek ? "이어서 문자를 2~4줄 더 써줘." : "이어서 문자를 2~4줄 써줘.";
  var content = (transcript ? "지금까지 문자:\n"+transcript+"\n\n" : "") + ask;
  var sys = buildSmsSystem(c, t);
  var sgen = genOf(c);
  var lim = Math.max(1500, Math.min(sgen.maxTokens||2600, 4000));

  var url, headers, body;
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    body={ model:cfg.model, max_tokens:lim, messages:[{role:"system",content:sys},{role:"user",content:content}] };
    if (sgen.temp!==null) body.temperature=sgen.temp;
    if (sgen.topP!==null) body.top_p=sgen.topP;
  } else {
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    body={ systemInstruction:{parts:[{text:sys}]}, contents:[{role:"user",parts:[{text:content}]}],
           generationConfig:{ maxOutputTokens:lim } };
    if (sgen.temp!==null) body.generationConfig.temperature=sgen.temp;
    if (sgen.topP!==null) body.generationConfig.topP=sgen.topP;
  }

  fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body)})
  .then(function(res){ return res.text().then(function(txt){
    var data=null; try{ data=JSON.parse(txt); }catch(e){}
    if(!res.ok){
      var em=(data&&data.error&&(data.error.message||data.error))||txt.slice(0,300);
      throw new Error("서버가 "+res.status+" 로 응답했어.\n"+em);
    }
    var out="";
    if (cfg.mode==="openai"){
      var ch=data&&data.choices&&data.choices[0];
      out=ch?((ch.message&&ch.message.content)||ch.text||""):"";
    } else {
      var cand=data&&data.candidates&&data.candidates[0];
      out=cand?((cand.content&&cand.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
    }
    return out.trim();
  });})
  .then(function(out){
    var tt=curThread(c);
    out.split("\n").forEach(function(L){
      var x=L.trim(); if(!x) return;
      x = x.replace(/\*/g,"");
      var m=x.match(/^\s*([^:：]{1,20})[:：]\s*([\s\S]*)$/);
      if (!m || !m[2].trim()) return;
      var who = m[1].trim();
      if (!tt.peek && isUserName(c, who)) return;
      tt.log.push({ who:who, t:m[2].trim(), at:stampAt(tt) });
    });
    saveThread(c, tt);
    busy=false; paintSms();
    nameThread(c, tt);
  })
  .catch(function(e){ busy=false; paintSms(e.message||"연결 실패"); });
}

/* 방마다 시작 시각을 정해두고, 메시지마다 몇 분씩 흘려보낸다 */
function stampAt(t){
  if (!t.start) t.start = Date.now();
  var last = 0;
  for (var i=t.log.length-1;i>=0;i--) if (t.log[i].at){ last=t.log[i].at; break; }
  var base = last || t.start;
  return base + 60000*(1+Math.floor(Math.random()*4));
}
function two(n){ return (n<10?"0":"")+n; }
function hhmm(ms){
  var d=new Date(ms), h=d.getHours(), ap=h<12?"오전":"오후", hh=h%12; if(!hh) hh=12;
  return ap+" "+hh+":"+two(d.getMinutes());
}
function ymd(ms){ var d=new Date(ms); return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate()); }
function dayLabel(ms){
  var d=new Date(ms), w=["일","월","화","수","목","금","토"][d.getDay()];
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+w+"요일";
}
/* 모델한테 한 줄만 물어보는 용도 */
function askLLM(sys, content, cb){
  var url, headers, body;
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    body={ model:cfg.model, max_tokens:200,
           messages:[{role:"system",content:sys},{role:"user",content:content}] };
  } else {
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    body={ systemInstruction:{parts:[{text:sys}]},
           contents:[{role:"user",parts:[{text:content}]}],
           generationConfig:{ maxOutputTokens:200 } };
  }
  fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(function(d){
      var out="";
      if (cfg.mode==="openai"){
        var ch=d&&d.choices&&d.choices[0];
        out=ch?((ch.message&&ch.message.content)||ch.text||""):"";
      } else {
        var cd=d&&d.candidates&&d.candidates[0];
        out=cd?((cd.content&&cd.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
      }
      cb(String(out||"").trim());
    })
    .catch(function(){ cb(""); });
}
function tidyName(v){
  var line=String(v||"").split("\n").map(function(x){return x.trim();}).filter(Boolean)[0]||"";
  return line.replace(/^["'`\s]+|["'`\s]+$/g,"")
             .replace(/^(저장명|방\s*이름|이름)\s*[:：]\s*/,"")
             .replace(/^\(|\)$/g,"").slice(0,24);
}
/* 개인톡은 연락처 저장명, 단톡은 방 이름을 지어 준다 */
function nameThread(c, t, force){
  if ((t.named && !force) || t.log.length < 4 || !cfg.key) return;
  var others = t.parts.filter(function(x){ return x.key!=="user"; });
  var group = (t.parts.length >= 3);
  if (!group && !force) return;   /* 개인톡 저장명은 직접 정한다 */
  t.named = true; saveThread(c, t);
  var ownerP = t.parts[0] || {};
  var owner  = ownerP.disp || ownerP.name || "폰 주인";
  var script = t.log.slice(-14).map(function(m){ return m.who+": "+m.t; }).join("\n");
  var sys, ask;
  if (group){
    sys = [
      "너는 단톡방 이름을 짓는다.",
      "실제 사람들이 자기 단톡방에 붙이는 이름처럼 짓는다. 참여자 이름을 나열하지 않는다.",
      "대화 내용이나 이 사람들의 관계에서 나온 말로 짓는다.",
      "설명하지 말고 이름 한 줄만 출력한다. 24자 이내."
    ].join("\n");
    ask = "대화:\n"+script+"\n\n방 이름 한 줄만.";
  } else {
    var themP = null;
    for (var z=1;z<t.parts.length;z++) if (t.parts[z]) { themP=t.parts[z]; break; }
    var them = themP ? (themP.disp||themP.name) : "상대";
    sys = [
      "너는 연락처 저장명을 짓는다.",
      owner+"가 "+them+"을(를) 자기 폰에 뭐라고 저장해 두었을지 정한다.",
      "저장명은 부르는 말이 아니라 연락처에 적어 넣는 이름이다. 조사를 붙이지 않는다.",
      "둘의 관계와 마음이 저장명을 정한다. 가까우면 애칭이나 별명이, 껄끄러우면 이름 뒤에 소속이나 용건이 붙는다.",
      "설명하지 말고 저장명 한 줄만 출력한다. 24자 이내."
    ].join("\n");
    ask = "인물: "+(c.name||"")+" — "+(c.prompt||"").slice(0,300)
        + "\n\n주고받은 문자:\n"+script+"\n\n저장명 한 줄만.";
  }
  askLLM(sys, ask, function(out){
    var nm = tidyName(out);
    if (!nm) return;
    var th = getThreads(c.id);
    for (var i=0;i<th.length;i++) if (th[i].id===t.id){
      th[i].title = nm; th[i].named = true;
      setThreads(c.id, th);
      if (screen==="sms" && smsCur===t.id) paintSms();
      break;
    }
  });
}
function smsSend(text){
  var c=cur(); if(!c) return;
  var t=curThread(c); if(!t) return;
  t.log.push({ who:(c.userName||"나"), t:text, mine:true, at:stampAt(t) });
  saveThread(c, t);
  paintSms(); smsTurn();
}

function viewChat(){

function actsHTML(i){
  return '<div class="acts"><button data-cp="'+i+'">복사</button>'
       + '<button data-ed="'+i+'">수정</button>'
       + '<button class="del" data-del="'+i+'">삭제</button>'
       + '<button class="del" data-cut="'+i+'">여기부터 지우기</button></div>';
}
function altBarHTML(m,i){
  if (!m.alts || m.alts.length<2) return "";
  return '<div class="altbar" data-alt="'+i+'"><button data-ap="'+i+'">‹</button>'
       + '<span>'+((m.ai||0)+1)+' / '+m.alts.length+'</span>'
       + '<button data-an="'+i+'">›</button></div>';
}

function paint(err, thinking){
  var c=cur(); if(!c) return;
  var log=getLog(c.id), h="";
  for (var i=0;i<log.length;i++){
    var m=log[i];
    if (editIdx===i){
      h += '<div class="msg'+(m.r==="u"?" me":"")+'"><div class="col" style="max-width:100%;width:100%">'
         + '<textarea class="editbox" id="eb">'+esc(m.t)+'</textarea>'
         + '<div class="acts"><button data-save="'+i+'">저장</button><button data-cancel="1">취소</button></div></div></div>';
      continue;
    }
    if (m.narr){
      h += '<div class="narr" data-i="'+i+'">'+fmt(m.t).replace(/<em>|<\/em>/g,"")+'</div>' + (selIdx===i?actsHTML(i):"");
      continue;
    }
    if (m.ooc){
      h += '<div class="ooc" data-i="'+i+'">'+esc(m.t)+'</div>' + (selIdx===i?actsHTML(i):"");
      continue;
    }
    if (m.r==="u" && m.sms){
      h += '<div data-i="'+i+'">'+cardHTML("문자", m.t.replace(/^\[문자\]\s*|\s*\[\/문자\]$/g,""), c)+'</div>'
         + (selIdx===i?actsHTML(i):"");
      continue;
    }
    if (m.r==="u"){
      var ub = (cfg.viewMode==="doc") ? fmtIn(m.t) : fmt(m.t);
      h += '<div class="msg me"><div class="col"><div class="bub" data-i="'+i+'">'+ub+'</div>'
         + (selIdx===i?actsHTML(i):"")+'</div></div>';
      continue;
    }
    var ps = pieces(c, m.t), body = "";
    ps.forEach(function(p){
      if (p.card){
        body += '<div data-i="'+i+'">'+cardHTML(p.card, p.text, c)+'</div>';
        return;
      }
      var who = p.who ? (findPerson(c,p.who) || {name:p.who, avatar:"👤"}) : {name:dispOf(c), avatar:c.avatar};
      if (cfg.viewMode==="doc"){
        body += '<div class="dturn">'+docHTML(who.name||"", p.text, i)+'</div>';
        return;
      }
      body += '<div class="msg">'+avaHTML(who.avatar,"🙂","sm")
            + '<div class="col"><div class="who">'+esc(who.name||"")+'</div>'
            + '<div class="bub" data-i="'+i+'">'+fmt(p.text)+'</div></div></div>';
    });
    h += body + altBarHTML(m,i) + (selIdx===i?actsHTML(i):"");
  }
  if (thinking) h += '<div class="thinking">'+esc(c.name||"상대")+" 입력 중…</div>";
  if (err) h += '<div class="err">'+esc(err)+"</div>";
  if (!log.length && !thinking && !err) h += '<div class="empty">먼저 말을 걸어봐.</div>';
  view.innerHTML=h;

  Array.prototype.forEach.call(view.querySelectorAll("[data-i]"), function(el){
    var i=+el.getAttribute("data-i");
    bindHold(el, function(){ selIdx = (selIdx===i) ? -1 : i; paint(); });
    var sx=null;
    el.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; }, {passive:true});
    el.addEventListener("touchend", function(e){
      if (sx===null) return;
      var dx = e.changedTouches[0].clientX - sx; sx=null;
      if (Math.abs(dx) < 55) return;
      var lg=getLog(c.id), m=lg[i];
      if (!m || !m.alts || m.alts.length<2) return;
      var n = (m.ai||0) + (dx<0 ? 1 : -1);
      if (n<0) n = m.alts.length-1;
      if (n>=m.alts.length) n = 0;
      m.ai=n; m.t=m.alts[n]; setLog(c.id,lg); paint();
    }, {passive:true});
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-cp]"), function(el){
    el.onclick=function(){ copyText(getLog(c.id)[+el.getAttribute("data-cp")].t); selIdx=-1; paint(); };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-ap],[data-an]"), function(el){
    el.onclick=function(){
      var i=+(el.getAttribute("data-ap")||el.getAttribute("data-an"));
      var dir = el.hasAttribute("data-an") ? 1 : -1;
      var lg=getLog(c.id), m=lg[i];
      if (!m||!m.alts) return;
      var n=(m.ai||0)+dir;
      if (n<0) n=m.alts.length-1;
      if (n>=m.alts.length) n=0;
      m.ai=n; m.t=m.alts[n]; setLog(c.id,lg); paint();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-ed]"), function(el){
    el.onclick=function(){ editIdx=+el.getAttribute("data-ed"); selIdx=-1; paint(); };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-del]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-del"), l=getLog(c.id);
      l.splice(i,1); setLog(c.id,l); selIdx=-1; paint();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-cut]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-cut"), l=getLog(c.id);
      if (!confirm("여기부터 뒤로 전부 지울까?")) return;
      l.splice(i); setLog(c.id,l); selIdx=-1; paint();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-save]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-save"), l=getLog(c.id);
      l[i].t = $("#eb").value; setLog(c.id,l); editIdx=-1; paint();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-cancel]"), function(el){
    el.onclick=function(){ editIdx=-1; paint(); };
  });
  if (editIdx<0) view.scrollTop = view.scrollHeight;
}

/* ---------- 명령어 ---------- */
var CMDS = {
  "/전환":"장면을 전환한다. 먼저 첫 줄에 [나레] 를 쓰고 시간과 장소가 어떻게 바뀌었는지 소설처럼 서술한 뒤 [/나레] 로 닫는다. 그 아래에 인물의 말풍선을 이어 쓴다. 나레이션은 이번 턴에만 쓰고 다음 턴부터는 쓰지 않는다.",
  "/문자":"이번 턴에는 인물이 문자를 보내온다. 첫 줄에 [문자] 를 쓰고, 한 줄에 하나씩 '이름: 내용' 형식으로 2~4줄 쓴 뒤 [/문자] 로 닫는다. 문자는 짧고 구어체로, 실제로 폰으로 칠 법하게 쓴다. 문자를 보내기 전후의 상황이 있으면 [문자] 앞이나 [/문자] 뒤에 지문으로 쓴다.",
  "/모브":"이번 턴에 지금 상황에 어울리는 새 인물을 한 명 등장시킨다. 그 인물의 이름을 정하고, 말할 때 줄 맨 앞에 대괄호로 그 이름을 적는다. 설정에 없는 단역이어도 된다.",
  "/일기":"이번 턴에는 인물이 쓴 일기만 보여준다. 첫 줄에 [일기] 를 쓰고 본문을 1인칭으로 쓴 뒤 [/일기] 로 닫는다. 12~18줄로 쓴다. 그날 있었던 일과 그때 든 생각을 같이 적되, 감정을 설명하지 말고 장면과 말로 드러낸다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다.",
  "/편지":"이번 턴에는 인물이 쓴 편지만 보여준다. 첫 줄에 [편지] 를 쓰고 본문을 쓴 뒤 [/편지] 로 닫는다. 10~16줄로 쓴다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다.",
  "/속마음":"이번 턴에는 인물의 지금 속마음만 보여준다. 첫 줄에 [속마음] 을 쓰고 1인칭으로 솔직하게 쓴 뒤 [/속마음] 으로 닫는다. 8~12줄로 쓴다. 겉으로 한 말과 다른 부분, 스스로도 인정하기 싫은 부분까지 들어가되 늘어지지 않게 쓴다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다.",
  "/플리":"이번 턴에는 노래 세 곡만 고른다. 첫 줄에 [플리] 를 쓰고, 아래 순서대로 한 줄에 하나씩 '제목 - 가수 :: 이유' 형식으로 쓴 뒤 [/플리] 로 닫는다. 첫 곡은 지금 상황에 어울려서 듣고 있는 곡, 둘째 곡은 상대를 생각하며 들었던 곡, 셋째 곡은 평소에 자주 듣던 곡이다. 이유는 한 문장으로 쓴다. 실제로 존재하는 곡만 쓰고, 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다."
};
var CMD_SAY = {
  "/전환":"(장면을 넘기자)",
  "/모브":"(누가 끼어들었어)", "/문자":"(문자가 왔어)",
  "/일기":"(일기를 보여줘)", "/편지":"(편지를 보여줘)",

}

  }
  if (cs.length){
    p.push("");
    p.push("# 같이 나오는 인물");
    cs.forEach(function(x){
      p.push("- "+x.name+": "+(x.prompt||""));

    });

    p.push("한 번의 답에 모든 인물이 다 등장할 필요는 없다. 그 자리에 있을 이유가 있는 인물만 나온다.");
    p.push("아래 분량 기준은 답 전체의 길이다. 인물 한 명당 길이가 아니다.");
  }
  if (c.world){ p.push(""); p.push("# 상황"); p.push(fillVars(c, c.world)); }
  p.push("");
  p.push("# 상대역");
  p.push((c.userName||"상대") + (c.userPrompt ? " — "+c.userPrompt : ""));
  if (c.note){ p.push(""); p.push("# 반드시 기억할 것"); p.push(fillVars(c, c.note)); }
  var rc=recapOf(c);
  if (rc){ p.push(""); p.push("# 지금까지의 이야기"); p.push(rc); }

function apiText(m){
  if (m.narr) return (m.r==="a" ? "(도입부 나레이션: " : "(상황: ") + m.t + ")";
  if (m.ooc) return "OOC: " + m.t.replace(/^\/ooc\s*/i,"");
  if (m.r==="u"){
    var k = cmdOf(m.t);
    if (k){
      var extra = m.t.slice(k.length).trim();
      return (CMD_SAY[k]||"") + (extra ? " " + extra : "");
    }
  }
  return m.t;
}

function cutLog(c, log){
  var b = breakOf(c);
  return (b>0 && b<log.length) ? log.slice(b) : log;
}
function fetchJSON(url, opt, ms){
  return new Promise(function(res, rej){
    var done=false;
    var tm=setTimeout(function(){ if(!done){ done=true; rej(new Error("응답이 너무 오래 걸려서 멈췄어. 잠시 뒤 다시 해보거나 최대 응답 길이를 줄여봐.")); } }, ms||90000);
    fetch(url, opt).then(function(r){ if(done) return; done=true; clearTimeout(tm); res(r); },
                         function(e){ if(done) return; done=true; clearTimeout(tm); rej(e); });
  });
}
function callAPI(c, log, turnInstr){
  log = cutLog(c, log);
  var sys=buildSystem(c, turnInstr), url, headers, body;
  var gen=genOf(c);
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    body={ model:cfg.model, max_tokens:gen.maxTokens,
      messages:[{role:"system",content:sys}].concat(log.map(function(m){
        return { role: m.r==="u"?"user":"assistant", content: apiText(m) };
      })) };
    if (gen.temp!==null) body.temperature=gen.temp;
    if (gen.topP!==null) body.top_p=gen.topP;
  } else {
    var contents=log.map(function(m){
      return { role: m.r==="u"?"user":"model", parts:[{ text: apiText(m) }] };
    });
    if (contents.length && contents[0].role==="model")
      contents.unshift({ role:"user", parts:[{ text:"(상황 시작)" }] });
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    body={ systemInstruction:{parts:[{text:sys}]}, contents:contents, generationConfig:{ maxOutputTokens:gen.maxTokens } };
    if (gen.temp!==null) body.generationConfig.temperature=gen.temp;
    if (gen.topP!==null) body.generationConfig.topP=gen.topP;
  }
  return fetch(url,{ method:"POST", headers:headers, body:JSON.stringify(body) })
  .then(function(res){
    return res.text().then(function(txt){
      var data=null; try{ data=JSON.parse(txt); }catch(e){}
      if (!res.ok){
        var em=(data&&data.error&&(data.error.message||data.error))||txt.slice(0,300);
        throw new Error("서버가 "+res.status+" 로 응답했어.\n"+em);
      }
      var out="";
      if (cfg.mode==="openai"){
        var ch=data&&data.choices&&data.choices[0];
        if(!ch) throw new Error("응답이 비어서 돌아왔어. 주소나 모델 이름을 확인해봐.");
        out=((ch.message&&ch.message.content)||ch.text||"").trim();
      } else {
        var cand=data&&data.candidates&&data.candidates[0];
        if(!cand) throw new Error("응답이 비어서 돌아왔어. 모델 이름이나 키를 확인해봐.");
        out=((cand.content&&cand.content.parts)||[]).map(function(x){return x.text||"";}).join("").trim();
      }
      if(!out) throw new Error("본문이 비어 있어. 응답 길이를 늘리거나 프롬프트를 바꿔봐.");
      return out;
    });
  });
}

function turn(){
  var c=cur(); if(!c||busy) return;
  if(!cfg.key){ paint("API 키가 없어. 오른쪽 위 설정에서 넣어줘."); return; }
  if(cfg.mode==="openai" && !cfg.base){ paint("API 주소가 비어 있어. 설정에서 넣어줘."); return; }
  busy=true; elSend.disabled=true; paint(null,true);
  var lg0 = getLog(c.id);
  var lastU = null;
  for (var q=lg0.length-1;q>=0;q--) if (lg0[q].r==="u"){ lastU=lg0[q]; break; }
  if (lastU && cmdOf(lastU.t)==="/전환" && !lastU.done){
    lastU.done = true;
    setLog(c.id, lg0);
    return makeRecap(c, function(){
      setBreak(c, getLog(c.id).length - 1);
      busy=false; elSend.disabled=false;
      turn();
    });
  }
  var lg = getLog(c.id).slice(), ti = null;
  if (regenAlt && lg.length && lg[lg.length-1].r==="a") lg = lg.slice(0,-1);
  for (var i=lg.length-1;i>=0;i--){
    if (lg[i].r==="u"){
      if (lg[i].sms) ti=CMDS["/문자"];
      else { var k=cmdOf(lg[i].t); if(k && !lg[i].ooc) ti=CMDS[k]; }
      break;
    }
  }
  callAPI(c,lg,ti).then(function(text){
    var l=getLog(c.id); l.push({r:"a",t:text}); setLog(c.id,l);
    busy=false; elSend.disabled=false; paint();
  }).catch(function(e){
    busy=false; elSend.disabled=false;
    paint(e.message||"연결에 실패했어.");
  });
}

var smsMode=false;
function paintSmsMode(){
  var b=$("#smsmode"); if(!b) return;
  b.style.color = smsMode ? "var(--accent)" : "";
  b.style.fontWeight = smsMode ? "600" : "";
  elInp.placeholder = smsMode ? "문자 보내기" : "메시지";
}
$("#smsmode").onclick=function(){ smsMode=!smsMode; paintSmsMode(); elInp.focus(); };

elSend.onclick=function(){
  var c=cur(); if(!c||busy) return;
  var t=elInp.value.trim(); if(!t) return;
  elInp.value=""; elInp.style.height="auto";

  if (screen==="sms"){ smsSend(t); return; }

  if (smsMode && !/^\//.test(t)){
    var lg2=getLog(c.id);
    lg2.push({ r:"u", t:"[문자]\n"+(c.userName||"나")+": "+t+"\n[/문자]", sms:true });
    setLog(c.id,lg2);
    selIdx=-1; paint(); turn();
    return;
  }

  var sms = parseSms(c, t);
  if (sms){
    if (sms.pick) return go("smslist", c.id);
    return makeThread(c, sms.names);
  }

  var l=getLog(c.id);
  var isOoc = /^\/ooc\b/i.test(t) || /^\(?\s*ooc\s*[:：]/i.test(t);
  var mn = t.match(/^@\s*[:：]\s*([\s\S]+)$/);
  if (mn) l.push({r:"u", t:mn[1].trim(), narr:true});
  else l.push(isOoc ? {r:"u",t:t,ooc:true} : {r:"u",t:t});
  setLog(c.id,l);
  selIdx=-1; paint(); turn();
};
$("#star").onclick=function(){
  var el=elInp, st=el.selectionStart, en=el.selectionEnd, v=el.value, cur;
  if (st!==en){ el.value = v.slice(0,st)+"*"+v.slice(st,en)+"*"+v.slice(en); cur = en+2; }
  else { el.value = v.slice(0,st)+"*"+v.slice(st); cur = st+1; }
  el.focus();
  try { el.setSelectionRange(cur,cur); } catch(e){}
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,140)+"px";
};
elInp.addEventListener("input",function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,140)+"px";
});
$("#regen").onclick=function(){
  var c=cur(); if(!c||busy) return;
  var l=getLog(c.id);
  if (l.length && l[l.length-1].r==="a" && !l[l.length-1].narr){ regenAlt=true; paint(); turn(); return; }
  while(l.length && l[l.length-1].r==="a") l.pop();
  setLog(c.id,l); paint(); turn();
};
$("#undo").onclick=function(){

  elInp.focus();
};
$("#rooms").onclick=function(){ var c=cur(); if(c) go("rooms", c.id); };
$("#reset").onclick=function(){
  var c=cur(); if(!c||busy) return;
  if(!confirm("이 캐릭터와의 대화를 처음부터 다시 시작할까?")) return;
  setLog(c.id, c.greeting?seedGreeting(c, c.greeting):[]);
  selIdx=-1; paint();
};

applyTheme();
render();
})();
</script>
</body>
</html>
