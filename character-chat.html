        else lines.push(pp.name||nm);
        if (pp.tagline) lines.push(pp.tagline);
        if (pp.prompt) lines.push("", pp.prompt);
        if (pp.style) lines.push("", "말투: "+pp.style);
      } else lines.push(nm);
      alert(lines.join("\n"));
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-scp]"), function(el){
    el.onclick=function(){ var t2=curThread(c); copyText(t2.log[+el.getAttribute("data-scp")].t); smsSel=-1; paintSms(); };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-sed]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-sed"), t2=curThread(c);
      var v=prompt("수정", t2.log[i].t);
      if (v!==null){ t2.log[i].t=v; saveThread(c,t2); }
      smsSel=-1; paintSms();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-sdel]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-sdel"), t2=curThread(c);
      t2.log.splice(i,1); saveThread(c,t2); smsSel=-1; paintSms();
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-scut]"), function(el){
    el.onclick=function(){
      var i=+el.getAttribute("data-scut"), t2=curThread(c);
      if (!confirm("여기부터 뒤로 전부 지울까?")) return;
      t2.log.splice(i); saveThread(c,t2); smsSel=-1; paintSms();

  if (smsKeep){ view.scrollTop = smsKeep; smsKeep = 0; }

function smsMenu(i){
  var c=cur(), t=curThread(c); if(!t) return;
  var m=t.log[i]; if(!m) return;
  var pick = prompt("1 복사 · 2 수정 · 3 삭제 · 4 여기부터 지우기", "1");
  if (!pick) return;
  pick = pick.trim();
  if (pick==="1") copyText(m.t);
  else if (pick==="2"){
    var v = prompt("수정", m.t);
    if (v!==null){ m.t=v; saveThread(c,t); paintSms(); }
  }
  else if (pick==="3"){ t.log.splice(i,1); saveThread(c,t); paintSms(); }
  else if (pick==="4"){ t.log.splice(i); saveThread(c,t); paintSms(); }
}

function buildSmsSystem(c, t){
  var p=[], cs=castOf(c);
  p.push("문자 메시지만 쓴다. 지문, 묘사, 설명, 별표는 한 줄도 쓰지 않는다.");
  p.push("상대가 사진을 보냈으면 그 사진을 본 사람처럼 반응한다. 사진에 무엇이 있는지 짚고 그에 맞게 답한다.");
  p.push("");
  p.push("# 인물");
  p.push((c.name||"") + " — " + (c.tagline||"") + " " + (c.prompt||""));
  cs.forEach(function(x){
    p.push(x.name+" — "+(x.tagline?x.tagline+" ":"")+(x.prompt||"")+(x.style?" / 말투: "+x.style:""));
    var xs = sampleText(x);
    if (xs){ p.push(x.name+"의 말투 예시:"); p.push(xs); }
  });
  p.push((c.userName||"나") + " — " + (c.userPrompt||""));
  if (c.world){ p.push(""); p.push("# 상황"); p.push(fillVars(c, c.world)); }
  p.push("");
  p.push("# 지금");
  p.push(timeNote(t));
  if (c.note){ p.push(""); p.push("# 반드시 기억할 것"); p.push(fillVars(c, c.note)); }
  var rc=recapOf(c);
  if (rc){ p.push(""); p.push("# 지금까지의 이야기"); p.push(rc); }
  var lore = pickLore(c);
  if (lore.length){
    p.push(""); p.push("# 설정집");
    lore.forEach(function(it){ p.push("- "+(it.title?it.title+": ":"")+fillVars(c, it.text)); });
  }
  var rl = getLog(c.id).slice(-8).map(function(m){
    return (m.r==="u" ? (c.userName||"나") : (c.name||"상대")) + ": " + m.t;
  }).join("\n");
  if (rl){ p.push(""); p.push("# 조금 전까지의 상황"); p.push(rl); }

  p.push("");
  p.push("# 이 문자방");
  p.push("참여자: " + t.parts.map(function(x){ return x.name; }).join(", ") + (t.random ? ", 그리고 상황에 맞는 상대 한 명" : ""));
  if (t.random) p.push(t.from + "가 지금 상황에 맞는 상대에게 보낸다. 설정에 없는 인물이어도 된다. 상대 이름을 정하고 그 이름으로 계속 쓴다.");

  p.push("");
  p.push("# 형식");
  p.push("한 줄에 하나씩 '이름: 내용' 형식으로만 쓴다. 다른 형식은 쓰지 않는다.");
  p.push("문자답게 구어체로, 실제로 폰으로 칠 법하게 쓴다.");
  p.push("길이는 사람이 실제로 폰으로 치는 만큼이다. 대개 한두 문장이면 끝난다. 'ㅇㅇ', '지금 감', '알겠어' 처럼 몇 글자로 끝나는 통도 흔하다.");
  p.push("할 말이 많거나 감정이 올라온 순간에는 길어져도 된다. 다만 그런 통은 가끔이어야 한다. 매번 길게 쓰면 문자가 아니라 편지가 된다.");
  p.push("문장을 도중에 끊지 말고 끝까지 맺는다. 한 문장을 두 통으로 쪼개지 않는다.");
  p.push("앞뒤가 이어지는 말은 한 통에 붙여 쓴다. 이유와 결론, 조건과 결과처럼 붙어야 뜻이 사는 말은 절대 나누지 않는다.");
  p.push("");
  p.push("# 나눌지 붙일지");
  p.push("뒤엣말이 앞엣말 없이는 뜻이 안 통하면 반드시 한 통에 붙인다.");
  p.push("서로 딴 얘기거나, 내 말에서 상대에게 넘어가는 자리면 나눠도 된다.");
  p.push("개수를 채우려고 억지로 나누지 않는다. 붙여 보낼 말이면 통을 줄인다.");
  p.push("매번 같은 통 수, 같은 길이로 쓰지 않는다. 한 통만 보내는 턴도 있고 네다섯 통이 이어지는 턴도 있다.");
  p.push("");
  p.push("# 공을 넘기는 법");
  p.push("매번 질문으로 끝내지 않는다. 질문으로 끝내는 것은 세 턴에 한 번이면 족하다. 한 턴에 물음표를 두 개 이상 쓰지 않는다.");
  p.push("되묻는 대신 궁금할 거리를 흘려두고 설명하지 않거나, 다 말하지 않고 하나를 덜 알려주거나, 아무것도 하지 않고 그냥 끝내도 된다.");
  var others = t.parts.filter(function(x){ return x.key!=="user"; });
  /* 통 수는 앱이 정한다. 기록을 흉내 내서 매번 같은 수가 나오는 걸 막는다 */
  var lastRun = 0;
  for (var q=t.log.length-1; q>=0; q--){
    if (t.log[q].mine || t.log[q].sys) break;
    lastRun++;
  }
  if (others.length >= 2){
    p.push("");
    p.push("# 단톡방이다");
    var many = Math.min(9, Math.max(4, others.length + 2 + Math.floor(Math.random()*3)));
    p.push("이번 턴에는 모두 합쳐 "+many+"통을 보낸다.");
    p.push("한 사람이 연달아 세 통을 넘기지 않는다.");
    p.push("같은 사람이 연달아 여러 번 말해도 된다. 한 사람이 던지면 다른 사람이 받고, 처음 사람이 다시 되받는 식으로 주고받는다.");
    p.push("사람마다 말수가 다르다. 말이 많은 사람은 여러 번, 조용한 사람은 한 마디만, 이번에 아예 말하지 않는 사람이 있어도 된다. 모두에게 똑같이 나눠 주지 않는다.");
    p.push("모든 말에 답이 달릴 필요는 없다. 누군가의 말이 그냥 묻히거나, 하던 얘기가 끊기고 다른 화제로 넘어가도 된다.");
    p.push("실제 단톡방처럼 쓴다. 회의록이나 순서대로 돌아가며 한 마디씩 하는 형식이 되면 안 된다.");
  } else {
    /* 개인톡은 1~3통. 1·2통이 자주, 3통은 가끔 */
    var pool=[1,1,1,2,2,2,2,3,3];
    var want=pool[Math.floor(Math.random()*pool.length)];
    if (want===lastRun) want = (want===1) ? 2 : want-1;
    p.push("");
    p.push("# 이번 턴 통 수");
    p.push("이번 턴에는 "+want+"통을 보낸다. 세 통을 넘기지 않는다.");
    if (lastRun) p.push("지난 턴에는 "+lastRun+"통을 보냈다. 매번 같은 수로 보내지 않는다.");
    p.push("다만 "+want+"통으로 나누면 말의 뜻이 끊기는 경우에는 통을 줄여 붙여 보낸다. 억지로 채우지 않는다.");
    p.push("앞선 기록에서 몇 통씩 보냈는지는 따라 하지 않는다. 이번 턴 통 수는 위에 적힌 수를 따른다.");
  }
  if (t.peek){
    p.push((c.userName||"나")+"는 이 문자방에 없다. 참여자들끼리만 주고받는다.");
    p.push("여러 명이면 서로 답하며 자연스럽게 이어간다.");
  } else {
    var npcs = t.parts.filter(function(x){ return x.key!=="user"; }).map(function(x){ return x.name; });
    p.push(npcs.join(", ")+"의 문자만 쓴다. "+(c.userName||"나")+"의 문자는 절대 대신 쓰지 않는다.");
  }
  return p.join("\n");
}

/* 이 방의 시각을 지금 장면 속 시각에 맞춘다. 방마다 한 번만 묻는다 */
function syncSceneTime(c, t, cb){
  if (t.timed || t.log.length || !cfg.key) return cb();
  var rl = getLog(c.id).slice(-10).map(function(m){
    return (m.r==="u" ? (c.userName||"나") : (c.name||"상대")) + ": " + m.t;
  }).join("\n");
  if (!rl){ t.timed=1; return cb(); }

/* 방마다 시작 시각을 정해두고, 메시지마다 몇 분씩 흘려보낸다 */
function stampAt(t){
  if (!t.start) t.start = Date.now();
  if (t.jump){ var j=t.jump; t.jump=0; return j; }
  var last = 0;
  for (var i=t.log.length-1;i>=0;i--) if (t.log[i].at){ last=t.log[i].at; break; }
  var base = last || t.start;
  return base + 60000*(1+Math.floor(Math.random()*4));
}
/* 인물에게 지금 몇 시인지, 지난 문자로부터 얼마나 지났는지 알려준다 */
function timeNote(t){
  var last=0;
  for (var i=t.log.length-1;i>=0;i--) if (t.log[i].at){ last=t.log[i].at; break; }
  var now = t.jump || last || t.start || Date.now();
  var out = "지금은 "+dayLabel(now)+" "+hhmm(now)+"이다.";
  if (last && now>last){
    var mins = Math.round((now-last)/60000);
    var gap;
    if (mins < 60) gap = mins+"분";
    else if (mins < 60*24) gap = Math.round(mins/60)+"시간";
    else gap = Math.round(mins/(60*24))+"일";
    out += " 마지막으로 주고받은 문자로부터 "+gap+"이 지났다. 그 사이에 각자 자기 시간을 보냈고, 인물은 그 간격을 알고 있다. 간격이 길면 왜 이제야 연락하는지, 그동안 무슨 일이 있었는지가 대화에 자연스럽게 묻어난다.";
  }
  var hh = new Date(now).getHours();
  if (hh>=0 && hh<6) out += " 새벽이라 대개는 자고 있을 시간이다.";
  else if (hh>=23) out += " 늦은 밤이다.";
  return out;
}
function two(n){ return (n<10?"0":"")+n; }
function hhmm(ms){
  var d=new Date(ms), h=d.getHours(), ap=h<12?"오전":"오후", hh=h%12; if(!hh) hh=12;
  return ap+" "+hh+":"+two(d.getMinutes());
}
function ymd(ms){ var d=new Date(ms); return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate()); }
function dayStart(ms){ var d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
/* 날짜 줄은 테마마다 다르다. base 는 이 방의 마지막 메시지 날 */
function dayLabel(ms, base){
  var d=new Date(ms), w=["일","월","화","수","목","금","토"][d.getDay()];
  var y=d.getFullYear(), mo=d.getMonth()+1, da=d.getDate();
  var th=cfg.smsTheme||"기본";
  var sameYear = new Date(base||ms).getFullYear()===y;
  if (th==="kakao") return y+"년 "+mo+"월 "+da+"일 "+w+"요일";
  if (th==="line")  return (sameYear ? "" : y+". ")+mo+". "+da+". ("+w+")";
  if (th==="imessage"){
    var diff=Math.round((dayStart(base||ms)-dayStart(ms))/86400000);
    var head;
    if (diff<=0) head="오늘";
    else if (diff===1) head="어제";
    else if (diff===2) head="그저께";
    else if (diff<=6) head=w+"요일";
    else head=(sameYear ? "" : y+"년 ")+mo+"월 "+da+"일 ("+w+")";
    return esc(diff<=0 ? hhmm(ms) : "("+head+") "+hhmm(ms));
  }
  return mo+"월 "+da+"일 "+w+"요일";
}
/* 모델한테 한 줄만 물어보는 용도 */
function askLLM(sys, content, cb, lim){
  var url, headers, body;
  var cap = lim || 300;
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    body={ model:cfg.model, max_tokens:cap,
           messages:[{role:"system",content:sys},{role:"user",content:content}] };
    /* 생각에 예산을 뺏기지 않게 이 요청은 추론을 끈다 */
    body.reasoning_effort="none";
    body.extra_body={ google:{ thinking_config:{ thinking_budget:0 } } };
  } else {
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    body={ systemInstruction:{parts:[{text:sys}]},
           contents:[{role:"user",parts:[{text:content}]}],
           generationConfig:{ maxOutputTokens:cap, thinkingConfig:{ thinkingBudget:0 } } };
  }
  fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(function(d){
      var out="";
      if (cfg.mode==="openai"){
        var ch=d&&d.choices&&d.choices[0];
        out=ch?((ch.message&&ch.message.content)||ch.text||""):"";
      } else {
        var cd=d&&d.candidates&&d.candidates[0];
        out=cd?((cd.content&&cd.content.parts)||[]).map(function(x){return x.text||"";}).join(""):"";
      }
      cb(String(out||"").trim());
    })
    .catch(function(){ cb(""); });
}
function tidyName(v){
  var line=String(v||"").split("\n").map(function(x){return x.trim();}).filter(Boolean)[0]||"";
  return line.replace(/^["'`\s]+|["'`\s]+$/g,"")
             .replace(/^(저장명|방\s*이름|이름)\s*[:：]\s*/,"")
             .replace(/^\(|\)$/g,"").slice(0,24);
}
/* 개인톡은 연락처 저장명, 단톡은 방 이름을 지어 준다 */

    sys = [

      owner+"가 "+them+"을(를) 자기 폰에 뭐라고 저장해 두었을지 정한다.",

/* 문자방에서 있었던 일을 두세 줄로 줄여 대화 쪽에 넘긴다 */
function smsDigest(c){
  var th = getThreads(c.id), out = [];
  th.forEach(function(t){
    if (t.sum) out.push((t.title||"문자") + " — " + t.sum);
  });
  return out.join("\n");
}
function refreshDigest(c, done){
  if (!cfg.key) return done && done();
  var th = getThreads(c.id), jobs = [];
  th.forEach(function(t){
    if (!t.log || t.log.length < 2) return;
    if (t.sumAt === t.log.length) return;      /* 그대로면 다시 안 만든다 */
    jobs.push(t);
  });
  if (!jobs.length) return done && done();
  var left = jobs.length;
  jobs.forEach(function(t){
    var script = t.log.slice(-24).map(function(m){ return m.who+": "+m.t; }).join("\n");
    var sys = [
      "너는 주고받은 문자를 두세 줄로 줄인다.",
      "무슨 일이 있었는지, 지금 둘 사이가 어떤지가 드러나야 한다.",
      "대사를 그대로 옮기지 말고 지난 일을 서술하듯 쓴다.",
      "반드시 "+(c.lang||"한국어")+"로 쓴다. 설명이나 머리말 없이 요약만 출력한다."
    ].join("\n");
    askLLM(sys, "문자:\n"+script+"\n\n두세 줄 요약만.", function(outTxt){
      var v = String(outTxt||"").trim().split("\n").filter(Boolean).slice(0,3).join(" ");
      if (v){
        var all = getThreads(c.id);
        for (var i=0;i<all.length;i++) if (all[i].id===t.id){
          all[i].sum = v.slice(0,300);
          all[i].sumAt = t.log.length;
          setThreads(c.id, all);
          break;
        }
      }
      if (--left <= 0 && done) done();
    }, 400);
  });
}

      var th=getThreads(c2.id), hit=null;
      for (var i=0;i<th.length;i++) if ((th[i].title||"")===nm){ hit=th[i]; break; }
      var fresh=false;
      if (!hit){
        /* 알림에 적힌 이름으로 방을 만든다. 단톡 같으면 인물을 다 넣고 */
        var group = /단톡|부대|팀|모임|방$/.test(nm);
        var names = [ c2.userName||"나" ];
        if (group){
          names = names.concat([ c2.name ].concat(castOf(c2).map(function(x){ return x.name; })).filter(Boolean));
        } else {
          var who = null;
          castOf(c2).forEach(function(x){ if (!who && nm.indexOf(x.name)>=0) who=x.name; });
          if (!who && c2.name && nm.indexOf(c2.name)>=0) who=c2.name;
          names.push(who || c2.name || "상대");
        }
        if (!makeThread(c2, names.slice(0,7))) return;
        var th2=getThreads(c2.id);
        for (var j=0;j<th2.length;j++) if (th2[j].id===smsCur){ th2[j].title=nm; setThreads(c2.id, th2); break; }
        fresh=true;
        hit=curThread(c2);
      }
      if (hit){ hit.unread=0; saveThread(c2, hit); smsCur=hit.id; }
      go("sms", c2.id);
      /* 알림이 떴다는 건 이미 문자가 와 있다는 뜻이다 */
      var t2=curThread(c2);
      if (t2 && (fresh || !t2.log.length)) setTimeout(smsTurn, 60);
    };

  Array.prototype.forEach.call(view.querySelectorAll("[data-ed]"), function(el){

  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-del]"), function(el){

  Array.prototype.forEach.call(view.querySelectorAll("[data-cut]"), function(el){

    p.push("아래는 위의 모든 규칙에 더해지는 지침이다. 위와 겹치거나 어긋나는 내용이 있으면 반드시 아래를 따른다.");
    p.push(psText);
  }
  if (turn){
    p.push("");
    p.push("# 이번 턴");
    p.push(turn);
  }
  return p.join("\n");
}

function apiText(m){
  if (m.narr) return (m.r==="a" ? "(도입부 나레이션: " : "(상황: ") + m.t + ")";
  if (m.ooc) return "OOC: " + fillVars(cur()||{}, m.t.replace(/^\/ooc\s*/i,""));
  if (m.r==="u"){
    var k = cmdOf(m.t);
    if (k){
      var extra = m.t.slice(k.length).trim();
      return (CMD_SAY[k]||"") + (extra ? " " + extra : "");
    }
  }
  return fillVars(cur()||{}, m.t);
}

function cutLog(c, log){
  var b = breakOf(c);
  var l = (b>0 && b<log.length) ? log.slice(b) : log;
  return l.filter(function(m){ return !m.secret; });
}
function fetchJSON(url, opt, ms){
  return new Promise(function(res, rej){
    var done=false;
    var tm=setTimeout(function(){ if(!done){ done=true; rej(new Error("응답이 너무 오래 걸려서 멈췄어. 잠시 뒤 다시 해보거나 최대 응답 길이를 줄여봐.")); } }, ms||90000);
    fetch(url, opt).then(function(r){ if(done) return; done=true; clearTimeout(tm); res(r); },
                         function(e){ if(done) return; done=true; clearTimeout(tm); rej(e); });
  });
}
function callAPI(c, log, turnInstr){
  log = cutLog(c, log);
  var sys=buildSystem(c, turnInstr), url, headers, body;
  var gen=genOf(c);
  /* 카드 명령어 턴은 댓글까지 다 나와야 하니 상한을 넉넉히 잡는다 */
  if (cmdTurn){
    gen = { temp:gen.temp, topP:gen.topP,
            maxTokens: Math.max(gen.maxTokens||2600, 4000) };
  }
  if (cfg.mode==="openai"){
    var b=(cfg.base||"").replace(/\/+$/,"");
    url = /chat\/completions$/.test(b) ? b : b+"/chat/completions";
    headers={ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    body={ model:cfg.model, max_tokens:gen.maxTokens,
      messages:[{role:"system",content:sys}].concat(log.map(function(m){
        return { role: m.r==="u"?"user":"assistant", content: apiText(m) };
      })) };
    if (gen.temp!==null) body.temperature=gen.temp;
    if (gen.topP!==null) body.top_p=gen.topP;
  } else {
    var contents=log.map(function(m){
      return { role: m.r==="u"?"user":"model", parts:[{ text: apiText(m) }] };
    });
    if (contents.length && contents[0].role==="model")
      contents.unshift({ role:"user", parts:[{ text:"(상황 시작)" }] });
    var gb=(cfg.base||"https://generativelanguage.googleapis.com").replace(/\/+$/,"");
    url = gb+"/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.key);
    headers={ "Content-Type":"application/json" };
    body={ systemInstruction:{parts:[{text:sys}]}, contents:contents, generationConfig:{ maxOutputTokens:gen.maxTokens } };
    if (gen.temp!==null) body.generationConfig.temperature=gen.temp;
    if (gen.topP!==null) body.generationConfig.topP=gen.topP;
  }
  applyThink(body, cfg.mode!=="openai");
  return fetchJSON(url,{ method:"POST", headers:headers, body:JSON.stringify(body) }, 120000)
  .then(function(res){
    return res.text().then(function(txt){
      var data=null; try{ data=JSON.parse(txt); }catch(e){}
      if (!res.ok){
        var em=(data&&data.error&&(data.error.message||data.error))||txt.slice(0,300);
        throw new Error("서버가 "+res.status+" 로 응답했어.\n"+em);
      }
      var out="";
      if (cfg.mode==="openai"){
        var ch=data&&data.choices&&data.choices[0];
        if(!ch) throw new Error("응답이 비어서 돌아왔어. 주소나 모델 이름을 확인해봐.");
        out=((ch.message&&ch.message.content)||ch.text||"").trim();
      } else {
        var cand=data&&data.candidates&&data.candidates[0];
        if(!cand) throw new Error("응답이 비어서 돌아왔어. 모델 이름이나 키를 확인해봐.");
        out=((cand.content&&cand.content.parts)||[]).map(function(x){return x.text||"";}).join("").trim();
      }
      if(!out) throw new Error("본문이 비어 있어. 응답 길이를 늘리거나 프롬프트를 바꿔봐.");
      return out;
    });
  });
}

/* 인물에 어울리는 손글씨를 한 번만 정한다 */
function syncHand(c){
  if (!c || c.hand || c.handAsking || !cfg.key) return;
  c.handAsking = true;
  var desc = [c.name, c.display, c.persona, c.prompt, c.summary]
    .filter(Boolean).join("\n").slice(0, 1800);
  if (!desc){ c.hand = "무난"; saveChars(); return; }
  var sys = "아래 인물에게 어울리는 손글씨를 하나 고른다. 아래 열다섯 중 하나만 그대로 답하고 다른 말은 쓰지 않는다.\n"
    + "필체는 성격보다 그 사람이 글씨를 어떻게 배웠고 얼마나 써왔는지를 따라간다. 겉인상만 보고 고르지 말고, 이 사람이 실제로 펜을 잡았을 때 어떤 손일지 생각해서 고른다.\n"
    + "단정 - 단정하고 반듯한 남자 글씨. 경찰이나 공무원처럼 규율 있는 일을 하는 사람\n"
    + "모범 - 반듯반듯 정돈된 글씨. 공부를 오래 한 사람, 성실한 사람\n"
    + "느좋 - 어른스럽고 감각 있는 글씨. 취향이 분명하고 여유 있는 사람\n"
    + "야무 - 귀엽지만 똑 부러지는 글씨. 야무지고 빈틈없는 사람\n"
    + "선생 - 흘려 쓴 글씨. 가르치는 사람, 손에 완전히 익은 사람\n"
    + "삐뚤 - 살짝 삐뚤빼뚤한 귀여운 글씨. 꾸밈없고 천진한 사람\n"
    + "또박 - 한 자 한 자 또박또박 눌러쓴 글씨. 신중하거나 성실한 사람\n"
    + "다정 - 부드럽게 흘려 쓴 글씨. 다정한 어른 남자\n"
    + "무난 - 평범하지만 잘 쓴 글씨. 특별히 튀지 않는 사람\n"
    + "꾸민 - 평범한데 멋을 낼 줄 아는 여자 글씨\n"
    + "무심 - 반듯한데 살짝 삐뚤게 쓰는 글씨. 무심하고 대충인 남자애\n"
    + "중성 - 성별도 나이도 가늠이 안 되는 어른 글씨\n"
    + "깜찍 - 작고 귀여운 글씨. 어리고 밝은 사람\n"
    + "힘없 - 손에 힘이 없어 잘 못 쓴 글씨. 글씨를 배운 적 없거나 몸이 약한 인물, 사람이 아닌 존재\n"
    + "두루 - 무난한 남자 글씨. 어른이든 어린 남자애든 두루 어울린다";
  var settled = false;
  function done(k){
    if (settled) return; settled = true;
    c.hand = HANDS[k] ? k : "무난";
    c.handAsking = false;
    try { saveChars(); } catch(e){}
    if (screen==="chat" && cur() && cur().id===c.id) paint();
  }
  setTimeout(function(){ done("무난"); }, 14000);
  askLLM(sys, desc, function(out){
    done(String(out||"").replace(/[^가-힣]/g,"").slice(0,2));
  }, 16);
}
function turn(){
  var c=cur(); if(!c||busy) return;
  if(!cfg.key){ paint("API 키가 없어. 오른쪽 위 설정에서 넣어줘."); return; }
  if(cfg.mode==="openai" && !cfg.base){ paint("API 주소가 비어 있어. 설정에서 넣어줘."); return; }
  busy=true; elSend.disabled=true; paint(null,true);
  var lg0 = getLog(c.id);
  var lastU = null;
  for (var q=lg0.length-1;q>=0;q--) if (lg0[q].r==="u"){ lastU=lg0[q]; break; }
  if (lastU && cmdOf(lastU.t)==="/전환" && !lastU.done){
    lastU.done = true;
    setLog(c.id, lg0);
    return makeRecap(c, function(){
      setBreak(c, getLog(c.id).length - 1);
      busy=false; elSend.disabled=false;
      turn();
    });
  }
  var lg = getLog(c.id).slice(), ti = null;
  cmdTurn = false;
  if (regenAlt && lg.length && lg[lg.length-1].r==="a") lg = lg.slice(0,-1);
  for (var i=lg.length-1;i>=0;i--){
    if (lg[i].r==="u"){
      var k=cmdOf(lg[i].t);
      if (k && !lg[i].ooc){ ti=CMDS[k]; if (CARD_CMDS[k]) cmdTurn = true; }
      if (lg[i].ooc) cmdTurn = true;
      break;
    }
  }
  turnGo(c, lg, ti);
}
function turnGo(c, lg, ti){
  callAPI(c,lg,ti).then(function(text){
    var l=getLog(c.id); l.push({r:"a",t:text}); setLog(c.id,l);
    busy=false; elSend.disabled=false; paint();
    /* 손글씨는 답이 다 온 뒤에, 손글씨 카드가 실제로 나왔을 때만 정한다 */
    if (/\[\s*(?:편지|일기|속마음)\s*\]/.test(text)) syncHand(c);
  }).catch(function(e){
    busy=false; elSend.disabled=false;
    paint(e.message||"연결에 실패했어.");
  });
}

elSend.onclick=function(){
  if (sendHeld){ sendHeld=false; return; }
  var c=cur(); if(!c||busy) return;
  var t=elInp.value.trim(); if(!t) return;
  elInp.value=""; elInp.style.height="auto";

  if (screen==="sms"){ smsSend(t); return; }
  stacked=false; paintSendBtn();

  if (/^\/비밀\s*$/.test(t)){ runSecret(); return; }



  var sms = parseSms(c, t);
  if (sms){
    if (sms.pick) return go("smslist", c.id);
    return makeThread(c, sms.names);
  }

  var l=getLog(c.id);
  var isOoc = /^\/ooc\b/i.test(t) || /^\(?\s*ooc\s*[:：]/i.test(t);
  var mn = t.match(/^@\s*[:：]\s*([\s\S]+)$/);
  if (mn) l.push({r:"u", t:mn[1].trim(), narr:true});
  else l.push(isOoc ? {r:"u",t:t,ooc:true} : {r:"u",t:t});
  setLog(c.id,l);
  selIdx=-1; paint(); turn();
};
$("#star").onclick=function(){
  var el=elInp, st=el.selectionStart, en=el.selectionEnd, v=el.value, cur;

  else { el.value = v.slice(0,st)+"*"+v.slice(st); cur = st+1; }
  el.focus();
  try { el.setSelectionRange(cur,cur); } catch(e){}
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,140)+"px";

function runSecret(){
  var c=cur(); if(!c||busy) return;
  if (!cfg.key) return alert("API 키부터 넣어줘.");
  var lg=cutLog(c, getLog(c.id)).slice(-24);
  if (!lg.length) return alert("대화가 좀 쌓인 뒤에 눌러줘.");
  busy=true; paint(null,true);
  var script=lg.map(function(m){ return (m.r==="u" ? udispOf(c) : dispOf(c))+": "+apiText(m); }).join("\n");
  var sys=[
    "너는 지금까지의 장면을 읽고, 인물이 겉으로 드러내지 않은 것을 정리한다.",
    "이것은 이야기 밖에서 보는 메모다. 대사나 지문을 쓰지 않는다.",
    "다음 세 가지만 각각 두세 줄로 쓴다.",
    "숨긴 마음 — 겉으로 한 말과 실제로 든 생각이 어떻게 달랐는지.",
    "아직 말하지 않은 것 — 알고 있으면서 꺼내지 않은 사실.",
    "앞으로 터질 것 — 지금 깔려 있는 불씨.",
    "각 줄은 '항목: 내용' 형식으로 쓴다.",
    "반드시 "+(c.lang||"한국어")+"로 쓴다."
  ].join("\n");
  askLLM(sys, "인물: "+(c.name||"")+" — "+(c.prompt||"").slice(0,400)+"\n\n장면:\n"+script,
    function(out){
      busy=false;
      var v=String(out||"").trim();
      if (!v){ paint("비밀을 못 불러왔어."); return; }
      var l=getLog(c.id);
      l.push({ r:"a", t:"[비밀]\n"+v+"\n[/비밀]", secret:true });
      setLog(c.id,l); paint();
    }, 3000);
}

/* 키보드가 올라오면 앱을 실제로 보이는 영역에 딱 맞춘다.
   dvh 는 키보드를 계산에 넣지 않아서 그냥 두면 아래에 빈 자리가 남는다 */
(function(){
  var vv = window.visualViewport;
  if (!vv) return;
  var st = document.body.style, app = document.getElementById("app");
  var on = false;
  /* 키보드가 올라오기 직전에 맨 아래를 보고 있었는지 기억해둔다 */
  var wasBottom = true;
  function vw(){ return document.getElementById("view"); }
  function markBottom(){
    var v = vw(); if (!v) return;
    wasBottom = (v.scrollHeight - v.scrollTop - v.clientHeight) < 140;
  }
  function toBottom(){
    var v = vw(); if (!v || !wasBottom) return;
    v.scrollTop = v.scrollHeight;
    requestAnimationFrame(function(){ if (wasBottom) v.scrollTop = v.scrollHeight; });
  }
  function sync(){
    var vh = vv.height, off = vv.offsetTop || 0;
    var full = Math.max(window.innerHeight||0, document.documentElement.clientHeight||0);
    var open = (full - vh) > 90;
    if (open){
      if (!on){ on = true; document.body.setAttribute("data-kb","1"); }
      st.setProperty("--sab","0");
      st.setProperty("--dockb","0px");
      if (app){
        app.style.position  = "fixed";
        app.style.left = "0"; app.style.right = "0"; app.style.top = "0";
        app.style.height    = Math.round(vh) + "px";
        app.style.transform = "translateY(" + Math.round(off) + "px)";
      }
      var se = document.scrollingElement || document.documentElement;
      if (se && se.scrollTop !== 0) se.scrollTop = 0;
      /* 화면이 줄어든 만큼 대화도 따라 내려가야 마지막 말이 보인다 */
      toBottom();
      setTimeout(toBottom, 60);
    } else if (on || app){
      on = false;
      document.body.removeAttribute("data-kb");
      st.setProperty("--sab","1");
      st.setProperty("--dockb","9px");
      if (app){
        app.style.position=""; app.style.left=""; app.style.right="";
        app.style.top=""; app.style.height=""; app.style.transform="";
      }
    }
  }
  vv.addEventListener("resize", function(){ if(!on) markBottom(); sync(); });
  vv.addEventListener("scroll", sync);
  window.addEventListener("orientationchange", function(){ setTimeout(sync,300); });
  document.addEventListener("focusin", function(){ markBottom(); setTimeout(sync,50); setTimeout(sync,300); });
  document.addEventListener("focusout", function(){ setTimeout(sync,50); setTimeout(sync,300); });
  sync();
})();
})();
